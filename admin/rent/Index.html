<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentalNow — Admin</title>
<meta name="theme-color" content="#0A2C43">
<link rel="icon" type="image/png" sizes="32x32" href="../../Rent/favicon-32.png">
<style>
:root{
  --p:#0F3D5C; --deep:#0A2C43; --y:#F5A623; --y-t:#FFF4E0; --y-bd:#F0D9A8;
  --ok:#06C167; --ok-d:#048A45; --ok-t:#E7F9F0;
  --dg:#E11900; --dg-t:#FDECEA; --vi:#5B21B6; --vi-t:#EDE9FE;
  --t1:#0A0A0A; --t2:#454545; --t3:#6B6B6B; --t4:#9C9C9C;
  --bg:#F4F1EA; --card:#fff; --bd:#E4E0D8;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);line-height:1.5;font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:var(--deep);color:#fff;padding:12px 0}
.top .in{display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:10px}
.top b{font-size:16px;font-weight:875;letter-spacing:-.03em;flex:1}
.top b span{display:block;font-size:10px;font-weight:650;color:#8FAEC4;letter-spacing:0}
.top a{color:#BFD4E2;font-size:13px;font-weight:750;text-decoration:none;white-space:nowrap}
.top a:hover{color:#fff}
h2{font-size:19px;font-weight:875;letter-spacing:-.03em;margin:24px 0 4px}
.sub{font-size:13px;color:var(--t3);margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;
  font-family:inherit;cursor:pointer;background:var(--p);color:#fff}
.btn.g{background:var(--card);color:var(--t1);border:1.5px solid var(--bd)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
/* ── subscription board ─────────────────────────────────────────────── */
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.sb-col{background:var(--card);border:1px solid var(--bd);border-radius:13px;
  padding:12px;position:relative;overflow:hidden}
.sb-col:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd)}
.sb-col.ok:before{background:#06C167}
.sb-col.warn:before{background:#F5A623}
.sb-col.vi:before{background:#5B21B6}
.sb-col.bad:before{background:#E11900}
.sb-h{display:flex;align-items:center;gap:8px}
.sb-h b{font-size:13px;letter-spacing:-.01em}
.sb-n{margin-left:auto;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums}
.sb-col.ok .sb-n{color:#048A45}
.sb-col.warn .sb-n{color:#8A5A06}
.sb-col.vi .sb-n{color:#5B21B6}
.sb-col.bad .sb-n{color:#E11900}
.sb-note{font-size:11px;color:var(--t3);margin:2px 0 8px;line-height:1.35;min-height:28px}
.sb-row{display:flex;align-items:center;gap:8px;padding:7px 0;
  border-top:1px solid #F1EDE5;cursor:pointer}
.sb-row:hover{background:#FDFBF7}
.sb-nm{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-sub{font-size:10.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-when{font-size:11px;font-weight:750;white-space:nowrap;flex:none}
.sb-empty{font-size:11.5px;color:var(--t3);padding:7px 0;border-top:1px solid #F1EDE5}
.sb-more{font-size:11px;color:var(--t3);padding-top:7px}
@media (max-width:900px){
  .sb{grid-template-columns:1fr 1fr}
  .sb-note{min-height:0}
}
@media (max-width:560px){ .sb{grid-template-columns:1fr} }
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:13px 14px;
  border-left:4px solid var(--bd)}
.kpi .l{font-size:10px;font-weight:850;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:22px;font-weight:900;letter-spacing:-.035em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--t4);margin-top:1px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--y)}
.kpi.bad{border-left-color:var(--dg)} .kpi.vi{border-left-color:var(--vi)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.card h3{font-size:14.5px;font-weight:875;letter-spacing:-.02em;margin-bottom:3px}
.card .h{font-size:12px;color:var(--t3);margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;font-weight:850;color:var(--t3);text-transform:uppercase;
  letter-spacing:.05em;padding:9px 8px;border-bottom:1.5px solid var(--bd);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid #F0EDE6;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:800;letter-spacing:-.01em}
.nm span{display:block;font-size:11.5px;font-weight:600;color:var(--t3)}
.tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 9px;
  border-radius:99px;white-space:nowrap}
.tag.paying{background:var(--ok-t);color:var(--ok-d)}
.tag.trial{background:#E8F0F7;color:var(--p)}
.tag.lapsed{background:var(--dg-t);color:var(--dg)}
.tag.dormant{background:var(--y-t);color:#95610A}
.tag.never{background:#EDEAE4;color:var(--t3)}
.tag.vi{background:var(--vi-t);color:var(--vi)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.chip{background:var(--card);border:1.5px solid var(--bd);border-radius:99px;padding:7px 14px;
  font-size:12.5px;font-weight:750;color:var(--t2);cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.empty{text-align:center;padding:34px 12px;color:var(--t3);font-size:13.5px}
.loading{text-align:center;padding:28px;color:var(--t4);font-size:13px}
.err{background:var(--dg-t);border:1px solid var(--dg);border-radius:11px;padding:12px 14px;
  font-size:13px;color:#8A1200;margin-top:12px}
.gate{max-width:380px;margin:70px auto;background:var(--card);border:1px solid var(--bd);
  border-radius:16px;padding:26px}
.gate h1{font-size:19px;font-weight:875;letter-spacing:-.03em;margin-bottom:5px}
.gate p{font-size:13px;color:var(--t3);margin-bottom:16px}
.in{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:12px 13px;font-size:15px;
  font-family:inherit;margin-bottom:10px}
.in:focus{outline:0;border-color:var(--y)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--t3);font-size:12.5px}
.line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;
  border-bottom:1px solid #F4F1EA}
.line:last-child{border-bottom:0}
.line b{font-weight:850;font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:rgba(6,28,44,.6);z-index:80;display:flex;
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.sheet .box{background:var(--bg);border-radius:16px;max-width:840px;width:100%;padding:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);
  color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:750;z-index:99;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .hide-s{display:none}
}
@media(max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<div class="top"><div class="wrap in">
  <img src="../../Rent/icon-192.png" alt="">
  <b>RentalNow<span>Admin</span></b>
  <a href="../">← HisaabNow admin</a>
  <a href="../#promo">Promo codes</a>
</div></div>

<div id="gate" class="gate">
  <h1>Admin sign-in</h1>
  <p>Same login as the HisaabNow panel.</p>
  <input class="in" id="g-phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit phone">
  <button class="btn" style="width:100%" id="g-send" onclick="sendOtp()">Send OTP</button>
  <div id="g-otp" style="display:none;margin-top:12px">
    <input class="in" id="g-code" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit code">
    <button class="btn" style="width:100%" onclick="verifyOtp()">Verify</button>
  </div>
  <div id="g-err" class="err" style="display:none"></div>
  <div id="recap"></div>
</div>

<div id="app" class="wrap" style="display:none;padding-bottom:60px"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFunctions, httpsCallable }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';
import { initializeAppCheck, ReCaptchaV3Provider }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';

/* Copied verbatim from the HisaabNow admin panel — same Firebase project, same
   App Check site key. Not retyped from memory: an admin panel that cannot
   authenticate is indistinguishable from one whose backend is broken. */
const app = initializeApp({
  apiKey: "AIzaSyB8v9gYxCg4qBfLl2J08D9TeUVygKVAqC8",
  authDomain: "panshopmanager.firebaseapp.com",
  projectId: "panshopmanager",
  storageBucket: "panshopmanager.firebasestorage.app",
  messagingSenderId: "448042777087",
  appId: "1:448042777087:web:9b4c4a0bd4dbc425bccfca",
  measurementId: "G-YVLCREDL6Q"
});
/* Required: the callables enforce App Check. To debug locally, run
   self.FIREBASE_APPCHECK_DEBUG_TOKEN = true in the console BEFORE load, then
   whitelist the printed token under Firebase → App Check → Apps → Manage
   debug tokens. */
try {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LfZQcYsAAAAAL9TGObuIHv-SllzTi_aHkmNdlnH'),
    isTokenAutoRefreshEnabled: true
  });
} catch(e){ console.error('App Check init failed:', e); }

const auth = getAuth(app);
const fns  = getFunctions(app, 'us-central1');
const call = (n, d) => httpsCallable(fns, n)(d || {}).then(r => r.data);

const $ = id => document.getElementById(id);
const money = n => '\u20B9' + Math.round(Number(n)||0).toLocaleString('en-IN');
const esc = x => String(x==null?'':x).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = ms => ms ? new Date(ms).toLocaleDateString('en-IN',
  {day:'numeric',month:'short',year:'numeric'}) : '—';
const ago = ms => {
  if (!ms) return 'never';
  const d = Math.floor((Date.now()-ms)/864e5);
  return d<=0 ? 'today' : d===1 ? 'yesterday' : d+' days ago';
};
function toast(m){
  const el=document.createElement('div'); el.className='toast'; el.textContent=m;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 3200);
}

/* ── auth gate ─────────────────────────────────────────────────────────── */
let confirmation = null;
window.sendOtp = async function(){
  const ph = ($('g-phone').value||'').replace(/[^0-9]/g,'').slice(-10);
  if (ph.length !== 10) return showErr('Enter a 10-digit number');
  try {
    if (!window._rv) window._rv = new RecaptchaVerifier(auth,'recap',{size:'invisible'});
    confirmation = await signInWithPhoneNumber(auth, '+91'+ph, window._rv);
    $('g-otp').style.display='block'; $('g-send').disabled=true; showErr('');
  } catch(e){
    /* reCAPTCHA verifiers are single-use; a failed attempt leaves a dead one
       behind and every retry then fails for a different reason than the first. */
    try { window._rv && window._rv.clear(); } catch(_){} window._rv = null;
    showErr(e.code === 'auth/invalid-app-credential'
      ? 'Add this domain under Firebase → Authentication → Authorized domains'
      : (e.message||'Could not send the code'));
  }
};
window.verifyOtp = async function(){
  const c = ($('g-code').value||'').replace(/[^0-9]/g,'');
  if (!confirmation) return showErr('Send the code first');
  try { await confirmation.confirm(c); }
  catch(e){ showErr('Wrong code — try again'); }
};
function showErr(m){
  const el=$('g-err'); el.style.display = m?'block':'none'; el.textContent=m||'';
}
onAuthStateChanged(auth, u => {
  $('gate').style.display = u ? 'none' : 'block';
  $('app').style.display  = u ? 'block' : 'none';
  if (u) load();
});
window.logout = () => signOut(auth);

/* ── data ──────────────────────────────────────────────────────────────── */
let SHOPS = [], TOTALS = {}, FILTER = 'all', BUSY = false;

async function load(){
  if (BUSY) return; BUSY = true;
  $('app').innerHTML = '<div class="loading">Loading shops…</div>';
  try {
    const d = await call('adminRentalShops');
    SHOPS = d.shops || []; TOTALS = d.totals || {};
    render();
  } catch(e){
    console.error(e);
    /* "internal" on its own sent the reader looking at this page, which is
       not where the fault is: it is the Cloud Function's own error code for
       an unhandled throw, so the stack trace only exists in the function
       logs. Name the function and say where to look. */
    const code = (e && e.code) || '';
    const isInternal = /internal/.test(code) || /internal/.test(e.message||'');
    $('app').innerHTML = '<div class="err"><b>Could not load.</b><br>' +
      esc(e.message||'') +
      (isInternal ? '<div style="margin-top:8px;font-weight:400">The <code>adminRentalShops</code> '
        + 'function threw server-side. The real error is in Firebase Console \u2192 Functions '
        + '\u2192 Logs \u2192 adminRentalShops \u2014 nothing on this page can show it.</div>' : '') +
      '<div style="margin-top:10px"><button class="btn sm" onclick="location.reload()">Retry</button>' +
      ' <button class="btn g sm" onclick="logout()">Sign out</button></div></div>';
  }
  BUSY = false;
}
window.load = load;
window.setFilter = f => { FILTER = f; render(); };

const TAG = { paying:'paying', trial:'trial', lapsed:'lapsed', dormant:'dormant',
              'never-started':'never' };
const LABEL = { paying:'PAYING', trial:'TRIAL', lapsed:'LAPSED', dormant:'DORMANT',
                'never-started':'NEVER STARTED' };

/* ── who is live, who is due, who is blocked ─────────────────────────────
   The status chips answer "what bucket is this shop in". This answers the
   question actually asked at the start of a month: who is paying me right
   now, who must be chased this week, and who has already stopped.

   RENEWAL DUE needs a paid-expiry date per shop, and adminRentalShops does
   not return one today — it sends status and tier only. So expiry is read
   defensively from whichever field the function may grow later, and until
   one appears every paying shop simply counts as LIVE rather than being
   guessed at. To light this up, have adminRentalShops include the shop's
   subscriptionExpiry as epoch millis on each row (any of the names below).
   Nothing else here needs to change. */
function expiryOf(s){
  const v = s.expiryAt || s.expiryMs || s.subExpiryMs || s.subscriptionExpiry
         || s.paidUntil || s.validTill;
  if (!v) return 0;
  const n = typeof v === 'number' ? v : Date.parse(v);
  return isFinite(n) ? n : 0;
}
/* Whole calendar days to expiry — today is 0, tomorrow 1 — matching the
   client app's own count so admin and shop never disagree by a day. */
function daysTo(ms){
  if (!ms) return null;
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d1 = new Date(ms); d1.setHours(0,0,0,0);
  return Math.round((d1 - d0) / 864e5);
}
function subBoard(){
  const live=[], due=[], blocked=[], trials=[];
  SHOPS.forEach(s => {
    if (s.status === 'paying'){
      const n = daysTo(expiryOf(s));
      if (n !== null && n <= 7) due.push({ s, n }); else live.push({ s, n });
    } else if (s.status === 'lapsed') blocked.push({ s, n:daysTo(expiryOf(s)) });
    else if (s.status === 'trial')    trials.push({ s, n:daysTo(s.trialEndsAt) });
  });
  due.sort((a,b)=>(a.n??99)-(b.n??99));
  blocked.sort((a,b)=>(b.n??-99)-(a.n??-99));
  trials.sort((a,b)=>(a.n??99)-(b.n??99));

  const when = n => n===null ? '' : (n<0 ? Math.abs(n)+'d ago'
    : n===0 ? 'today' : n===1 ? 'tomorrow' : 'in '+n+'d');
  const col = (title, note, list, cls, tail) => `
    <div class="sb-col ${cls}">
      <div class="sb-h"><b>${title}</b><span class="sb-n">${list.length}</span></div>
      <div class="sb-note">${note}</div>
      ${!list.length ? '<div class="sb-empty">None</div>' : list.slice(0,12).map(x=>`
        <div class="sb-row" onclick="openShop('${esc(x.s.shopId)}')">
          <div class="grow">
            <div class="sb-nm">${esc(x.s.name||'(unnamed)')}</div>
            <div class="sb-sub">${esc(x.s.city||'')}${x.s.tier?' \u00b7 '+esc(String(x.s.tier).toUpperCase()):''}</div>
          </div>
          <div class="sb-when">${tail(x)}</div>
        </div>`).join('') + (list.length>12
          ? `<div class="sb-more">+${list.length-12} more</div>` : '')}
    </div>`;

  return `
    <h2>Subscriptions</h2>
    <div class="sub">Who is paying now, who to chase this week, who has stopped.</div>
    <div class="sb">
      ${col('Live','Paid and renting out.',live,'ok',
            x => x.n===null ? '<span class="muted">active</span>' : when(x.n))}
      ${col('Renewal due','Expires within 7 days \u2014 chase these.',due,'warn',
            x => when(x.n))}
      ${col('On trial','Not paid yet.',trials,'vi',
            x => x.n===null ? '' : when(x.n))}
      ${col('Blocked','Expired \u2014 cannot rent out. Returns still work.',blocked,'bad',
            x => x.n===null ? '<span class="muted">expired</span>' : when(x.n))}
    </div>`;
}

function render(){
  const t = TOTALS;
  const now = Date.now();
  /* Trials ending within 3 days, and shops that set up but never rented. These
     are the two lists worth acting on; everything else is context. */
  const endingSoon = SHOPS.filter(s => s.status==='trial' && s.trialEndsAt &&
    s.trialEndsAt - now < 3*864e5 && s.trialEndsAt > now);
  const stalled = SHOPS.filter(s => s.status==='never-started' && (s.bikes||0) > 0);

  const rows = SHOPS.filter(s => FILTER==='all' || s.status===FILTER);

  $('app').innerHTML = `
    <h2>Overview</h2>
    <div class="sub">${SHOPS.length} shop${SHOPS.length===1?'':'s'} ·
      refreshed ${new Date().toLocaleTimeString('en-IN')}
      <button class="btn g sm" style="margin-left:8px" onclick="load()">Refresh</button>
      <button class="btn g sm" onclick="logout()">Sign out</button></div>

    <div class="kpis">
      <div class="kpi"><div class="l">Shops</div><div class="v">${t.shops||0}</div>
        <div class="s">${t.bikes||0} bikes total</div></div>
      <div class="kpi ok"><div class="l">Paying</div><div class="v">${t.paying||0}</div>
        <div class="s">${t.dormant||0} gone quiet</div></div>
      <div class="kpi"><div class="l">On trial</div><div class="v">${t.trial||0}</div>
        <div class="s">${endingSoon.length} ending in 3 days</div></div>
      <div class="kpi bad"><div class="l">Lapsed</div><div class="v">${t.lapsed||0}</div>
        <div class="s">were paying</div></div>
      <div class="kpi warn"><div class="l">Never started</div><div class="v">${t.neverStarted||0}</div>
        <div class="s">${stalled.length} have bikes</div></div>
      <div class="kpi vi"><div class="l">MRR</div><div class="v">${money(t.mrr||0)}</div>
        <div class="s">${money((t.mrr||0)*12)} a year</div></div>
    </div>

    ${subBoard()}

    ${endingSoon.length ? actionCard('Trials ending in 3 days',
      'Worth a call before the trial runs out, not after.', endingSoon,
      s => day(s.trialEndsAt)) : ''}

    ${stalled.length ? actionCard('Set up but never rented',
      'Bikes added, prices set, and not one rental. Something stopped them.', stalled,
      s => s.bikes + ' bikes · ' + ago(s.createdAt)) : ''}

    <h2>Shops</h2>
    <div class="sub">Sorted by who needs a call first.</div>
    <div class="filters">
      ${['all','never-started','dormant','lapsed','trial','paying'].map(f =>
        `<span class="chip ${FILTER===f?'on':''}" onclick="setFilter('${f}')">${
          f==='all' ? 'All ('+SHOPS.length+')'
                    : LABEL[f].toLowerCase() + ' (' + SHOPS.filter(s=>s.status===f).length + ')'
        }</span>`).join('')}
    </div>
    <div class="card" style="padding:6px 10px">
      ${rows.length ? `<table>
        <thead><tr>
          <th>Shop</th><th class="hide-s">City</th>
          <th class="num">Bikes</th><th class="num hide-s">Out</th>
          <th class="num">30d</th><th class="num hide-s">Deposits</th>
          <th>Plan</th><th>Status</th><th class="hide-s">Last rental</th>
        </tr></thead>
        <tbody>${rows.map(s => `
          <tr onclick="openShop('${esc(s.shopId)}')">
            <td class="nm">${esc(s.name)}<span>${esc(s.shopId.slice(0,12))}…</span></td>
            <td class="hide-s muted">${esc(s.city)||'—'}</td>
            <td class="num">${s.bikes==null?'—':s.bikes}</td>
            <td class="num hide-s">${s.openRentals==null?'—':s.openRentals}</td>
            <td class="num">${s.rentals30==null?'—':s.rentals30}</td>
            <td class="num hide-s">${s.depositsHeld?money(s.depositsHeld):'—'}</td>
            <td>${s.tier?`<span class="tag vi">${esc(s.tier.toUpperCase())}</span>`:'<span class="muted">—</span>'}</td>
            <td><span class="tag ${TAG[s.status]}">${LABEL[s.status]}</span></td>
            <td class="hide-s muted">${ago(s.lastRentalAt)}</td>
          </tr>`).join('')}</tbody>
      </table>` : '<div class="empty">No shops in this filter.</div>'}
    </div>`;
}

function actionCard(title, hint, list, right){
  return `<div class="card">
    <h3>${esc(title)} <span class="tag warn" style="background:var(--y-t);color:#95610A">${list.length}</span></h3>
    <div class="h">${esc(hint)}</div>
    ${list.slice(0,8).map(s => `<div class="line">
      <span class="grow"><b style="font-weight:800">${esc(s.name)}</b>
        <span class="muted"> · ${esc(s.city)||'no city'}</span></span>
      <span class="muted" style="margin-right:10px">${esc(right(s))}</span>
      <button class="btn g sm" onclick="event.stopPropagation();openShop('${esc(s.shopId)}')">Open</button>
    </div>`).join('')}
    ${list.length>8?`<div class="muted" style="margin-top:8px">and ${list.length-8} more</div>`:''}
  </div>`;
}

/* ── one shop, for when they ring ──────────────────────────────────────── */
window.openShop = async function(shopId){
  const w = document.createElement('div'); w.className='sheet';
  w.innerHTML = '<div class="box"><div class="loading">Loading…</div></div>';
  w.onclick = e => { if (e.target===w) w.remove(); };
  document.body.appendChild(w);
  let d;
  try { d = await call('adminRentalShop', { shopId }); }
  catch(e){ w.querySelector('.box').innerHTML =
    '<div class="err">'+esc(e.message||'Could not load')+'</div>'; return; }

  const s = d.shop||{}, ent = d.entitlement||{};
  const openR = (d.rentals||[]).filter(r=>r.status==='open');
  const held  = (d.bookings||[]).filter(b=>b.status==='held');
  const unpriced = (d.rates||[]).filter(r => {
    const t=r.tiers||{}; return !((+t.h3||0)+(+t.h6||0)+(+t.h12||0)+(+t.h24||0)+(+t.d7||0)); });
  const idle = (d.vehicles||[]).filter(v => !(d.rentals||[]).some(r=>r.vehicleId===v.id));

  w.querySelector('.box').innerHTML = `
    <div class="row" style="margin-bottom:12px">
      <div class="grow"><h2 style="margin:0">${esc(s.name||'(unnamed)')}</h2>
        <div class="muted">${esc(s.city||'no city')} · ${esc(shopId)}</div></div>
      ${d.ownerPhone?`<a class="btn sm" style="text-decoration:none"
        href="https://wa.me/${esc(String(d.ownerPhone).replace(/[^0-9]/g,''))}"
        target="_blank">WhatsApp owner</a>`:''}
      <button class="btn g sm" onclick="this.closest('.sheet').remove()">Close</button>
    </div>

    <div class="card">
      <h3>Subscription</h3>
      <div class="h">What the app itself reads, field by field — so you can answer
        &ldquo;why does it say my trial ended&rdquo; without opening Firestore.</div>
      <div class="line"><span>Verdict</span><b class="tag ${
        ent.verdict==='paid'?'paying':(ent.verdict==='trial'?'trial':'lapsed')
      }">${esc(String(ent.verdict||'?').toUpperCase())}</b></div>
      <div class="line"><span>Signed up</span><b>${day(s.createdAtMs)}</b></div>
      ${(ent.fields||[]).length ? (ent.fields||[]).map(f=>`<div class="line">
        <span>${esc(f.field)}</span><b>${day(f.asMs)} ${f.inFuture?'✓':'· past'}</b></div>`).join('')
        : '<div class="line"><span>Expiry field</span><b class="muted">none found</b></div>'}
      ${(d.receipts||[]).length?`<div class="line"><span>Last payment</span>
        <b>${money((d.receipts[0]||{}).amount||0)}</b></div>`:''}
    </div>

    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi"><div class="l">Bikes</div><div class="v">${(d.vehicles||[]).length}</div>
        <div class="s">${idle.length} never rented</div></div>
      <div class="kpi ok"><div class="l">Out now</div><div class="v">${openR.length}</div></div>
      <div class="kpi vi"><div class="l">Bookings</div><div class="v">${held.length}</div></div>
      <div class="kpi warn"><div class="l">Deposits held</div>
        <div class="v" style="font-size:17px">${money(openR.reduce((t,r)=>t+(+r.depositHeld||0),0))}</div></div>
    </div>

    ${unpriced.length?`<div class="card" style="background:var(--y-t);border-color:var(--y-bd)">
      <h3>${unpriced.length} rate card${unpriced.length===1?'':'s'} still at ₹0</h3>
      <div class="h">${unpriced.map(r=>esc(r.model)).join(', ')} — bikes on these cannot go out.</div>
    </div>`:''}

    <div class="card">
      <h3>Team</h3>
      ${(d.members||[]).length?(d.members||[]).map(m=>`<div class="line">
        <span>${esc(m.id.slice(0,10))}…</span><b>${esc(m.role||'?')}</b></div>`).join('')
        :'<div class="muted">No member records.</div>'}
    </div>

    <div class="card">
      <h3>Last rentals</h3>
      ${(d.rentals||[]).length?`<table><tbody>${(d.rentals||[]).slice(0,12).map(r=>`
        <tr><td class="nm">${esc(r.vehicleName||r.model||'—')}
              <span>${esc(r.customerName||'')}</span></td>
            <td class="num">${money(r.rent||r.quotedRent||0)}</td>
            <td class="num muted">${day(typeof r.outAt==='number'?r.outAt:0)}</td>
            <td><span class="tag ${r.status==='open'?'trial':'never'}">${
              esc(String(r.status||'').toUpperCase())}</span></td></tr>`).join('')}
      </tbody></table>`:'<div class="muted">No rentals yet.</div>'}
    </div>

    ${held.length?`<div class="card">
      <h3>Bookings held</h3>
      ${held.map(b=>`<div class="line"><span class="grow">A ${esc(b.model||'')}
        <span class="muted">· ${esc(b.customerName||'')}</span></span>
        <b>${day(typeof b.fromAt==='number'?b.fromAt:0)}</b></div>`).join('')}
    </div>`:''}`;
};
</script>
</body>
</html>
