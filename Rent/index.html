  coTiers(){
    const vid = document.getElementById('c-veh').value;
    const blk = document.getElementById('c-rateblock');
    if (!vid){ blk.innerHTML=''; this.coSummary(); return; }
    const v = DB.d.vehicles.find(x=>x.id===vid);
    const _oe = document.getElementById('c-out');
    const r = rateFor(DB.d.rates.find(x=>x.id===v.rateId), dtParse(_oe && _oe.value, Date.now()));
    if (!r){ blk.innerHTML = `<div class="card" style="background:var(--danger-tint);border-color:var(--danger)">
      <b>No rate card for ${esc(v.model)}</b><div class="muted">Add one under Rates first.</div></div>`; return; }

    /* The effective tiers, after rateFor() has applied any weekend card. Stashed
       so coPick can refuse an unpriced one without re-deriving the whole thing
       and possibly disagreeing with what is on screen. */
    this._coTiers = r.tiers || {};
    const blocked = this.docBlocked(v);
    blk.innerHTML =
      (blocked ? `<div class="card" style="background:var(--danger-tint);border-color:var(--danger);margin-bottom:11px">
          <b style="color:var(--danger)">${blocked.toUpperCase()} HAS EXPIRED</b>
          <div class="muted" style="margin-top:3px">Renting this out is a legal risk to you, not just the rider.
          Renew it, or tick below to override — the override is recorded on the rental.</div>
          <label class="row" style="margin-top:9px;gap:8px;cursor:pointer">
            <input type="checkbox" id="c-override" onchange="R.coSummary()" style="width:19px;height:19px">
            <span style="font-size:13px;font-weight:700">Rent out anyway</span></label>
        </div>` : '') +
      `<div class="fld"><label class="lbl">Duration <span class="req">*</span></label>
        <div class="tiers" id="c-tiers">
          ${TIERS.map(t=>{
            /* Zero means unpriced, not free. firstBike() only asks for the
               24-hour rate, so four of these are legitimately blank on a new
               shop — and offering "3 hr · \u20B90" as a choice is offering to
               rent a bike out for nothing. Shown so the tier is discoverable,
               dimmed so it cannot be mistaken for a rental waiting to happen. */
            const tv = Number(r.tiers[t.k])||0;
            return `<div class="tier${tv>0?'':' off'}" data-t="${t.k}" onclick="R.coPick('${t.k}')">
              <div class="t">${t.label}</div>
              <div class="p">${tv>0?money(tv):'not set'}</div></div>`;
          }).join('')}
          <div class="tier" data-t="manual" onclick="R.coPick('manual')">
            <div class="t">Custom</div>
            <div class="p">Set duration</div></div>
        </div></div>
      <!-- Revealed only when Custom is picked. Priced by anchorTierFor(): the
           largest package that fits inside the duration typed, plus ordinary
           overtime for anything past it — the exact math a late return
           already uses, so nothing downstream needed to change.

           Hours or days, not hours only: a customer taking a bike for four
           days used to mean typing 96 into an "Hours" box, which nobody does
           reliably in their head at a counter. The toggle just changes what
           the number means before it is turned into hours internally —
           everything past coManualInput() still works in hours alone. -->
      <div id="c-manual" style="display:none;margin:-2px 0 12px">
        <label class="lbl">Duration <span class="req">*</span></label>
        <div class="pm" id="c-manual-unit" style="margin-bottom:7px">
          <button type="button" class="on" data-u="hours" onclick="R.coManualUnit('hours')">Hours</button>
          <button type="button" data-u="days" onclick="R.coManualUnit('days')">Days</button>
        </div>
        <input class="in" id="c-manual-hrs" type="number" inputmode="decimal" min="0.5" step="0.5"
          placeholder="e.g. 9" oninput="R.coManualInput()">
      </div>
      <!-- Informational only, same as the overtime rate below it — nothing is
           known about actual distance until the car comes back, so nothing
           is charged here. -->
      ${(r.kmIncluded || r.kmExtra) ? `<div class="card" style="background:var(--tl-tint,#E0F2FE);
          border-color:var(--tl-bd,#A5D8F0);margin-bottom:11px">
        <b style="font-size:12.5px">${r.kmIncluded||0} km included per day</b>
        <div class="muted" style="margin-top:2px">${r.kmExtra?money(r.kmExtra)+' for every km after that.':
          'No charge past that \u2014 kilometres beyond it are free.'}
          ${r.kmIncluded?'Record the odometer at pickup and return to have this counted.':''}</div>
      </div>` : ''}
      <div class="two">
        <div class="fld"><label class="lbl" id="c-dep-l">Deposit taken</label>
          <input class="in" id="c-dep" type="number" inputmode="numeric" value="${r.deposit}" oninput="R.coSummary()"></div>
        <div class="fld" id="c-adv-w"><label class="lbl">Rent paid now</label>
          <input class="in" id="c-adv" type="number" inputmode="numeric" value="0" oninput="R.coSummary()"></div>
      </div>
      <div class="fld"><label class="lbl">How did it come in?</label>
        <div class="pm" id="c-pm">
          <button type="button" class="cash on" data-m="cash" onclick="R.pmPick('c-pm','cash')">\u{1F4B5} Cash</button>
          <button type="button" class="upi" data-m="upi" onclick="R.pmPick('c-pm','upi')">\u{1F4F2} UPI</button>
          <button type="button" data-m="split" onclick="R.pmPick('c-pm','split')">Split</button>
        </div></div>
      <div id="c-split" style="display:none">
        <div class="fld"><label class="lbl">Of that, how much in cash?</label>
          <input class="in" id="c-cash" type="number" inputmode="numeric" value="0" oninput="R.coSummary()"></div>
      </div>`;
    /* A licence is compulsory to hand over a car and merely useful on a bike.
       Because it becomes required, it must also be VISIBLE — leaving it inside
       a collapsed "More details" panel and then refusing to save is how a shop
       ends up staring at a button that will not work. So the panel opens
       itself for a car. */
    const isCar = (v.kind === 'car');
    const kl = document.getElementById('c-kyc-l');
    if (kl) kl.innerHTML = isCar
      ? 'Driving licence no. <span class="req">*</span>'
      : 'DL / Aadhaar no.';
    const kin = document.getElementById('c-kyc');
    if (kin) kin.placeholder = isCar ? 'Licence number' : 'ID number';
    if (isCar){
      const panel = document.getElementById('c-more');
      const btn = document.getElementById('c-more-btn');
      if (panel && panel.style.display === 'none'){
        panel.style.display = '';
        if (btn) btn.innerHTML = 'Hide details <span class="muted">— optional</span>';
      }
    }

    this._tier = null; this._tierManual = false; this._manualHours = null;
    this._manualUnit = 'hours'; this.coSummary();
  },

  /* Cash and UPI have to be separable or "net cash in drawer" is a guess.
     A deposit taken by UPI and refunded in cash moves real money OUT of the
     drawer with nothing having come in — that is the case that quietly
     breaks a reconciliation, so split is a first-class option, not an
     afterthought. */
  /* Reveals the two commercial-only date fields. Reads its state from the
     element rather than a variable so it survives the sheet being re-rendered
     by the Bike/Car picker mid-edit. */
  toggleCommercial(){
    const t = document.getElementById('v-comm-t');
    const box = document.getElementById('v-comm');
    if (!t || !box) return;
    const on = !t.classList.contains('on');
    t.classList.toggle('on', on);
    box.style.display = on ? '' : 'none';
    Haptic.tap();
  },

  pmPick(box, m){
    const el = document.getElementById(box); if (!el) return;
    el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    const sp = document.getElementById(box === 'c-pm' ? 'c-split' : (box === 'i-pm' ? 'i-split' : null));
    if (sp) sp.style.display = (m === 'split') ? '' : 'none';
    Haptic.tap();
    /* Only the two payment boxes recalculate a bill. This used to be an
       else-branch straight into ciCalc(), so the moment any OTHER segmented
       control reused this helper — the vehicle form's Manual/Automatic — it
       would run a check-in calculation against a rental that is not open. */
    if (box === 'c-pm') this.coSummary();
    else if (box === 'i-pm' || box === 'i-rm') this.ciCalc(1);
  },
  pmGet(box){
    const el = document.getElementById(box);
    const on = el && el.querySelector('button.on');
    return (on && on.dataset.m) || 'cash';
  },
  /* Returns how much of `total` was cash under the chosen mode. */
  pmCash(box, total, splitField){
    const m = this.pmGet(box);
    if (m === 'cash') return total;
    if (m === 'upi') return 0;
    const el = document.getElementById(splitField);
    return Math.min(total, Math.max(0, Number((el||{value:0}).value)||0));
  },

  coPick(k){
    if (k === 'manual'){
      const anyPriced = Object.values(this._coTiers||{}).some(v => Number(v) > 0);
      if (!anyPriced){
        Haptic.error();
        return toast('Set at least one price under Rates first');
      }
      this._tierManual = true; this._tier = null;   /* set once valid hours exist */
      document.querySelectorAll('#c-tiers .tier').forEach(el=>
        el.classList.toggle('on', el.dataset.t==='manual'));
      const box = document.getElementById('c-manual');
      if (box) box.style.display = '';
      this.coSummary();
      return;
    }
    if (!(Number((this._coTiers||{})[k]) > 0)){
      Haptic.error();
      return toast(tierOf(k).label + ' has no price yet \u2014 set it under Rates first');
    }
    this._tierManual = false; this._manualHours = null;
    const box = document.getElementById('c-manual');
    if (box) box.style.display = 'none';
    this._tier = k;
    document.querySelectorAll('#c-tiers .tier').forEach(el=>
      el.classList.toggle('on', el.dataset.t===k));
    this.coSummary();
  },

  /* Reruns on every keystroke: the anchor package can change mid-typing (5hr
     anchors to a priced 3hr tier, 5.5hr might reach a priced 6hr tier if one
     existed) and the preview has to track it live, the same way changing the
     pickup date already re-derives everything else on this screen.

     The number typed means hours or days depending on coManualUnit()'s last
     toggle; converted to hours here, once, so every line below this — the
     anchor, the due-back time, quote(), the eventual rental record — still
     deals in a single unit and never has to ask which one the person meant. */
  coManualInput(){
    const el = document.getElementById('c-manual-hrs');
    const raw = Number(el && el.value) || 0;
    const mult = this._manualUnit === 'days' ? 24 : 1;
    const h = raw > 0 ? raw * mult : 0;
    this._manualHours = h > 0 ? h : null;
    this._tier = this._manualHours ? anchorTierFor(this._coTiers||{}, this._manualHours) : null;
    this.coSummary();
  },

  /* Switching units re-reads whatever number is already in the box rather
     than clearing it — typing "3", then realising it should have been days
     rather than hours, should not throw the number away. */
  coManualUnit(u){
    if (this._manualUnit === u) return;
    this._manualUnit = u;
    const box = document.getElementById('c-manual-unit');
    if (box) box.querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.u === u));
    const el = document.getElementById('c-manual-hrs');
    if (el) el.placeholder = u === 'days' ? 'e.g. 3' : 'e.g. 9';
    Haptic.tap();
    this.coManualInput();
  },

  coSummary(){
    const vid = document.getElementById('c-veh') ? document.getElementById('c-veh').value : '';
    const box = document.getElementById('c-summary');
    const btn = document.getElementById('c-go');
    if (!vid || !this._tier){ box.innerHTML=''; btn.disabled = true;
      btn.textContent = 'Choose a vehicle and duration'; return; }
    const v = DB.d.vehicles.find(x=>x.id===vid);
    const outEl = document.getElementById('c-out');
    const outAt = dtParse(outEl && outEl.value, Date.now());
    const r = rateFor(DB.d.rates.find(x=>x.id===v.rateId), outAt);
    const t = tierOf(this._tier);
    /* Manual duration decides the actual due-back time; the anchor tier only
       decides what is charged right now (see anchorTierFor()). */
    const due = outAt + (this._manualHours || t.hours)*HOUR;
    const dep = Number(document.getElementById('c-dep').value)||0;
    const adv = Number(document.getElementById('c-adv').value)||0;

    const ovEl = document.getElementById('c-override');
    const blocked = this.docBlocked(v);
    const ok = !blocked || (ovEl && ovEl.checked);

    /* ── booking mode ────────────────────────────────────────────────
       A future pickup is a promise, not a handover: no bike goes out, no
       deposit is held, no clock starts. Rendering it as a rental is what let
       a date sixteen days out create an open rental that took the bike off
       the market for sixteen days. */
    const future = this.isFuture(outAt);
    this._bookMode = future;
    /* Manual duration is a walk-in feature only. A booking holds a MODEL for
       a window weeks out — "how many hours exactly" is not a question that
       makes sense before the customer has even arrived, and bookSave() never
       learned a manualHours field. Refuse cleanly rather than let a booking
       silently save with the wrong due date. */
    if (future && this._tierManual){
      box.innerHTML = `<div class="card" style="background:var(--danger-tint);border-color:var(--danger)">
        <b style="font-size:12.5px;color:var(--danger)">Manual duration isn't available for advance bookings</b>
        <div class="muted" style="margin-top:3px">Pick one of the packages above, or come back to this once
        the customer has arrived.</div></div>`;
      btn.disabled = true; btn.textContent = 'Pick a package for a booking';
      return;
    }
    /* Same field, different meaning: a future pickup takes a token against a
       no-show, not a deposit. Nobody holds five thousand rupees of someone's
       money for sixteen days. */
    const depL = document.getElementById('c-dep-l');
    if (depL) depL.innerHTML = this.isFuture(outAt)
      ? 'Token to hold it <span class="muted">optional</span>'
      : 'Deposit taken';
    const advWrap = document.getElementById('c-adv-w');
    if (advWrap) advWrap.style.display = this.isFuture(outAt) ? 'none' : '';
    const sheet = document.getElementById('c-mode');
    if (sheet) sheet.innerHTML = future ? `
      <div class="card" style="background:var(--vi-tint);border-color:var(--vi-bd)">
        <b style="font-size:13px;color:var(--vi)">This is a booking, not a rental</b>
        <div class="muted" style="margin-top:2px">Nothing is taken now and no bike goes out.
        ${esc(vLabel(v))} stays available until ${fmtDT(outAt)}.</div>
      </div>` : '';

    if (future){
      const f = this.bookFree(v.rateId, outAt, due);
      const tok = dep;                    /* the deposit field becomes the token */
      if (!f.free){
        const alts = this.bookAlternatives(v.rateId, outAt, due);
        const nf   = this.bookNextFree(v.rateId, outAt, due);
        box.innerHTML = `
          <div class="card" style="background:var(--danger-tint);border-color:var(--danger)">
            <b style="font-size:13px;color:var(--danger)">No ${esc(r.model)} free then</b>
            <div class="muted" style="margin-top:3px">You have ${f.total}.
              ${f.outNow?f.outNow+' still out, ':''}${f.booked?f.booked+' already booked.':''}</div>
          </div>
          ${(alts.length || nf) ? `<div class="card">
            <b style="font-size:12.5px">What you can offer instead</b>
            ${alts.map(a=>`<div class="line"><span>${esc(a.rate.model)}</span>
              <b class="pos">${a.f.free} free</b></div>`).join('')}
            ${nf?`<div class="line"><span>${esc(r.model)} from ${fmtDT(nf).split(',')[0]}</span>
              <b style="color:var(--vi)">free</b></div>`:''}
          </div>` : ''}`;
        btn.disabled = true;
        btn.textContent = 'No ' + r.model + ' free on that date';
        return;
      }
      box.innerHTML = `
        <div class="card" style="background:var(--success-tint);border-color:#B7ECD1">
          <div class="row"><b class="grow" style="font-size:12.5px">${f.free} of ${f.total}
            ${esc(r.model)} free then</b><span class="pill ok">CHECKED</span></div>
          ${(f.outNow||f.booked)?`<div class="muted" style="margin-top:2px">${
            [f.outNow?f.outNow+' still out':'', f.booked?f.booked+' already booked':'']
              .filter(Boolean).join(' · ')}</div>`:''}
        </div>
        <div class="card" style="background:var(--vi-tint);border-color:var(--vi-bd)">
          <div class="line"><span>Holding</span><b>A ${esc(r.model)}</b></div>
          <div class="line"><span>Preferred ${noun()}</span><b>${esc(vSub(v))||esc(vLabel(v))}</b></div>
          <div class="line"><span>Pickup</span><b>${fmtDT(outAt)}</b></div>
          <div class="line"><span>Back by</span><b>${fmtDT(due)}</b></div>
          <div class="line tot"><span>Rent locked at</span><b>${money(r.tiers[this._tier])}</b></div>
          ${tok?`<div class="line"><span>Token now</span><b>${money(tok)}</b></div>`:''}
          <div class="muted" style="margin-top:6px">The ${money(r.deposit)} deposit is taken on
          pickup day, not now.</div>
        </div>`;
      btn.disabled = false;
      btn.textContent = 'Book for ' + fmtDT(outAt).split(',')[0];
      return;
    }

    /* The walk-in guard. A booking only clashes if capacity actually runs out —
       three Jupiters and one booking is not a conflict. Dimmed, never blocked:
       the customer in front of him may well beat a token, but he should know he
       is making that trade. */
    const clash = this.bookClash(v.rateId, outAt, due, this._fromBooking);
    const warn = clash ? `
      <div class="card" style="background:var(--danger-tint);border-color:var(--danger)">
        <b style="font-size:12.5px;color:var(--danger)">A ${esc(clash.model)} is booked for
          ${fmtDT(clash.fromAt)}</b>
        <div class="muted" style="margin-top:3px">${esc(clash.customerName)}${
          clash.token?', token '+money(clash.token)+' taken':''}. Renting this one for
          ${esc(t.label)} leaves them without a ${noun()}. A shorter package may still fit.</div>
      </div>` : '';

    /* Manual duration books at the anchor package's flat price, exactly as a
       fixed tier does — the customer is not charged overtime up front for
       hours that have not happened yet. Only the wording changes, to say
       what was actually agreed at the counter rather than only what will be
       charged for it. */
    const manualNote = (this._manualHours && this._manualHours > t.hours)
      ? `<div class="muted" style="margin-top:2px">${fmtDur(this._manualHours - t.hours)} beyond the
         ${t.label} package \u2014 settles as overtime when it comes back, same as any late return.</div>`
      : '';
    box.innerHTML = warn + `<div class="card" style="background:var(--p-50);border-color:#D9E2EA">
      ${this._manualHours ? `<div class="line"><span>Agreed duration</span><b>${fmtDur(this._manualHours)}</b></div>` : ''}
      <div class="line"><span>Due back</span><b>${fmtDT(due)}</b></div>
      <div class="line"><span>Rent for ${t.label}${this._manualHours?' package':''}</span><b>${money(r.tiers[this._tier])}</b></div>
      <div class="line"><span>Overtime after that</span><b>${money(r.ot)}/hr</b></div>
      ${manualNote}
      <div class="line"><span>Deposit held <span class="muted">(refundable)</span></span><b>${money(dep)}</b></div>
      <div class="line tot"><span>Collect now</span><b>${money(dep + adv)}</b></div>
      <div class="muted" style="margin-top:6px">Of this, ${money(dep)} is not your money — it goes to Deposits held.</div>
    </div>`;
    btn.disabled = !ok;
    btn.textContent = ok ? (clash ? 'Rent out anyway · ' + money(dep + adv)
                                  : 'Rent out · collect ' + money(dep + adv))
                         : 'Blocked — ' + blocked + ' expired';
  },

  /* ── save a booking ─────────────────────────────────────────────── */
  async bookSave(){
    const vid = document.getElementById('c-veh').value;
    const v = DB.d.vehicles.find(x=>x.id===vid); if (!v) return;
    const name = (document.getElementById('c-name').value||'').trim();
    if (!name) return toast('Customer name is required');
    const outAt = dtParse((document.getElementById('c-out')||{}).value, Date.now());
    const t = tierOf(this._tier);
    const toAt = outAt + t.hours*HOUR;
    const r = rateFor(DB.d.rates.find(x=>x.id===v.rateId), outAt);
    const f = this.bookFree(v.rateId, outAt, toAt);
    /* Re-checked at save, not just at render: two counter staff on two phones
       can both be looking at the last free bike. */
    if (!f.free) { Haptic.error(); return toast('That model is no longer free then'); }
    const ph = (document.getElementById('c-phone').value||'').replace(/[^0-9]/g,'').slice(-10);
    const rec = {
      rateId: v.rateId, model: r.model,
      preferredVehicleId: vid,
      customerName: name, customerPhone: ph,
      customerKyc: (document.getElementById('c-kyc')||{value:''}).value.trim(),
      fromAt: outAt, toAt: toAt, tier: this._tier,
      quotedRent: Number(r.tiers[this._tier])||0,
      quotedDeposit: Number(r.deposit)||0,
      token: Number((document.getElementById('c-dep')||{value:0}).value)||0,
      tokenMode: this.pmGet('c-pm'),
      status: 'held',
      createdAt: Date.now(),
      note: ''
    };
    if (window.Cloud && Cloud.ready){
      const bid = Cloud.nid('bk');
      DB.d.bookings = (DB.d.bookings||[]).concat([Object.assign({id:bid}, rec)]);
      Cloud.put('bookings', bid, rec).then(w => {
        if (!w.ok){
          DB.d.bookings = DB.d.bookings.filter(b=>b.id!==bid);
          DB.save(); R.render();
          toast('Could not save the booking — ' + Cloud.explainWrite(w.code));
        }
      });
    } else {
      DB.d.bookings = (DB.d.bookings||[]).concat([Object.assign({id:DB.id('bk')}, rec)]);
    }
    DB.save();
    Haptic.success(); closeSheet();
    this._bookTab = true;
    toast('Booked — ' + r.model + ', ' + fmtDT(outAt));
    this.render();
  },

  async checkoutSave(){
    /* One button, two outcomes. The date decided which, and coSummary has
       already said so on screen. */
    if (this._bookMode) return this.bookSave();
    /* Carried so a rental started from a booking credits the token, keeps the
       quoted price and closes the booking instead of leaving it held. */
    const fromBk = this._fromBooking
      ? (DB.d.bookings||[]).find(x=>x.id===this._fromBooking && x.status==='held')
      : null;
    const vid  = document.getElementById('c-veh').value;
    const name = document.getElementById('c-name').value.trim();
    const ph   = document.getElementById('c-phone').value.replace(/\D/g,'').slice(-10);
    if (!vid || !this._tier) return toast('Choose '+noun()+' and duration');
    if (!name) return toast('Customer name is required');
    if (ph && ph.length !== 10) return toast('Phone must be 10 digits, or leave it blank');

    /* Handing a car to someone without a licence is the shop's liability, not
       the rider's — the one field on this screen that protects the shop rather
       than the bill. Cars only: making it compulsory on a scooter would just
       teach counter staff to type a full stop into the box.

       New rentals only. Nothing already open or settled is re-validated, so
       no existing rental can become unsettleable. */
    {
      const _v = DB.d.vehicles.find(x=>x.id===vid);
      const _kyc = ((document.getElementById('c-kyc')||{value:''}).value||'').trim();
      if (_v && _v.kind === 'car' && !_kyc){
        const el = document.getElementById('c-kyc'); if (el) el.focus();
        Haptic.error();
        return toast('Driving licence number is required to hand over a car');
      }
    }

    const v = DB.d.vehicles.find(x=>x.id===vid);
    const outEl = document.getElementById('c-out');
    const now = dtParse(outEl && outEl.value, Date.now());
    /* Weekend card resolved from the PICKUP time and frozen below, so a
       Saturday rental keeps Saturday's price when it returns on Monday. */
    const r = rateFor(DB.d.rates.find(x=>x.id===v.rateId), now);
    if (!this.rateReady(r)) {
      Haptic.error();
      return toast('Set a price for ' + (r?r.model:'this model') + ' under Rates first');
    }
    const t = tierOf(this._tier);
    const ovEl = document.getElementById('c-override');

    const rental = {
      id: DB.id('r'), vehicleId: vid, status: 'open',
      customerName: name, customerPhone: ph,
      customerKyc: (document.getElementById('c-kyc')||{value:''}).value.trim(),
      outAt: now, dueAt: now + (this._manualHours || t.hours)*HOUR, tier: this._tier,
      /* r.tier stays the anchor package — settlement, overtime and every
         money line downstream reads it unchanged. manualHours is carried
         only so a human being reading the bill later sees what was actually
         agreed, not the package it happened to be priced against. */
      manualHours: this._manualHours || null,
      /* Snapshot, never a live lookup: a price change tomorrow must not
         re-price a bike that is already on the road. km terms freeze the
         same way — a shop that raises its per-km rate next week must not
         reach back into a car that is already out. */
      rateSnapshot: { model: r.model, deposit: r.deposit, ot: r.ot,
                      tiers: Object.assign({}, r.tiers), weekend: !!r._weekend,
                      kmIncluded: Number(r.kmIncluded)||0, kmExtra: Number(r.kmExtra)||0 },
      depositHeld: Number(document.getElementById('c-dep').value)||0,
      advancePaid: Number(document.getElementById('c-adv').value)||0,
      outPayMode: this.pmGet('c-pm'),
      bookingId: fromBk ? fromBk.id : null,
      /* A token already collected is rent already paid. Charging it again at
         pickup would take the same money twice. */
      tokenCredited: fromBk ? (Number(fromBk.token)||0) : 0,
      outCash: this.pmCash('c-pm',
        (Number(document.getElementById('c-dep').value)||0) +
        (Number(document.getElementById('c-adv').value)||0), 'c-cash'),
      odoOut: Number((document.getElementById('c-odo')||{value:0}).value)||0,
      fuelOut: (document.getElementById('c-fuel')||{value:''}).value,
      docOverride: !!(ovEl && ovEl.checked) ? this.docBlocked(v) : '',
    };
    rental.dayKey = localDayKey(now);

    if (window.Cloud && Cloud.ready){
      /* Allocating a specific bike is the one write that must reach the
         server: two staff must never hand out the same one. If there is no
         signal we hold it and finish automatically rather than refusing. */
      rental.id = Cloud.nid('r');
      rental.createdBy = Cloud.uid;
      const res = await Cloud.checkout(rental, vid);
      if (!res.ok){
        Haptic.error();
        if (res.reason === 'taken')
          return toast(vLabel(v) + ' was just rented by someone else — pick another bike');
        if (res.reason === 'cancelled') return toast('Check-out cancelled');
        if (res.reason === 'missing')
          return toast('That ' + noun() + ' is not in your account yet — open Fleet and add it');
        return toast('Could not rent out — check your connection and try again');
      }
      if (ph) Cloud.put('customers', 'ph_'+ph, { name, phone: ph, kyc: rental.customerKyc });
      Cloud.audit('rental.out', rental.id, null,
        { vehicleId: vid, tier: rental.tier, deposit: rental.depositHeld, advance: rental.advancePaid });
      /* Close the booking only now the rental genuinely exists. Doing it before
         Cloud.checkout() would free the bike on a failed handover and let a
         walk-in take one the customer is standing there waiting for. */
      if (fromBk){
        this._bookSet(fromBk.id, { status:'converted', rentalId: rental.id, closedAt: Date.now() });
        Cloud.audit('booking.convert', fromBk.id, { status:'held' },
          { rentalId: rental.id, token: fromBk.token||0 });
      }
      this._fromBooking = null; this._prefillOut = null;
      this._prefillVeh = null; this._prefillTier = null;
      /* Cash is recorded on the day it MOVES, not the day the rental closes.
         A deposit taken today is in the drawer today — booking it only at
         check-in meant money you are physically holding showed as ₹0 in, and
         a rental spanning a week credited the whole float to the wrong day. */
      const inTotal = (Number(rental.depositHeld)||0) + (Number(rental.advancePaid)||0);
      Cloud.rollup(rental.dayKey, {
        depositsIn: Number(rental.depositHeld)||0,
        collected:  Number(rental.advancePaid)||0,
        cashIn:     Number(rental.outCash)||0,
        upiIn:      Math.max(0, inTotal - (Number(rental.outCash)||0)),
      });
      /* Fleet's "Idle days" needs to know when this bike last left, without
         listening to every rental ever written against it (see the note by
         the rentals listener). One small per-vehicle doc, same shape as the
         /daily rollup, updated on every checkout regardless of how the
         rental ends. */
      Cloud.bumpVehicleStat(vid, { lastOutAt: rental.outAt });
    } else {
      DB.d.rentals.push(rental);
      v.status = 'rented';
      if (rental.odoOut) v.odo = rental.odoOut;
      if (!DB.d.customers.find(x=>x.phone===ph))
        DB.d.customers.push({ id: DB.id('c'), name, phone: ph, kyc: rental.customerKyc });
      DB.save();
    }
    /* Set the instant a rental exists, not derived from anything that can
       later go back to empty — see obState() for what happens without it. */
    try { localStorage.setItem('rn_ever_rented','1'); } catch(e){}
    Haptic.success();
    closeSheet(); this.nav('out');
    toast('Rented out · ' + vLabel(v));
    if (ph) setTimeout(()=>this.waAgreement(rental.id), 500);
  },

  waAgreement(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
    const t = tierOf(r.tier);
    const rs = r.rateSnapshot || {};
    const kmLine = (rs.kmIncluded || rs.kmExtra)
      ? `\nKm included: ${rs.kmIncluded||0} per day${rs.kmExtra?', then '+money(rs.kmExtra)+'/km':''}`
      : '';
    const msg =
`*Rental confirmed*
Vehicle: ${vLabel(v)}${v.regNo?' ('+v.regNo+')':''}
Out: ${fmtDT(r.outAt)}
Due back: *${fmtDT(r.dueAt)}*
Package: ${tierLabel(r)} — ${money(r.rateSnapshot.tiers[r.tier])}${kmLine}
Deposit held: ${money(r.depositHeld)} (refundable)
Late return: ${money(r.rateSnapshot.ot)} per hour

Please return on time to get your full deposit back.`;
    window.open('https://wa.me/91' + r.customerPhone + '?text=' + encodeURIComponent(msg), '_blank');
  },

  /* ── CHECK-IN ───────────────────────────────────────────────────── */
  checkinStart(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
    const now = Date.now();
    this._ci = { id, inAt: now };

    openSheet(`
      <div class="sheet-hd"><h2>Check in</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="card" style="margin-bottom:12px">
        <div class="row"><b class="grow" style="font-size:16px">${esc(vLabel(v))}</b>
          <span class="pill ${now>r.dueAt?'late':'ok'}">${now>r.dueAt?'LATE':'ON TIME'}</span></div>
        <div class="muted" style="margin-top:3px">${esc(r.customerName)} · ${esc(r.customerPhone)}</div>

          onclick="R.cancelRental('${id}')">Cancel</button>`:''}

    this.ciCalc();
  },

  ciUseAlt(){
    const q = this._ci.q;
    if (!q.alt) return;
    this._ci.useAlt = !this._ci.useAlt;
    this.ciCalc();
  },

  ciCalc(manual){
    const { id } = this._ci;
    const r = DB.d.rentals.find(x=>x.id===id);
    /* Return time is editable, so hours and overtime are recomputed on every
       change rather than frozen when the sheet opened. */
    const inEl = document.getElementById('i-in');
    const inAt = dtParse(inEl && inEl.value, Date.now());
    const hrs  = Math.max(0, hoursBetween(r.outAt, inAt));
    const q    = quote(r.rateSnapshot, r.tier, hrs);
    this._ci.inAt = inAt; this._ci.hrs = hrs; this._ci.q = q;
    const g = i => Number((document.getElementById(i)||{value:0}).value)||0;
    const dmg = g('i-dmg'), fuelc = g('i-fuelc'), other = g('i-other');

    /* Cars only, and only if both odometer readings exist — see kmCharge()
       for why. Computed here, once, so the preview and the amount actually
       charged at save can never disagree. */
    const km = kmCharge(r.rateSnapshot, r.odoOut, g('i-odo'), hrs);
    this._ci.km = km;

    const useAlt = this._ci.useAlt && q.alt;
    const rentTotal = useAlt ? q.alt.total : (q.rent + q.overtime);
    const charges = rentTotal + dmg + fuelc + other + (km ? km.charge : 0);
    const due = charges - (Number(r.advancePaid)||0);
    /* Part payment is normal at a counter — the customer pays what they have
       and the rest is chased. Booking the full amount as collected would
       quietly overstate the day's takings. */
    const paidEl = document.getElementById('i-paid');
    if (paidEl && !manual && paidEl.value === '') paidEl.value = Math.max(0, Math.round(due));
    const collecting = paidEl ? (Number(paidEl.value)||0) : Math.max(0, due);
    this._ci.collecting = collecting;
    this._ci.unpaid = Math.max(0, due - collecting);
    const unpaid = this._ci.unpaid;
    /* The deposit covers only what is still UNPAID.

       It used to be depositHeld − due, which took the whole bill out of the
       deposit even when the customer had just handed the money over in cash.
       They paid once at the counter and again out of their deposit: a ₹450
       rental cost them ₹900 and the drawer read ₹450 too high. A deposit is
       security against non-payment, not a second way to charge for the same
       rental. */
    const refund = Math.max(0, (Number(r.depositHeld)||0) - unpaid);

    document.getElementById('i-settle').innerHTML = `
      <div class="card" style="background:var(--p-50);border-color:#D9E2EA">
        <div class="line"><span>Time used</span><b>${fmtDur(hrs)}</b></div>
        <div class="line"><span>Extra hours</span>
          <b class="${q.hoursOver?'neg':''}">${q.hoursOver||0}</b></div>
        <div class="line"><span>Rent · ${tierOf(r.tier).label}</span><b>${money(q.rent)}</b></div>
        ${q.overtime>0 && !useAlt ? `<div class="line"><span>Overtime · ${q.hoursOver} hr × ${money(r.rateSnapshot.ot)}</span>
          <b class="neg">${money(q.overtime)}</b></div>`:''}
        ${km && km.over>0 ? `<div class="line"><span>Extra km · ${km.over} × ${money(r.rateSnapshot.kmExtra)}</span>
          <b class="neg">${money(km.charge)}</b></div>`:''}
        ${km && !km.over ? `<div class="muted" style="margin:2px 0 4px">${km.driven} km driven,
          ${km.allowed} included \u2014 no extra km charge.</div>`:''}
        ${useAlt ? `<div class="line"><span>Switched to ${q.alt.label} package</span>
          <b class="pos">${money(q.alt.total - q.rent)}</b></div>`:''}
        ${dmg?`<div class="line"><span>Damage</span><b class="neg">${money(dmg)}</b></div>`:''}
        ${fuelc?`<div class="line"><span>Fuel</span><b class="neg">${money(fuelc)}</b></div>`:''}
        ${other?`<div class="line"><span>Other / fine</span><b class="neg">${money(other)}</b></div>`:''}
        ${r.advancePaid?`<div class="line"><span>Already paid</span><b class="pos">−${money(r.advancePaid)}</b></div>`:''}
        <div class="line tot"><span>Customer owes</span><b>${money(Math.max(0,due))}</b></div>
        <div class="line" style="border-top:1px dashed var(--bd);margin-top:6px;padding-top:10px">
          <span>Deposit held</span><b>${money(r.depositHeld)}</b></div>
        <div class="line tot" style="border:0;padding-top:4px">
          <span>Refund to customer</span>
          <b class="pos">${money(refund)}</b></div>
        ${(Number(r.depositHeld)||0) - refund > 0 ? `<div class="line">
          <span>Kept from deposit <span class="muted">— covers unpaid rent</span></span>
          <b class="neg">${money((Number(r.depositHeld)||0) - refund)}</b></div>` : ''}
        ${unpaid>0?`<div class="line" style="border-top:1px dashed var(--bd);margin-top:6px;padding-top:9px">
          <span>Left unpaid <span class="muted">— recorded as due</span></span>
          <b class="neg">${money(unpaid)}</b></div>`:''}
      </div>
      ${q.alt ? `<div class="card tap" style="background:var(--y-tint);border-color:var(--y-bd)"
          onclick="R.ciUseAlt()">
          <div class="row"><div class="grow">
            <b style="font-size:13.5px">${useAlt?'Using':'Cheaper for the customer:'} ${esc(q.alt.label)} package — ${money(q.alt.total)}</b>
            <div class="muted" style="margin-top:3px;font-size:12px">
              ${useAlt ? 'Tap to go back to straight overtime ('+money(q.straight)+').'
                       : 'Straight overtime comes to '+money(q.straight)+'. Tap to charge the cheaper one instead.'}
            </div></div>
            <input type="checkbox" ${useAlt?'checked':''} style="width:19px;height:19px;pointer-events:none">
          </div></div>` : ''}
    `;
  },

  async checkinSave(){
    this.ciCalc();
    const { id, hrs, q, inAt, km } = this._ci;
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
    const g = i => Number((document.getElementById(i)||{value:0}).value)||0;
    const dmg = g('i-dmg'), fuelc = g('i-fuelc'), other = g('i-other');
    const useAlt = this._ci.useAlt && q.alt;
    const rentTotal = useAlt ? q.alt.total : (q.rent + q.overtime);
    const kmAmt = km ? km.charge : 0;
    const charges = rentTotal + dmg + fuelc + other + kmAmt;
    const due = charges - (Number(r.advancePaid)||0);
    const _unpaid = Math.max(0, this._ci.unpaid || 0);
    const refund = Math.max(0, (Number(r.depositHeld)||0) - _unpaid);

    const patch = {
      status: 'closed', returnedAt: inAt, settledAt: Date.now(),
      hoursUsed: Math.round(hrs*100)/100, extraHours: q.hoursOver||0,
      odoIn: g('i-odo'),
      /* Distance driven and the km charge, recorded even at zero — a car with
         km terms and a shop that skipped the odometer should show "not
         measured" on the bill, not silently look identical to a bike. */
      kmDriven: km ? km.driven : null, kmOver: km ? km.over : null,
      fuelIn: (document.getElementById('i-fuel')||{value:''}).value,
      charges: { rent: rentTotal, overtime: useAlt?0:q.overtime, damage: dmg, fuel: fuelc, other, km: kmAmt },
      /* Revenue is rent + recoveries ONLY. The deposit never enters this
         number; it is refunded, or forfeited into `forfeited` below. */
      revenue: charges,
      depositRefunded: Math.max(0, refund),
      depositForfeited: refund < 0 ? 0 : (Number(r.depositHeld)||0) - Math.max(0, refund),
      balanceCollected: Math.max(0, this._ci.collecting != null ? this._ci.collecting : due),
      unpaid: Math.max(0, this._ci.unpaid || 0),
      inPayMode: this.pmGet('i-pm'),
      inCash: this.pmCash('i-pm', Math.max(0, this._ci.collecting != null ? this._ci.collecting : due), 'i-cash'),
      refundMode: this.pmGet('i-rm'),
    };
    const vpatch = { status: 'available' };
    if (patch.odoIn) vpatch.odo = patch.odoIn;

    if (window.Cloud && Cloud.ready){
      /* Safe offline: the bike is physically back, so nobody else can be
         returning it. Queued and replayed by Firestore if there is no signal. */
      const res = await Cloud.checkin(r.id, r.vehicleId, patch, vpatch);
      if (!res.ok){
        if (res.reason === 'settled') return toast('This rental was already settled on another device');
        return toast('Could not settle — try again');
      }
      this._closed = null;   /* force a reload so Money reflects this settlement */
      Cloud.audit('rental.in', r.id, { status:'open', deposit:r.depositHeld }, {
        revenue: patch.revenue, refund: patch.depositRefunded,
        collected: patch.balanceCollected, extraHours: patch.extraHours });
      /* The deposit-in and any pickup payment were already booked on the
         check-out day, so only what moves TODAY is added here.

         Two different days, on purpose. A rental out at 10pm and back at
         4am settles on the calendar day AFTER it happened — everything used
         to land there, so a shop's whole night's business quietly showed up
         as tomorrow's earnings and yesterday looked like it earned nothing.

         REVENUE is a fact about the rental: it belongs to the day the
         rental happened, which is check-out day (r.dayKey). CASH MOVEMENT
         is a fact about the drawer: money that changes hands at 4am
         genuinely arrived in the till at 4am, on today's date, and the
         reconciliation feature depends on that being true. So the two are
         rolled up to two different day-documents rather than one. */
      const _coll = Number(patch.balanceCollected)||0;
      const _ref  = Number(patch.depositRefunded)||0;
      const _refCash = patch.refundMode === 'upi' ? 0 : _ref;
      const revenueDay = r.dayKey || localDayKey(r.outAt);
      Cloud.rollup(revenueDay, { revenue: patch.revenue, rentals: 1 });
      Cloud.bumpVehicleStat(r.vehicleId, { earned: patch.revenue, closedTrips: 1 });
      Cloud.rollup(localDayKey(patch.settledAt), {
        rentals:     0,          /* already counted above, on the day the rental happened */
        collected:   _coll,
        depositsOut: _ref,
        outstanding: Number(patch.unpaid)||0,
        cashIn:      Number(patch.inCash)||0,
        upiIn:       Math.max(0, _coll - (Number(patch.inCash)||0)),
        cashOut:     _refCash,
        upiOut:      _ref - _refCash,
      });
      Object.assign(r, patch);
    } else {
      Object.assign(r, patch);
      if (v){ v.status = 'available'; if (patch.odoIn) v.odo = patch.odoIn; }
      DB.save();
    }
    Haptic.success();
    closeSheet(); this.nav('out');
    toast(patch.unpaid > 0
      ? 'Closed · ' + money(patch.unpaid) + ' still owed'
      : 'Closed · refund ' + money(refund));
  },

  waOverdue(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
    const late = Date.now() > r.dueAt;
    const msg = late
      ? `Hello ${r.customerName}, your rental of ${vLabel(v)} was due back at ${fmtDT(r.dueAt)}.
Overtime is running at ${money(r.rateSnapshot.ot)} per hour and comes out of your ${money(r.depositHeld)} deposit.
Please return the vehicle as soon as you can.`
      : `Hello ${r.customerName}, a reminder that ${vLabel(v)} is due back at ${fmtDT(r.dueAt)}.
Returning on time keeps your full ${money(r.depositHeld)} deposit.`;
    window.open('https://wa.me/91' + r.customerPhone + '?text=' + encodeURIComponent(msg), '_blank');
  },

  /* ══════════════════════════════════════════════════════════════════
     CORRECTIONS
     A counter makes mistakes: the wrong bike, the wrong tier, a customer
     who rings to keep it another day. Without these the only recourse was
     the browser console, so shops invent workarounds — a fake return, a
     second rental — and the books stop matching the yard.

     Nothing here deletes. A voided bill keeps its record and reverses its
     effect on the day's totals, so the history still explains itself.
     ══════════════════════════════════════════════════════════════════ */

  /* Customer rings: keeping it longer. Extends the due time, or moves to a
     bigger package, on the ORIGINAL rate — a price change since pickup must
     not reach a bike already on the road. */
  extend(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
    const rs = r.rateSnapshot || {};
    openSheet(`<div class="sheet-hd"><h2>Extend rental</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="card"><div class="row"><b class="grow">${esc(v?vLabel(v):'')}</b>
        <span class="pill out">${esc(r.customerName||'')}</span></div>
        <div class="muted" style="margin-top:4px">Booked ${tierLabel(r)} ·
        due ${fmtDT(r.dueAt)}</div></div>
      <div class="fld"><label class="lbl">Change package to</label>
        <div class="tiers" id="ex-tiers">
          ${TIERS.map(t=>{
            /* Same rule as the checkout: a tier at zero is unpriced, not free.
               Extending to an unpriced package would hand the customer more
               hours for nothing. */
            const ev = Number((rs.tiers||{})[t.k])||0;
            return `<div class="tier ${t.k===r.tier?'on':''}${ev>0?'':' off'}" data-t="${t.k}"
              onclick="R.exPick('${t.k}')"><div class="t">${t.label}</div>
              <div class="p">${ev>0?money(ev):'not set'}</div></div>`;
          }).join('')}
        </div></div>
      <div class="fld"><label class="lbl">Or set a new due time</label>
        <input class="in" id="ex-due" type="datetime-local" value="${dtLocal(r.dueAt)}"></div>
      <div class="muted" style="margin:-4px 2px 14px">Overtime still applies after the new due time,
      at ${money(rs.ot||0)}/hr.</div>
      <button class="btn" onclick="R.extendSave('${esc(id)}')">Save extension</button>`);
    this._exTier = r.tier;
  },
  exPick(k){
    const r0 = DB.d.rentals.find(x=>x.id===this._exId);
    const rs0 = (r0 && r0.rateSnapshot) || {};
    if (!(Number((rs0.tiers||{})[k]) > 0)){
      Haptic.error();
      return toast(tierOf(k).label + ' has no price on this rental \u2014 set a new due time instead');
    }
    this._exTier = k;
    document.querySelectorAll('#ex-tiers .tier').forEach(el=>el.classList.toggle('on', el.dataset.t===k));
    const r = DB.d.rentals.find(x=>x.id===this._exId);
    const due = document.getElementById('ex-due');
    if (due && this._exBase) due.value = dtLocal(this._exBase + tierOf(k).hours*HOUR);
  },
  async extendSave(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const tier = this._exTier || r.tier;
    const dueEl = document.getElementById('ex-due');
    let dueAt = dtParse(dueEl && dueEl.value, r.outAt + tierOf(tier).hours*HOUR);
    if (tier !== r.tier && (!dueEl || !dueEl.value)) dueAt = r.outAt + tierOf(tier).hours*HOUR;
    if (dueAt <= r.outAt) return toast('New due time must be after pickup');
    const w = await Cloud.put('rentals', id, { tier, dueAt, extendedAt: Date.now() });
    if (!w.ok) return toast(Cloud.explainWrite(w.code));
    Cloud.audit('rental.extend', id, { tier:r.tier, dueAt:r.dueAt }, { tier, dueAt });
    Object.assign(r, { tier, dueAt });
    Haptic.success(); closeSheet(); this.render();
    toast('Extended · due ' + fmtDT(dueAt));
  },

  /* Wrong bike, wrong customer, tapped twice. Frees the vehicle and returns
     the deposit; nothing is earned because nothing happened. */
  cancelRental(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    if (!this.isManager()) return toast('Ask the owner or manager to cancel');
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
    openSheet(`<div class="sheet-hd"><h2>Cancel rental</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="card" style="background:var(--danger-tint);border-color:var(--danger)">
        <b style="font-size:13.5px;color:var(--danger)">This rental never happened</b>
        <div class="muted" style="margin-top:4px">${esc(v?vLabel(v):'The '+noun())} goes back to available
        and the ${money(r.depositHeld)} deposit is returned in full. No rent is recorded.
        Use this for a mistaken entry — if the customer actually took the ${noun()}, check it in instead.</div></div>
      <div class="fld"><label class="lbl">Reason <span class="muted">optional</span></label>
        <input class="in" id="cx-why" placeholder="Wrong ${noun()} selected"></div>
      <button class="btn d" onclick="R.cancelGo('${esc(id)}')">Cancel this rental</button>`);
  },
  async cancelGo(id){
    const r = DB.d.rentals.find(x=>x.id===id); if (!r) return;
    const why = (document.getElementById('cx-why')||{value:''}).value.trim();
    const w = await Cloud.checkin(id, r.vehicleId, {
      status:'cancelled', cancelledAt: Date.now(), cancelReason: why,
      revenue: 0, depositRefunded: Number(r.depositHeld)||0, balanceCollected: 0
    }, { status:'available' });
    if (!w.ok) return toast(w.reason==='settled' ? 'Already settled on another device' : 'Could not cancel');
    Cloud.audit('rental.cancel', id, { deposit:r.depositHeld }, { reason: why });
    const ck = localDayKey();
    /* Everything handed over at pickup — deposit AND advance — goes back on
       a cancel, split exactly the way it came in (r.outCash), not guessed
       from the payment-mode label. The old version keyed off outPayMode
       being 'upi' vs not: for a real 'upi' pickup it only ever returned
       depositHeld through upiOut, quietly dropping the advance; for a
       'split' pickup it returned the whole thing through cashOut and never
       touched upiOut at all, so the UPI half never left the reconciliation.
       inTotal/outCash mirrors the exact split checkout recorded going in. */
    const inTotal = (Number(r.depositHeld)||0) + (Number(r.advancePaid)||0);
    const outCash = Number(r.outCash)||0;
    await Cloud.rollup(ck, {
      depositsOut: Number(r.depositHeld)||0,
      collected: -(Number(r.advancePaid)||0),
      cashOut: Math.min(inTotal, outCash),
      upiOut:  Math.max(0, inTotal - outCash) });
    Haptic.success(); closeSheet(); this.nav('out');
    toast('Cancelled · ' + money(r.depositHeld) + ' deposit returned');
  },

      </div>
      <div class="fld"><label class="lbl">Other / fine</label>
        <input class="in" id="eb-other" type="number" inputmode="numeric" value="${Number(c.other)||0}"></div>
      <div class="two">
        <div class="fld"><label class="lbl">Collected</label>
          <input class="in" id="eb-coll" type="number" inputmode="numeric" value="${Number(r.balanceCollected)||0}"></div>
        <div class="fld"><label class="lbl">Deposit returned</label>
          <input class="in" id="eb-ref" type="number" inputmode="numeric" value="${Number(r.depositRefunded)||0}"></div>
      </div>
      <button class="btn" onclick="R.editBillSave('${esc(id)}')">Save corrected bill</button>
      <button class="btn ghost" style="margin-top:9px;color:var(--danger);border-color:var(--danger)"
        onclick="R.voidBill('${esc(id)}')">Void this bill</button>`);
  },

  async editBillSave(id){
    const r = ((this._closed||[]).concat((this._h&&this._h.rows)||[])).find(x=>x.id===id);
    if (!r) return;
    const g = i => Number((document.getElementById(i)||{value:0}).value)||0;
    const ch = { rent:g('eb-rent'), overtime:g('eb-ot'), damage:g('eb-dmg'),
                 fuel:g('eb-fuel'), other:g('eb-other') };
    const rev = ch.rent+ch.overtime+ch.damage+ch.fuel+ch.other;
    const coll = g('eb-coll'), ref = g('eb-ref');
    const oldRev = Number(r.revenue)||0;
    const oldColl = Number(r.balanceCollected)||0, newColl = coll;
    const adv = Number(r.advancePaid)||0;
    const oldOut = Math.max(0, oldRev - (adv + oldColl));
    const newOut = Math.max(0, rev - (adv + newColl));

    const w = await Cloud.put('rentals', id, {
      charges: ch, revenue: rev, balanceCollected: coll, depositRefunded: ref,
      unpaid: newOut, editedAt: Date.now(), editedBy: Cloud.uid });
    if (!w.ok) return toast(Cloud.explainWrite(w.code));

    /* Two days, matching where each figure actually lives (see the note in
       checkinSave). Correcting revenue on the settle day, after the fix that
       moved revenue to check-out day, would silently create a permanent
       mismatch: the check-out day stays wrong by the old amount forever,
       and the settle day goes wrong by the correction instead. */
    const revDay = r.dayKey || localDayKey(r.outAt);
    await Cloud.rollupDelta(revDay, { revenue: rev - oldRev });
    Cloud.bumpVehicleStat(r.vehicleId, { earned: rev - oldRev });
    const dk = localDayKey(r.settledAt);
    await Cloud.rollupDelta(dk, {
      collected: newColl - oldColl,
      depositsOut: ref - (Number(r.depositRefunded)||0), outstanding: newOut - oldOut });
    Cloud.audit('bill.edit', id,
      { revenue: oldRev, collected: oldColl, refund: r.depositRefunded },
      { revenue: rev, collected: newColl, refund: ref });

    Object.assign(r, { charges: ch, revenue: rev, balanceCollected: coll, depositRefunded: ref });
    this._closed = null;
    Haptic.success(); closeSheet(); this.render(); toast('Bill corrected');
  },

  voidBill(id){
    const r = ((this._closed||[]).concat((this._h&&this._h.rows)||[])).find(x=>x.id===id);
    if (!r) return;
    if (!confirm('Void this bill?\n\nIt stays in your records marked VOID, and its amounts are removed from your totals.')) return;
    (async () => {
      const w = await Cloud.put('rentals', id, {
        voidedAt: Date.now(), voidedBy: Cloud.uid, status: 'void' });
      if (!w.ok) return toast(Cloud.explainWrite(w.code));
      /* A rental touches two days — the deposit went in on pickup day, the
         balance and refund landed on settle day. Reverse each where it
         happened, or one day is left overstated and the other understated.

         rentals and revenue are credited on CHECK-OUT day (see the note in
         checkinSave), so they reverse there too — not on settle day, where
         they used to live before that fix.

         cashIn/upiIn/cashOut/upiOut were never reversed here at all — only
         the combined `collected` figure was. That left "In the drawer" wrong
         after every single void: the money was told to leave the till record
         a second time (via `collected` going negative) without ever being
         told which half of the till — cash or UPI — it should come out of. A
         voided rental that was paid entirely in UPI would still show as
         missing cash. The reversal must split exactly the way the original
         credit did: r.outCash / r.inCash record the actual cash amounts
         directly; the deposit refund only ever went one way or the other
         (see the cash/upi toggle on i-rm, no split field exists for it), so
         it reverses by r.refundMode, matching cancelRental's own pattern. */
      const refundWasCash = (r.refundMode || 'cash') !== 'upi';
      const dk = localDayKey(r.settledAt);
      await Cloud.rollupDelta(dk, {
        collected: -(Number(r.balanceCollected)||0),
        depositsOut: -(Number(r.depositRefunded)||0),
        outstanding: -(Number(r.unpaid)||0),
        cashIn:  -(Number(r.inCash)||0),
        upiIn:   -Math.max(0, (Number(r.balanceCollected)||0) - (Number(r.inCash)||0)),
        cashOut: refundWasCash ? -(Number(r.depositRefunded)||0) : 0,
        upiOut:  refundWasCash ? 0 : -(Number(r.depositRefunded)||0),
      });
      const ok2 = r.dayKey || localDayKey(r.outAt);
      const inTotal = (Number(r.depositHeld)||0) + (Number(r.advancePaid)||0);
      await Cloud.rollupDelta(ok2, {
        rentals: -1, revenue: -(Number(r.revenue)||0),
        depositsIn: -(Number(r.depositHeld)||0),
        collected: -(Number(r.advancePaid)||0),
        cashIn:  -(Number(r.outCash)||0),
        upiIn:   -Math.max(0, inTotal - (Number(r.outCash)||0)),
      });
      Cloud.bumpVehicleStat(r.vehicleId, { earned: -(Number(r.revenue)||0), closedTrips: -1 });
      Cloud.audit('bill.void', id, { revenue:r.revenue }, null);
      this._closed = null;
      Haptic.success(); closeSheet(); this.render(); toast('Bill voided');
    })();
  },

  /* ── MONEY ──────────────────────────────────────────────────────── */
  /* ══════════════════════════════════════════════════════════════════
     MONEY
     Three numbers a rental shop actually needs, kept apart on purpose:

       EARNED     rent + overtime + recoveries on rentals settled in the period
       COLLECTED  cash that actually reached the drawer
       HELD       customer deposits — never revenue, always owed back

     The old screen showed one all-time revenue figure and nothing else, so a
     shop could not tell a good week from a bad one, nor whether the cash in
     the box was theirs. Everything below is period-scoped except HELD, which
     is a live liability and belongs to right now.
     ══════════════════════════════════════════════════════════════════ */
  PERIODS: [
    { k:'today', label:'Today',     days:1 },
    { k:'yest',  label:'Yesterday', days:1 },
    { k:'d7',    label:'7 days',    days:7 },
    { k:'d15',   label:'15 days',   days:15 },
    { k:'d30',   label:'Month',     days:30 },
    { k:'all',   label:'All',       days:9999 },
  ],
  _period: 'today',

  _range(){
    const p = this.PERIODS.find(x=>x.k===this._period) || this.PERIODS[2];
    const end = new Date(); end.setHours(23,59,59,999);
    const start = new Date(); start.setHours(0,0,0,0);
    if (p.k === 'yest'){ start.setDate(start.getDate()-1); end.setTime(start.getTime()+86399999); }
    else if (p.k !== 'today') start.setDate(start.getDate() - (p.days - 1));
    if (p.k === 'all') start.setTime(0);
    return { start: start.getTime(), end: end.getTime(), label: p.label };
  },
  _dayKeys(){
    /* 'all' means every day since the epoch — 20,000+ iterations building a
       Set the caller then ignores, on every render. The caller short-circuits
       on 'all' anyway, so return an empty Set rather than doing the work. */
    if (this._period === 'all') return new Set();
    const { start, end } = this._range();
    const out = new Set();
    for (let t = start; t <= end; t += 86400000){
      const d = new Date(t);
      out.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return out;
  },
  setPeriod(k){ this._period = k; this._closed = null; Haptic.tap(); this.render(); },

  renderMoney(){
    const rng = this._range();
    const keys = this._dayKeys();
    const days = (DB.d.daily||[]).filter(d => this._period==='all' || keys.has(d.id));
    const sum = f => days.reduce((a,d)=>a+(Number(d[f])||0),0);

    const earned = sum('revenue'), got = sum('collected');
    const depIn = sum('depositsIn'), depOut = sum('depositsOut');
    const owed = sum('outstanding'), rentals = sum('rentals');

    const open = DB.d.rentals.filter(x=>x.status==='open');
    const held = open.reduce((a,x)=>a+(Number(x.depositHeld)||0),0);
    /* Split the drawer from the bank. Before payment mode existed this line
       added UPI into "net cash", so a counted drawer could never match it —
       and a reconciliation that is always wrong is one staff learn to ignore. */
    const cashIn = sum('cashIn'), upiIn = sum('upiIn');
    const cashOut = sum('cashOut'), upiOut = sum('upiOut');
    const netCash = cashIn - cashOut;
    const netUpi  = upiIn - upiOut;
    const legacy  = (cashIn + upiIn) === 0 && (got + depIn) > 0;

    const closed = this._closed || [];
    if (!this._closed && window.Cloud && Cloud.ready){
      this._closed = [];
      Cloud.recentClosed(400).then(rows => { this._closed = rows; this.render(); });
    }
    /* Filtered by outAt, not settledAt — for the same reason revenue now rolls
       up to check-out day. A rental out at 10pm and back at 4am belongs to
       the day it happened, not the day the paperwork closed; filtering by
       settledAt put it on the wrong side of a "Yesterday" / "Today" boundary
       exactly when a shop is most likely to check. */
    const inRange = closed.filter(x => !x.voidedAt && x.status !== 'cancelled'
      && (this._period==='all' || (x.outAt >= rng.start && x.outAt <= rng.end)));

    const per = DB.d.vehicles.map(v=>{
      const rs = inRange.filter(x=>x.vehicleId===v.id);
      /* Lifetime total for payback% comes from /vehicleStats, not from the
         400-item recentClosed cache above — a shop past ~400 lifetime
         settlements would otherwise silently undercount payback on its
         older, most-paid-off bikes. */
      return { v, earned: rs.reduce((a,x)=>a+(Number(x.revenue)||0),0),
               hours: rs.reduce((a,x)=>a+(Number(x.hoursUsed)||0),0), trips: rs.length,
               rows: rs.slice().sort((a,b)=>(b.outAt||0)-(a.outAt||0)),
               payback: v.cost ? Math.min(999, Math.round(
                 R.earnedBy(v)/v.cost*100)) : null };
    }).filter(x=>x.trips>0).sort((a,b)=>b.earned-a.earned);

    /* ── rentals summary ──────────────────────────────────────────────
       Counted off outAt for every status, so a rental appears in exactly
       the period it went out in — the same rule the Earned hero and the
       per-vehicle cards now use. Counting completed by settledAt instead
       would let one rental land in two different periods depending on
       which tile you looked at.

       Ongoing is not filtered by period on purpose: a bike still out is
       out right now regardless of which period is selected, and showing
       "0 ongoing" while three bikes are on the road would be wrong on
       the one screen a shop checks to find them. Cancelled comes from
       the closed cache, which keeps cancelled rows (they are excluded
       from inRange above, not from `closed`). */
    const sumOut = x => this._period==='all' || (x.outAt >= rng.start && x.outAt <= rng.end);
    const sCompleted = inRange.length;
    const sCancelled = closed.filter(x => x.status==='cancelled' && !x.voidedAt && sumOut(x)).length;
    const sOngoing   = open.length;
    const sTotal     = sCompleted + sCancelled + sOngoing;
    const sTile = (label, val, color, icon) => `
      <div class="bs-tile">
        <div class="bs-ico" style="color:${color}">${icon}</div>
        <div><div class="bs-l">${label}</div><div class="bs-v">${val}</div></div>
      </div>`;

    const peak = Math.max(earned, got, depIn, depOut, 1);
    const bar = (l,val,col) => `
      <div style="margin-bottom:10px">
        <div class="row" style="margin-bottom:4px">
          <span class="grow" style="font-size:12.5px;font-weight:650;color:var(--t2)">${l}</span>
          <b style="font-size:13.5px;font-variant-numeric:tabular-nums">${money(val)}</b></div>
        <div class="mn-track"><div style="background:${col};width:${Math.min(100,(val/peak)*100)}%"></div></div>
      </div>`;

    /* Desktop gets a two-column layout: analysis left, reconciliation right.
       Every figure below is one this function already computed — the branch
       re-arranges, it does not recalculate. Passing them in rather than
       letting moneyTable() work them out again is deliberate: two copies of
       this arithmetic would eventually disagree. */
    if (this.isWide()) return this.moneyTable({
      rng, days, earned, got, depIn, depOut, owed, rentals, held,
      cashIn, upiIn, cashOut, upiOut, netCash, netUpi, legacy,
      per, sCompleted, sCancelled, sOngoing, sTotal });

    document.getElementById('money-body').innerHTML = `
      <div class="mn-chips">${this.PERIODS.map(p=>`<button class="mn-chip ${this._period===p.k?'on':''}"
        onclick="R.setPeriod('${p.k}')">${p.label}</button>`).join('')}</div>

      <div class="mn-hero">
        <div class="mn-hero-l">Earned · ${esc(rng.label)}</div>
        <div class="mn-hero-v">${money(earned)}</div>
        <div class="mn-hero-s">${rentals} rental${rentals===1?'':'s'} settled${
          owed>0?' · <b style="color:#FFD9A0">'+money(owed)+' still to collect</b>':''}</div>
      </div>

      <div class="card">
        <div class="sec-hd" style="margin:0 0 12px">Where the cash went</div>
        ${bar('Rent earned', earned, 'linear-gradient(90deg,#0F3D5C,#2E6D96)')}
        ${bar('Collected from customers', got, 'linear-gradient(90deg,#06C167,#048A45)')}
        ${bar('Deposits taken in', depIn, 'linear-gradient(90deg,#F5A623,#D98B0F)')}
        ${bar('Deposits returned', depOut, 'linear-gradient(90deg,#BDB9B0,#94908A)')}
      </div>

      <div class="card">
        <div class="sec-hd" style="margin:0 0 10px">Cash vs UPI</div>
        ${legacy ? `<div class="muted" style="margin-bottom:10px">These rentals were recorded before
          payment mode was tracked, so the split is not known for them.</div>` : ''}
        <div class="pm-split">
          <div class="pm-box cash${netCash<0?' short':''}">
            <div class="pm-l">\u{1F4B5} In the drawer</div>
            <div class="pm-v">${money(netCash)}</div>
            <div class="pm-s">${money(cashIn)} in · ${money(cashOut)} out</div>
            ${netCash<0 ? `<div class="pm-note"><b>Nothing is missing.</b> Of the ${money(cashOut)}
              that left the drawer ${esc(rng.label.toLowerCase())}, ${money(Math.min(cashOut,depOut))}
              was a deposit refund \u2014 giving back money a customer had already handed you on an
              earlier day. That money was counted as income back then, not now, so the drawer looks
              light on paper even though nothing is actually wrong. Keep enough change on hand to
              cover it.</div>` : ''}
          </div>
          <div class="pm-box upi${netUpi<0?' short':''}">
            <div class="pm-l">\u{1F4F2} To your bank</div>
            <div class="pm-v">${money(netUpi)}</div>
            <div class="pm-s">${money(upiIn)} in · ${money(upiOut)} out</div>
            ${netUpi<0 ? `<div class="pm-note"><b>Nothing is missing.</b> Of the ${money(upiOut)}
              sent out ${esc(rng.label.toLowerCase())}, ${money(Math.min(upiOut,depOut))} was a
              deposit refund \u2014 sending back money a customer had already paid you on an
              earlier day. That money was counted as income back then, not now, so this figure
              looks light on paper even though nothing is actually wrong.</div>` : ''}
          </div>
        </div>
        <div class="line tot" style="margin-top:12px"><span>Total money movement</span>
          <b>${money(netCash + netUpi)}</b></div>
      </div>

      <div class="card">
        <div class="sec-hd" style="margin:0 0 12px">Rentals · ${esc(rng.label)}</div>
        <div class="bs-grid">
          ${sTile('Total rentals', sTotal, '#0F3D5C', '🗓️')}
          ${sTile('Completed', sCompleted, '#06C167', '🛵')}
          ${sTile('Ongoing', sOngoing, '#F5A623', '🕒')}
          ${sTile('Cancelled', sCancelled, '#D64545', '✕')}
        </div>
        <div class="muted" style="margin-top:10px">Ongoing is live — bikes out right
          now, whichever period is selected above.</div>
      </div>

      <div class="card mn-liab">
        <div class="row"><div class="grow">
          <div class="mn-liab-l">Deposits held right now</div>
          <div class="mn-liab-v">${money(held)}</div></div>
          <div style="font-size:28px">🤝</div></div>
        <div class="muted" style="margin-top:6px">${open.length} open rental${open.length===1?'':'s'} —
        the customers' money, deliberately excluded from Earned above.</div>
      </div>

      <button class="btn ghost" style="margin-bottom:4px" onclick="R.history(true)">
        📄 Past rentals &amp; bills</button>

      <div class="sec-hd">Which bikes earned · ${esc(rng.label)}</div>
      ${!per.length ? '<div class="card"><div class="muted">No settled rentals in this period.</div></div>'
        : per.map(p=>`<div class="card">
            <div class="row"><b class="grow ell">${esc(vLabel(p.v))}
              ${p.v.regNo?'<span class="muted"> '+esc(p.v.regNo)+'</span>':''}</b>
              <b>${money(p.earned)}</b></div>
            <div class="mn-track" style="margin:8px 0 6px"><div style="background:linear-gradient(90deg,#0F3D5C,#3E7FA8);width:${(p.earned/(per[0].earned||1))*100}%"></div></div>
            <div class="muted">${p.trips} rental${p.trips===1?'':'s'} · ${fmtDur(p.hours)} on rent${
              p.payback!==null?' · <b style="color:'+(p.payback>=100?'var(--success-d)':'var(--t2)')+'">'+p.payback+'% of cost recovered</b>':''}</div>
            <!-- Every rental listed inline rather than behind a tap. The sheet
                 that R.vehicleBills() opens still exists and is still reachable
                 from history; this is the same data without the click, because
                 the question "which rentals made up this number" was being
                 asked of every single card. -->
            <div class="bs-rows">
              ${p.rows.map(r=>`<div class="bs-row">
                <div class="grow ell">
                  <div class="bs-row-n">${esc(r.customerName||'Walk-in')}</div>
                  <div class="muted">${r.outAt?fmtDT(r.outAt):''}${
                    r.extraHours?' · '+r.extraHours+'h extra':''}</div>
                </div>
                <b>${money(r.revenue)}</b>
                <button class="bs-bill" onclick="event.stopPropagation();R.bill('${esc(r.id)}')">BILL ›</button>
              </div>`).join('')}
            </div>
          </div>`).join('')}

      ${this.isOwner() ? `<button class="btn ghost" style="margin-top:14px;font-size:12px;color:var(--t3)"
          onclick="R.repairMoney()">Fix past earnings numbers</button>` : ''}
    `;
  },

  /* ── MONEY, desktop ──────────────────────────────────────────────────
     Two columns: how the business is doing on the left, does-this-match-
     my-drawer on the right. Takes every figure as an argument from
     renderMoney() rather than recomputing — one arithmetic, two layouts.
     The only thing computed here is the per-day series for the chart,
     which the phone layout has no use for. */
  moneyTable(d){
    const { rng, days, earned, got, depIn, depOut, owed, rentals, held,
            cashIn, upiIn, cashOut, upiOut, netCash, netUpi, legacy,
            per, sCompleted, sCancelled, sOngoing, sTotal } = d;

    /* Shape over time is the one thing a phone genuinely cannot show, and
       it needs no new plumbing: /daily already holds one document per day
       with a revenue field. Sorted by the document id, which is the local
       date key, so the bars read left-to-right oldest-to-newest. */
    const series = (days||[]).slice()
      .sort((a,b)=> String(a.id).localeCompare(String(b.id)))
      .map(x => ({ key:String(x.id), v: Number(x.revenue)||0 }))
      .slice(-31);
    const dayPeak = series.reduce((m,s)=>Math.max(m,s.v), 0) || 1;
    const best = series.reduce((m,s)=> s.v>((m&&m.v)||0)?s:m, null);
    const avg = series.length ? Math.round(series.reduce((a,s)=>a+s.v,0)/series.length) : 0;
    const shortDay = k => { const p = String(k).split('-');
      const dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      return isFinite(dt.getTime())
        ? dt.toLocaleDateString('en-IN',{ weekday:'short' }) : String(k).slice(-2); };
    const dayFull = k => { const p = String(k).split('-');
      const dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      return isFinite(dt.getTime())
        ? dt.toLocaleDateString('en-IN',{ day:'numeric', month:'short' }) : String(k); };

    const chart = !series.length ? '' : `
      <div class="card">
        <div class="dmn-h"><span class="dmn-t">Earned per day</span><span class="grow"></span>
          ${best && best.v ? `<span class="dmn-sub">Best: ${esc(dayFull(best.key))} ${money(best.v)}</span>`:''}
        </div>
        <div class="dmn-b">
          <div class="dmn-chart">
            ${series.map(s=>`<div class="dmn-bar${best&&s.key===best.key&&s.v?' top':''}"
                title="${esc(dayFull(s.key))} — ${money(s.v)}">
              <span class="dmn-bv">${s.v?money(s.v):''}</span>
              <div class="dmn-bt" style="height:${Math.max(2,(s.v/dayPeak)*100)}%"></div>
              <span class="dmn-bl">${esc(series.length>14?String(s.key).slice(-2):shortDay(s.key))}</span>
            </div>`).join('')}
          </div>
          <div class="dmn-leg"><span>Daily average <b>${money(avg)}</b></span>
            <span>${series.length} day${series.length===1?'':'s'} with data</span></div>
        </div>
      </div>`;

    const flow = (l,val,col) => `
      <div class="dmn-flow"><div class="dmn-flow-l">${l}</div>
        <div class="dmn-flow-t"><div style="background:${col};width:${
          Math.min(100,(val/(Math.max(earned,got,depIn,depOut,1)))*100)}%"></div></div>
        <div class="dmn-flow-v">${money(val)}</div></div>`;

    const tile = (l,v,col,icon) => `<div class="dmn-tile"><span class="dmn-tile-i">${icon}</span>
      <div><div class="dmn-tile-l">${l}</div>
        <div class="dmn-tile-v" style="color:${col}">${v}</div></div></div>`;

    const topEarn = per.length ? per[0].earned || 1 : 1;
    const noneEarned = (DB.d.vehicles||[]).filter(v=>!v.deletedAt).length - per.length;

    document.getElementById('money-body').innerHTML = `
      <div class="dmn-hrow">
        <div class="mn-chips" style="margin:0">${this.PERIODS.map(p=>`<button class="mn-chip ${
          this._period===p.k?'on':''}" onclick="R.setPeriod('${p.k}')">${p.label}</button>`).join('')}</div>
        <span class="grow"></span>
        <button class="dfl-chip" onclick="R.history(true)">\u{1F4C4} Past rentals &amp; bills</button>
        ${this.isOwner()?`<button class="dfl-chip" onclick="R.repairMoney()">Fix past earnings</button>`:''}
      </div>

      <div class="dmn-top">
        <div class="dmn-hero">

  /* One-time cleanup for two bugs that share the same fix: the day-bucketing

     the wrong calendar day) and the Fleet Earned/Idle days bug (those columns
     read a listener that could never contain a closed rental). Both rebuild
     from the same rental history in one pass. Owner-only, and asks first
     since it rewrites numbers the shop has already looked at. */
  repairMoney(){
    if (!confirm('This rebuilds every day\'s earnings and every vehicle\'s '
      + 'totals from your actual rentals, fixing entries filed under the '
      + 'wrong day and Fleet earnings that were stuck at zero. It can take '
      + 'a few seconds and cannot be undone. Continue?')) return;
    toast('Rebuilding — this may take a moment…');
    (async () => {
      const res = await Cloud.repairDailyRollups();
      if (!res.ok) return toast(res.msg || 'Could not repair — ' + (res.code||'try again'));
      Haptic.success();
      this._closed = null;
      /* The vehicleStats half can fail on its own (new collection, rules
         not deployed for it yet) without the daily half being touched —
         say so plainly instead of a blanket success message that would
         hide a still-broken Fleet page. */
      if (res.vehicleErr){
        toast('Fixed ' + res.days + ' day' + (res.days===1?'':'s')
          + ' · Fleet earnings still blocked (' + res.vehicleErr + ') — send this to your developer');
      } else {
        toast('Fixed ' + res.days + ' day' + (res.days===1?'':'s') + ' and '
          + res.vehicles + ' vehicle' + (res.vehicles===1?'':'s')
          + ' across ' + res.rentals + ' rentals');
      }
      this.render();
    })();
