      </tbody></table>
      <div class="dfl-foot"><span>Showing ${list.length} of ${live.length} ${noun(1)}</span>
        <span>Earned today <b style="color:var(--success-d)">${money(todayTotal)}</b>
          \u00b7 lifetime <b>${money(lifeTotal)}</b></span></div>
      </div>`;
    if (q){
      const el = document.getElementById('dfl-q');
      if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  },

  fleetFilter(k){ this._ffilter = k; this.renderFleet(); },

  /* One bar, every screen. Sits where the header was so nothing shifts under
     the cursor when a row is ticked. */
  bulkBar(label, actions){
    return `<div class="bulkbar">
      ${this.cbox(true)}<b>${esc(label)}</b><span class="sp"></span>
      ${actions.map(a=>`<button class="bb ${a[2]||''}" onclick="${a[0]}">${esc(a[1])}</button>`).join('')}
      <button class="bb gh" onclick="R.selClear()">Clear</button>
    </div>`;
  },

  bulkStatus(st){
    const ids = this.selIds(); if (!ids.length) return;
    const out = ids.filter(id => (DB.d.rentals||[]).some(r=>r.vehicleId===id && r.status==='open'));
    if (out.length) return toast(out.length + ' of these are out — check them in first');
    ids.forEach(id => {
      const v = (DB.d.vehicles||[]).find(x=>x.id===id); if (!v) return;
      v.status = st;
      if (window.Cloud && Cloud.ready) Cloud.put('vehicles', id, { status: st });
    });
    DB.save(); this._sel = null; this.render();
    toast(ids.length + ' ' + noun(ids.length!==1) + ' marked ' + st);
  },

  bulkRetire(){
    const ids = this.selIds(); if (!ids.length) return;
    const out = ids.filter(id => (DB.d.rentals||[]).some(r=>r.vehicleId===id && r.status==='open'));
    if (out.length) return toast(out.length + ' of these are out — check them in first');
    /* Reads /vehicleStats, not DB.d.rentals — by this point every selected
       id has already passed the open-rental check above, so DB.d.rentals
       (open-only) could never show history here even when a bike has a
       full closed-rental past. That made this confirm always claim "none
       of them have been rented," even for a bike with 100 settled trips. */
    const withHist = ids.filter(id => {
      const s = (DB.d.vehicleStats||[]).find(x=>x.id===id);
      return s && (Number(s.closedTrips)||0) > 0;
    });
    if (!confirm('Remove ' + ids.length + ' ' + noun(ids.length!==1) + '?\n\n' +
      (withHist.length ? withHist.length + ' of them have rental history, which is kept.'
                       : 'None of them have been rented.'))) return;
    /* Soft delete only — the rules forbid a hard one, and history should
       outlive the bike anyway. */
    ids.forEach(id => { if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', id); });
    DB.d.vehicles = (DB.d.vehicles||[]).filter(v=>!ids.includes(v.id));
    DB.save(); this._sel = null; this.render();
    toast('Removed ' + ids.length + ' ' + noun(ids.length!==1));
  },

  docWarn(v){
    const soon = Date.now() + 30*24*HOUR;
    const bad = [];
    if (v.insExpiry && new Date(v.insExpiry).getTime() < Date.now()) bad.push('INSURANCE EXPIRED');
    else if (v.insExpiry && new Date(v.insExpiry).getTime() < soon) bad.push('INSURANCE DUE');
    if (v.pucExpiry && new Date(v.pucExpiry).getTime() < Date.now()) bad.push('PUC EXPIRED');
    else if (v.pucExpiry && new Date(v.pucExpiry).getTime() < soon) bad.push('PUC DUE');
    return bad[0] || '';
  },
  docBlocked(v){
    const now = Date.now();
    if (v.insExpiry && new Date(v.insExpiry).getTime() < now) return 'insurance';
    if (v.pucExpiry && new Date(v.pucExpiry).getTime() < now) return 'PUC';
    /* Commercial-only, and only when the date was actually set. Guarded on
       v.commercial as well as on the date so that turning the toggle OFF
       stops a stale fitness date from blocking a car the shop has since
       re-registered as private — otherwise the only way to unblock it would
       be to clear a field that is no longer visible. */
    if (v.commercial){
      if (v.fitnessExpiry && new Date(v.fitnessExpiry).getTime() < now) return 'fitness';
      if (v.permitExpiry  && new Date(v.permitExpiry).getTime()  < now) return 'permit';
    }
    return '';
  },

  /* (v1.2.1) The auto-seed only ran when the fleet was completely empty, so a
     single leftover test bike silently blocked all ten — and a one-time flag
     meant there was no way to ask for them again. This is the same job as a
     visible, repeatable button: one bike for every rate card that has none.
     Safe to press any time; it never duplicates and never touches what is
     already there. */
  fillFromRates(){
    let made = 0;
    DB.d.rates.forEach(rc => {
      if (DB.d.vehicles.some(v => v.rateId === rc.id)) return;
      const rec = { name: rc.model, regNo: '', rateId: rc.id, model: rc.model,
                    kind: fleetKind()==='car' ? 'car' : 'bike',
                    status: 'available', cost: 0, insExpiry: '', pucExpiry: '', odo: 0 };
      if (window.Cloud && Cloud.ready) Cloud.put('vehicles', Cloud.nid('v'), rec);
      else DB.d.vehicles.push(Object.assign({ id: DB.id('v') }, rec));
      made++;
    });
    if (!made) return toast('Every rate card already has a ${noun()}');
    DB.save(); this.render();
    toast(made + ' bike' + (made===1?'':'s') + ' added from your rate card');
  },

  editVehicle(id, preRate){
    if (!this.isManager()) return toast('Ask the owner or manager to change ${noun(1)}');
    const v = id ? DB.d.vehicles.find(x=>x.id===id) : null;
    const sel = v ? v.rateId : (preRate||'');
    const opts = DB.d.rates.map(r=>
      /* A seeded rate card is all zeros, so "dep ₹0" is accurate and useless —
         it reads as "this bike needs no deposit" when it means "nobody has told
         me the price yet". rateReady() is the same test that blocks renting the
         bike out, so the dropdown, the fleet card and the counter now agree on
         what "set" means. */
      `<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.model)} · ${
        this.rateReady(r) ? 'dep ' + money(r.deposit) : 'rate not set'
      }</option>`).join('');
    const anyReady = (DB.d.rates||[]).some(r => this.rateReady(r));
    /* An existing vehicle keeps whatever it is; a new one follows the picker,
       or the shop's single answer if it only rents one kind. */
    const ek = v ? (v.kind || 'bike')
                 : (this._addKind || (rentKind()==='car' ? 'car' : 'bike'));
    this._addKind = ek;
    openSheet(`
      <div class="sheet-hd"><h2>${v?'Edit '+noun(0,ek):'Add '+noun(0,ek)}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      ${(!v && rentKind()==='both') ? `
        <!-- A mixed shop must be asked, on EVERY vehicle and not just the
             first. This sheet is the one used from the second vehicle onward,
             and it never had the picker — so a shop that answered "both" was
             offered Activa and Jupiter for ever and could not add a car at
             all. -->
        <div class="kindrow">
          <div class="kbtn ${ek==='bike'?'on':''}" onclick="R.setEditKind('bike')">
            <span class="e">\u{1F6F5}</span><b>Bike</b></div>
          <div class="kbtn ${ek==='car'?'on car':''}" onclick="R.setEditKind('car')">
            <span class="e">\u{1F697}</span><b>Car</b></div>
        </div>` : ''}
      <div class="fld"><label class="lbl">${Noun(0,ek)} name <span class="req">*</span></label>
        <input class="in" id="v-name" value="${esc(v?(v.name||v.regNo||''):'')}"
          placeholder="${ek==='car'?'Swift — white':'Activa 3G — red'}"></div>
      ${v ? '' : `<div class="muted" style="margin:-4px 2px 6px">Common models \u2014 tap to fill, or type your own</div>
      <div class="chips" style="margin-bottom:12px">${((ek==='car'?window.CAR_SUGGESTIONS:window.MODEL_SUGGESTIONS)||[]).map(m=>
        `<span class="chip" onclick="R.pickModel('${esc(m)}')">${esc(m)}</span>`).join('')}</div>`}
      <div class="fld"><label class="lbl">Vehicle no. <span class="muted">optional</span></label>
        <input class="in" id="v-reg" value="${esc(v?(v.regNo||''):'')}"
          placeholder="MP04 AB 1234" autocapitalize="characters"></div>
      <!-- Duplicate-name/duplicate-number rejections used to be a toast only —
           2.6 seconds, easy to miss if a counter worker glances away, and the
           sheet was left open with no visible sign anything went wrong. A
           second bike typed in good faith could be silently discarded. This
           banner stays until the conflict is actually fixed or the sheet is
           closed on purpose. -->
      <div id="v-err"></div>
      <div class="fld"><label class="lbl">Rate card <span class="req">*</span></label>
        <select class="in" id="v-rate" onchange="R.rateSel()">
          <option value="">— choose —</option>${opts}
          <option value="__new">+ New rate \u2014 set the price here</option></select>

        <!-- Set the price inline rather than sending him to Rates and back. A
             shop adding its second model has one rate card and no reason to
             know that a rate card is a separate thing from a bike. -->
        <div id="v-newrate" style="display:none">
          <div class="card" style="background:var(--y-tint);border-color:var(--y-bd);margin-top:10px;padding:13px 12px">
            <b style="font-size:13.5px">Price for this model</b>
            <div class="muted" style="margin:2px 0 4px">Every ${noun()} you point at this rate card
              charges the same.</div>
            ${this.rateFields('vnr', null, ek)}
          </div>
        </div>
        ${anyReady ? '' : `
        <!-- Every option in that picker reads "rate not set", so choosing one is
             a dead end: the bike is created and then cannot be rented out. Say
             that here, next to the field causing it, rather than letting the
             shop find out at the counter. Adding the bike is still allowed —
             building the fleet first is a legitimate order of work. -->
        <div class="muted" style="margin-top:7px;color:var(--danger);line-height:1.5">
          None of your rate cards have prices yet, so this ${noun(0,ek)} will not be
          rentable until you set one.
          <span style="font-weight:850;text-decoration:underline"
            onclick="closeSheet();R.nav('rates')">Set prices first</span>
        </div>`}</div>

      <button type="button" class="btn ghost" style="margin:4px 0 12px"
        onclick="R.more('v-more',this)">More details <span class="muted">— optional</span></button>
      <div id="v-more" style="display:none">
        <div class="two">
          <div class="fld"><label class="lbl">Status</label>
            <select class="in" id="v-status">
              ${['available','rented','maintenance','retired'].map(s=>
                `<option value="${s}" ${v&&v.status===s?'selected':''}>${s}</option>`).join('')}
            </select></div>
          <div class="fld"><label class="lbl">Purchase cost</label>
            <input class="in" id="v-cost" type="number" inputmode="numeric" value="${v?(v.cost||''):''}" placeholder="₹"></div>
        </div>
        <div class="two">
          <div class="fld"><label class="lbl">Insurance expiry</label>
            <input class="in" id="v-ins" type="date" value="${v?(v.insExpiry||''):''}"></div>
          <div class="fld"><label class="lbl">PUC expiry</label>
            <input class="in" id="v-puc" type="date" value="${v?(v.pucExpiry||''):''}"></div>
        </div>
        <div class="muted" style="margin:-4px 2px 12px;font-size:11.5px">
          Leave the dates blank if you do not want expiry warnings.</div>

        <!-- Cars only. Fitness and permit apply to COMMERCIAL vehicles; a
             private self-drive car has neither, so two permanently-blank date
             fields on every car is exactly the clutter that made the original
             rate form unusable. Asked once, and the dates appear only if the
             answer is yes.

             An absent commercial flag means off, so no existing car gains a field
             or a new way to be blocked. -->
        ${ek==='car' ? `
        <div class="sw" style="margin-bottom:11px">
          <div class="tog${v&&v.commercial?' on':''}" id="v-comm-t"
            onclick="R.toggleCommercial()"><i></i></div>
          <div><b style="font-size:12.5px;display:block">Runs on a commercial permit</b>
            <span class="muted">Yellow-plate / tourist taxi</span></div>
        </div>
        <div id="v-comm" style="display:${v&&v.commercial?'':'none'}">
          <div class="two">
            <div class="fld"><label class="lbl">Fitness expiry</label>
              <input class="in" id="v-fit" type="date" value="${v?(v.fitnessExpiry||''):''}"></div>
            <div class="fld"><label class="lbl">Permit expiry
              <span class="muted">optional</span></label>
              <input class="in" id="v-permit" type="date" value="${v?(v.permitExpiry||''):''}"></div>
          </div>
        </div>

        <!-- The three questions a customer actually asks on the phone. Colour,
             year and chassis number are fleet-management fields; this is a
             counter app. All optional — a shop that fills none loses nothing,
             and they surface in the vehicle picker where they pay off. -->
        <div class="muted" style="margin:4px 2px 6px;font-weight:800;letter-spacing:.05em;
          text-transform:uppercase;font-size:9.5px">The car</div>
        <div class="fld"><label class="lbl">Transmission</label>
          <div class="pm" id="v-trans">
            <button type="button" class="${!v||v.transmission!=='automatic'?'on':''}"
              data-m="manual" onclick="R.pmPick('v-trans','manual')">Manual</button>
            <button type="button" class="${v&&v.transmission==='automatic'?'on':''}"
              data-m="automatic" onclick="R.pmPick('v-trans','automatic')">Automatic</button>
          </div></div>
        <div class="two">
          <div class="fld"><label class="lbl">Seats</label>
            <input class="in" id="v-seats" type="number" inputmode="numeric"
              value="${v?(v.seats||''):''}" placeholder="5"></div>
          <div class="fld"><label class="lbl">Fuel</label>
            <select class="in" id="v-fuel">
              ${['','Petrol','Diesel','CNG','Electric'].map(s=>
                `<option value="${s}" ${v&&v.fuelType===s?'selected':''}>${s||'—'}</option>`).join('')}
            </select></div>
        </div>` : ''}
      </div>
      <!-- Same function as the heading above it, and the heading already reads
           the vehicle's kind correctly — these two buttons were the one part
           of this sheet that never got swept. A car shop saw "Add car" at the
           top and "Add bike" at the very button it had to press. -->
      <button class="btn" onclick="R.saveVehicle('${id||''}')">${v?'Save changes':'Add '+noun(0,ek)}</button>
      ${v?`<button class="btn ghost" style="margin-top:9px" onclick="R.delVehicle('${id}')">Remove ${noun(0,ek)}</button>`:''}
    `);
  },

  /* collapsible "more details" — keeps the counter path to the fields the
     shop actually asked for, without deleting the ones that protect them */
  more(id, btn){
    const el = document.getElementById(id);
    const open = el.style.display !== 'none';
    el.style.display = open ? 'none' : '';
    btn.innerHTML = (open ? 'More details' : 'Hide details') + ' <span class="muted">— optional</span>';
  },

  /* ── rate entry ───────────────────────────────────────────────────
     One definition, used by the first-bike sheet and by the inline
     "+ New rate" in Add bike. Two copies of a price form is how the two
     drift apart and one of them quietly stops saving the 7-day rate.

     Laid out as rows rather than a grid: label left, amount right, in the
     order a printed rate card lists them. A shop can start at the top and
     tab straight down with the keyboard's Next key, which is the fastest way
     to enter six numbers on a phone.

     Only 24 hr and overtime are required. The rest are the tiers this shop
     may simply not rent by, and demanding five numbers before a bike can
     exist is what made the old screen feel like paperwork. */
  rateFields(pfx, rc, kind){
    rc = rc || {};
    const t = rc.tiers || {};
    /* No placeholder. A grey "700" sitting right-aligned in a price field is
       indistinguishable from a real 700 at arm's length on a cream card — the
       first person to use this filled nothing in, saw every row apparently
       complete, and got told to enter the 24-hour rate. Example prices live in
       the hint line underneath instead, where they cannot be mistaken for
       data. */
    const row = (id, label, val, req, unit) => `
      <div class="rt-row">
        <label class="rt-l" for="${pfx}-${id}">${label}${req?' <span class="req">*</span>':''}</label>
        <div class="rt-in"><span>${unit||'\u20B9'}</span>
          <input id="${pfx}-${id}" type="number" inputmode="numeric" enterkeyhint="next"
            value="${val?val:''}"></div>
      </div>`;
    return `
      <div class="rt">
        ${row('dep','Deposit', rc.deposit, false)}
        <div class="rt-sep">Rent by</div>
        ${row('h3','3 hours',  t.h3,  false)}
        ${row('h6','6 hours',  t.h6,  false)}
        ${row('h12','12 hours',t.h12, false)}
        ${row('h24','24 hours',t.h24, true)}
        ${row('d7','7 days',   t.d7,  false)}
        <div class="rt-sep">If they are late</div>
        ${row('ot','Overtime / hour', rc.ot, true)}
        <!-- Cars only, and optional even there. A scooter's wear tracks time,
             not distance, so metering one is a tax on the ninety percent to
             serve the ten — same reasoning as every other kind-gated field in
             this app. Blank means unlimited, matching how every hourly tier
             already behaves: absent is "not sold that way", never zero. -->
        ${kind==='car' ? `
        <div class="rt-sep">Kilometres \u2014 optional</div>
        ${row('kmi','Included per day', rc.kmIncluded, false, 'km')}
        ${row('kme','After that, per km', rc.kmExtra, false)}
        ` : ''}
        <!-- No example figures anywhere on this form. A number printed near an
             empty price box gets read as the price, whether it sits inside the
             box or under it. Every rate here comes from the shop and nowhere
             else. -->
        <div class="rt-hint">
          Fill only the ones you actually rent by \u2014 blank ones are not offered at the
          counter. <b>24 hours</b> and <b>overtime</b> are the two the app cannot work without.
        </div>
      </div>`;
  },
  /* Reads whatever rateFields(pfx) wrote. Returns null with a toast if the two
     required numbers are missing, so both callers fail the same way. */
  readRate(pfx){
    const g = i => document.getElementById(pfx + '-' + i);
    const n = i => Number((g(i)||{}).value) || 0;
    /* Point at the box, do not just complain. A toast saying "enter the 24-hour
       rate" while the row looks the same as every other row is how someone ends
       up certain they already filled it in. */
    const flag = i => { const el = g(i); if (el && el.parentElement){
      el.parentElement.classList.add('miss'); el.focus(); } };
    const clear = () => ['dep','h3','h6','h12','h24','d7','ot'].forEach(i => {
      const el = g(i); if (el && el.parentElement) el.parentElement.classList.remove('miss'); });
    clear();
    const d24 = n('h24'), ot = n('ot');
    if (!(d24 > 0)) { flag('h24'); Haptic.error(); toast('Enter what you charge for 24 hours'); return null; }
    if (!(ot > 0))  { flag('ot');  Haptic.error(); toast('Enter the overtime rate \u2014 it is what late returns cost you'); return null; }
    /* km fields only exist in the markup for a car, and even then they are
       optional — n() already returns 0 for a blank box, which is exactly
       "unlimited" once quote()/the checkout preview reads it. */
    const out = { deposit: n('dep'), ot: ot,
             tiers: { h3:n('h3'), h6:n('h6'), h12:n('h12'), h24:d24, d7:n('d7') } };
    if (g('kmi') || g('kme')){ out.kmIncluded = n('kmi'); out.kmExtra = n('kme'); }
    return out;
  },

  /* ══════════════════════════════════════════════════════════════════
     ADVANCE BOOKINGS
     A booking holds a MODEL for a window. The bike the shop happened to be
     looking at is recorded as a preference and chosen for real at pickup —
     naming it now would mean reassigning by hand every time a bike is late,
     damaged or sold before the date arrives.
     ══════════════════════════════════════════════════════════════════ */

  /* Anything within the next half hour is a rental; beyond that is a booking.
     
     90 seconds was too tight: a shop that says "out at 7.30" when it is 7.05,
     because the customer is parking his car, would have had it silently
     recorded as a booking. Nobody fills in a checkout sheet half an hour
     before handing a bike over unless they mean to reserve it — and the sheet
     says out loud which mode it is in, so a wrong guess is visible before
     anything saves. */
  BOOK_SLACK_MS: 30 * 60 * 1000,
  isFuture(ms){ return ms > Date.now() + this.BOOK_SLACK_MS; },

  bookings(){ return (DB.d.bookings||[]).filter(b => b.status === 'held'); },

  /* How many bikes of this model are free for [from,to).
     
     total          bikes on the rate card, not deleted, not retired
     minus rentals  open rentals of those bikes still running at `from`
     minus bookings other held bookings for the model whose window overlaps
     
     Overlap is counted rather than peak concurrency: two bookings on
     different days inside one long window both count against it. That makes
     the answer conservative and occasionally refuses a booking that would
     have fitted. Correct direction to be wrong — turning one away costs a
     day's rent, double-booking costs the customer and the review. */
  /* Give a pooled vehicle its own rate card. Copies the prices it is
     already being charged at, so nothing changes for the customer until
     the owner edits them — the point is to separate the pool and the
     price, not to silently re-price a bike mid-season. Named after the
     vehicle, since that is the name the shop actually uses for it. */
  splitRate(vehicleId){
    const v = (DB.d.vehicles||[]).find(x=>x.id===vehicleId); if (!v) return;
    const src = (DB.d.rates||[]).find(r=>r.id===v.rateId);
    if (!src) return toast('That '+noun()+' has no rate card to split');
    const name = String(vLabel(v)||'').trim() || src.model;
    if (!confirm('Give ' + name + ' its own rate card?\n\n'
      + 'It will start with the same prices as ' + src.model
      + ', so nothing changes for customers until you edit them. '
      + name + ' will stop sharing availability with ' + src.model + '.')) return;
    const rec = {
      model: name,
      deposit: Number(src.deposit)||0,
      ot: Number(src.ot)||0,
      tiers: Object.assign({}, src.tiers||{}),
      kind: src.kind || v.kind || 'bike',
      ...(src.kmIncluded!=null ? { kmIncluded: src.kmIncluded } : {}),
      ...(src.kmExtra!=null ? { kmExtra: src.kmExtra } : {}),
      weekend: src.weekend ? JSON.parse(JSON.stringify(src.weekend)) : null
    };
    if (window.Cloud && Cloud.ready){
      const rid = Cloud.nid('rc');
      Cloud.put('rates', rid, rec).then(w => {
        if (!w.ok) return toast(Cloud.explainWrite(w.code));
        Cloud.put('vehicles', v.id, { rateId: rid, model: name }).then(w2 => {
          if (!w2.ok) return toast(Cloud.explainWrite(w2.code));
          Haptic.success();
          toast(name + ' now has its own rate card — set its prices in Rates');
        });
      });
      /* Optimistic local update so the grid splits immediately rather than
         waiting on the round trip. */
      DB.d.rates.push(Object.assign({ id: rid }, rec));
      v.rateId = rid; v.model = name;
    } else {
      const rid = DB.id('rc');
      DB.d.rates.push(Object.assign({ id: rid }, rec));
      v.rateId = rid; v.model = name;
    }
    DB.save(); this.render();
  },

  bookFree(rateId, from, to, ignoreId){
    const bikes = (DB.d.vehicles||[]).filter(v =>
      !v.deletedAt && v.rateId === rateId && v.status !== 'retired');
    const total = bikes.length;
    if (!total) return { total:0, free:0, outNow:0, booked:0 };
    const ids = new Set(bikes.map(v=>v.id));
    /* An open rental means the bike is physically out RIGHT NOW, so its
       effective return time is at least this moment — hence max(dueAt, now)
       rather than dueAt alone.

       With bare `dueAt > from`, an OVERDUE rental fell out of today's
       window entirely: due yesterday, still not returned, and the window
       starts at midnight today, so dueAt < from and the bike counted as
       available. A shop with one car out three days late was shown two
       cars free and could book both. The longer a bike was overdue the
       more confidently the app said it was free, which is exactly backwards.

       Future days are deliberately unaffected: for a window starting after
       now, max() collapses back to dueAt, so an overdue bike is still
       assumed to come back rather than blocking every future day forever. */
    const nowMs = Date.now();
    const outNow = (DB.d.rentals||[]).filter(r =>
      r.status === 'open' && ids.has(r.vehicleId)
      && Math.max(Number(r.dueAt)||0, nowMs) > from).length;
    const booked = this.bookings().filter(b =>
      b.id !== ignoreId && b.rateId === rateId &&
      Number(b.fromAt) < to && Number(b.toAt) > from).length;
    return { total, outNow, booked, free: Math.max(0, total - outNow - booked) };
  },

  /* Held bookings for a model that start before a proposed rental would end —
     the walk-in clash. Returns the soonest, which is the one worth naming. */
  bookClash(rateId, from, to, ignoreId){
    const hits = this.bookings().filter(b =>
      b.id !== ignoreId && b.rateId === rateId &&
      Number(b.fromAt) < to && Number(b.toAt) > from);
    if (!hits.length) return null;
    const f = this.bookFree(rateId, from, to, ignoreId);
    /* Only a clash if capacity actually runs out. Three Jupiters and one
       booking is not a conflict. */
    if (f.free > 0) return null;
    hits.sort((a,b)=> Number(a.fromAt) - Number(b.fromAt));
    return hits[0];
  },

  /* Models with capacity in the window, for the "offer something else" panel. */
  bookAlternatives(rateId, from, to){
    return (DB.d.rates||[])
      .filter(r => r.id !== rateId && this.rateReady(r))
      .map(r => ({ rate:r, f:this.bookFree(r.id, from, to) }))
      .filter(x => x.f.free > 0)
      .sort((a,b)=> b.f.free - a.f.free)
      .slice(0,3);
  },

  /* The soonest time this model has capacity, scanning day by day. Cheap: at
     most 21 evaluations of an in-memory filter. */
  bookNextFree(rateId, from, to){
    const span = to - from;
    for (let d=1; d<=21; d++){
      const f2 = from + d*24*HOUR;
      if (this.bookFree(rateId, f2, f2+span).free > 0) return f2;
    }
    return null;
  },

  /* ── first bike ──────────────────────────────────────────────────
     A rate card cannot be chosen before one exists, so the first bike collects
     its own price and writes both records together. Three price fields only:
     deposit, a 24-hour rate and overtime. The 3, 6, 12-hour and weekly tiers
     are real and stay in Rates — a shop that needs them will go looking, and
     one that does not should not have to type five zeros to open for business. */
  firstBike(){
    /* Which list depends on what the shop said it rents. A car yard offered
       Activa and Jupiter would conclude the app is not for it. */
    const k = this._addKind || (rentKind()==='car' ? 'car' : 'bike');
    this._addKind = k;
    const src = k==='car' ? (window.CAR_SUGGESTIONS||[]) : (window.MODEL_SUGGESTIONS||[]);
    const chips = src.map(m =>
      `<span class="chip" onclick="R.pickModel('${esc(m)}')">${esc(m)}</span>`).join('');
    /* A shop that rents both must be asked which one. A shop that rents one
       kind is not — that was the whole point of asking at signup. */
    const pick = rentKind()==='both' ? `
      <div class="kindrow">
        <div class="kbtn ${k==='bike'?'on':''}" onclick="R.setAddKind('bike')">
          <span class="e">\u{1F6F5}</span><b>Bike</b></div>
        <div class="kbtn ${k==='car'?'on car':''}" onclick="R.setAddKind('car')">
          <span class="e">\u{1F697}</span><b>Car</b></div>
      </div>` : '';
    openSheet(`
      <div class="sheet-hd"><h2>Add your first ${noun(0,k)}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>

      ${pick}
      <div class="fld"><label class="lbl">${Noun(0,k)} name <span class="req">*</span></label>
        <input class="in" id="fb-name" placeholder="${k==='car'?'Swift':'Activa 5G'}" autocomplete="off"></div>
      <div class="muted" style="margin:-4px 2px 6px">Common models \u2014 tap to fill, or type your own</div>
      <div class="chips" id="fb-chips">${chips}</div>

      <div class="fld" style="margin-top:12px"><label class="lbl">Vehicle no.
        <span class="muted">optional</span></label>
        <input class="in" id="fb-reg" placeholder="MP04 AB 1234" autocapitalize="characters"></div>

      <div class="card" style="background:var(--y-tint);border-color:var(--y-bd);padding:13px 12px">
        <b style="font-size:13.5px">What do you charge for it?</b>
        <div class="muted" style="margin:2px 0 4px">This becomes the rate card for every ${noun()} of
          this model you add later.</div>
        ${this.rateFields('fb', null, k)}
      </div>

      <button class="btn" onclick="R.saveFirstBike()">Save ${noun()} &amp; price</button>
      ${this.isOwner() ? `<button class="btn ghost" style="margin-top:9px" onclick="closeSheet();R.scanRates()">
        \u{1F4F7} I have a printed rate card \u2014 photograph it</button>` : ''}
      <div class="muted" style="text-align:center;margin-top:9px">You can add more bikes and more
        rates any time.</div>`);
  },
  /* Re-opens the sheet so the chips, placeholder and heading all follow. The
     name field is kept if the shop already typed one. */
  setAddKind(k){
    if (this._addKind === k) return;
    const el = document.getElementById('fb-name');
    this._keepName = el ? el.value : '';
    this._addKind = k;
    Haptic.tap();
    this.firstBike();
    const el2 = document.getElementById('fb-name');
    if (el2 && this._keepName) el2.value = this._keepName;
    this._keepName = '';
  },

  pickModel(m){
    const el = document.getElementById('fb-name') || document.getElementById('v-name');
    if (el){ el.value = m; }
    /* Mark the tapped chip so the choice is visible after the keyboard covers
       the field. Not focusing the input on purpose: on Android that throws the
       keyboard up and hides the rest of the sheet, and the shop still has a
       deposit and two prices to fill in below. */
    document.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('on', (c.textContent||'').trim() === m));
    Haptic.tap();
  },
  saveFirstBike(){
    /* _addKind, not a local — saveFirstBike runs from an onclick long after
       firstBike() returned, so the k it computed is out of scope. */
    const k = this._addKind || (rentKind()==='car' ? 'car' : 'bike');
    const g = i => document.getElementById(i);
    const name = (g('fb-name').value||'').trim();
    const reg  = (g('fb-reg').value||'').trim().toUpperCase();
    if (!name) return toast(Noun()+' name is required');
    const rt = this.readRate('fb', k);
    if (!rt) return;
    const dep = rt.deposit, d24 = rt.tiers.h24;
    /* Deposit of zero is a legitimate choice — plenty of shops take none — so
       it is not validated. A 24-hour price of zero is, because rateReady() would
       then refuse to let the bike out and we would be back at the screen this
       whole change exists to remove. */
    /* Same persistence path saveVehicle() and saveRate() use — Cloud.put when
       signed in, local push otherwise. Written by hand rather than reused
       because the rate card must land before the vehicle that points at it. */
    const rateRec = { model: name, deposit: rt.deposit, tiers: rt.tiers, ot: rt.ot, kind: k,
      ...(k==='car' ? { kmIncluded: rt.kmIncluded||0, kmExtra: rt.kmExtra||0 } : {}) };
    if (window.Cloud && Cloud.ready){
      const rid = Cloud.nid('rc');
      const vid = Cloud.nid('v');
      const vehRec = { name, regNo: reg, rateId: rid, model: name, kind: k,
        status:'available', cost:0, insExpiry:'', pucExpiry:'', odo:0 };
      /* BUG FIX: local state was left empty until the Firestore listener echoed
         back, so render() ran with zero bikes and painted the welcome screen
         again. The shop saved its first bike and watched the setup screen
         reappear, which reads exactly like the save failing.
         
         The listener replaces these arrays wholesale, so an optimistic copy
         cannot duplicate anything. */
      DB.d.rates.push(Object.assign({ id: rid }, rateRec));
      DB.d.vehicles.push(Object.assign({ id: vid }, vehRec));
      Cloud.put('rates', rid, rateRec).then(w => {
        if (!w.ok){
          DB.d.rates = DB.d.rates.filter(r => r.id !== rid);
          DB.d.vehicles = DB.d.vehicles.filter(v => v.id !== vid);
          DB.save(); R.render();
          return toast('Could not save \u2014 ' + Cloud.explainWrite(w.code));
        }
        return Cloud.put('vehicles', vid, vehRec).then(w2 => {
          if (!w2.ok) toast(Cloud.explainWrite(w2.code));
        });
      });
    } else {
      const rid = DB.id('rc');
      DB.d.rates.push(Object.assign({ id: rid }, rateRec));
      DB.d.vehicles.push({ id: DB.id('v'), name, regNo: reg, rateId: rid, model: name,
        kind: k, status:'available', cost:0, insExpiry:'', pucExpiry:'', odo:0 });
    }
    DB.save();
    Haptic.success();
    closeSheet();
    toast(name + ' added at ' + money(d24) + ' for 24 hr');
    this.render();
  },

  /* Reopens the sheet so the heading, placeholder and chips all follow, and
     keeps whatever the shop already typed. */
  setEditKind(k){
    if (this._addKind === k) return;
    const el = document.getElementById('v-name');
    const keep = el ? el.value : '';
    const reg  = (document.getElementById('v-reg')||{}).value || '';
    this._addKind = k;
    Haptic.tap();
    this.editVehicle();
    const n2 = document.getElementById('v-name'); if (n2 && keep) n2.value = keep;
    const r2 = document.getElementById('v-reg');  if (r2 && reg)  r2.value = reg;
  },

  rateSel(){
    const sel = document.getElementById('v-rate');
    const box = document.getElementById('v-newrate');
    if (!sel || !box) return;
    box.style.display = sel.value === '__new' ? 'block' : 'none';
    if (sel.value === '__new'){
      /* Prefill the model name from the bike name — for a first bike of a model
         they are the same thing, and retyping it is friction for no reason. */
      const nm = document.getElementById('v-name');
      const d24 = document.getElementById('vnr-h24');
      if (nm && d24 && !d24.value) d24.focus();
    }
  },

  saveVehicle(id){
    const name = document.getElementById('v-name').value.trim();
    const reg  = document.getElementById('v-reg').value.trim().toUpperCase();
    let rateId = document.getElementById('v-rate').value;
    if (!name) return toast(Noun()+' name is required');
    if (!rateId) return toast('Choose a rate card');

    /* Same expression saveVehicle() uses below for the vehicle record itself —
       computed once here because the "+ New rate" branch needs to know the
       kind BEFORE the vehicle record exists, to read and tag the right km
       fields on the rate card it is about to create. */
    const old0 = id ? DB.d.vehicles.find(x=>x.id===id) : null;
    const vKind = old0 ? (old0.kind || 'bike') : (this._addKind || (fleetKind()==='car' ? 'car' : 'bike'));

    /* "+ New rate" creates the card first, then falls through to the normal
       save with its id. Doing it here rather than in a second sheet keeps the
       name and number the shop already typed. */
    if (rateId === '__new'){
      const rt = this.readRate('vnr', vKind);
      if (!rt) return;
      const rateRec = { model: name, deposit: rt.deposit, tiers: rt.tiers, ot: rt.ot, kind: vKind,
        ...(vKind==='car' ? { kmIncluded: rt.kmIncluded||0, kmExtra: rt.kmExtra||0 } : {}) };
      if (window.Cloud && Cloud.ready){
        rateId = Cloud.nid('rc');
        /* BUG FIX: this used to fire the rate write and carry straight on to the
           vehicle write. If the rate write failed — offline, or an owner-only
           rules refusal for a manager — the bike saved anyway, pointing at a
           rate card that does not exist. The shop got a permanent "no rate
           card" bike and no explanation.
           
           Now the vehicle write is queued from inside the rate's callback, so a
           failed rate means no orphan. Local state is still updated
           immediately so the sheet can close without waiting. */
        this._pendingRate = { id: rateId, rec: rateRec };
        DB.d.rates.push(Object.assign({ id: rateId }, rateRec));
      } else {
        rateId = DB.id('rc');
        DB.d.rates.push(Object.assign({ id: rateId }, rateRec));
      }
    }
    /* Reg is optional now, so NAME is the identity. Only guard duplicates on
       whichever one the shop actually filled in. Persistent inline banner,
       not just a toast — see the note by #v-err above. */
    const showConflict = (msg) => {
      const el = document.getElementById('v-err');
      if (el) el.innerHTML = `<div class="card" style="background:var(--danger-tint);
        border-color:var(--danger);margin:-4px 0 12px">
        <b style="color:var(--danger);font-size:13px">${esc(msg)}</b></div>`;
      toast(msg);
    };
    if (reg && DB.d.vehicles.some(x=>x.regNo===reg && x.id!==id))
      return showConflict('That vehicle number already exists');
    if (!reg && DB.d.vehicles.some(x=>x.name===name && x.id!==id))
      return showConflict('A '+noun()+' with that name already exists — add a number or change the name');
    { const el = document.getElementById('v-err'); if (el) el.innerHTML = ''; }
    const rc = DB.d.rates.find(r=>r.id===rateId);
    const g = i => document.getElementById(i);
    const old = old0;
    const rec = {
      /* Recorded on every vehicle, not just the first — without it a mixed
         shop's second car saves as a bike.
         
         An EDIT keeps whatever the vehicle already was. Deriving it here would
         mean opening a car to fix its number plate and saving it back as a
         bike, which is data loss with no error message. Same value as vKind
         above — computed once, reused, so the rate card and the vehicle it
         belongs to can never disagree about what kind of thing this is. */
      kind: vKind,
      name, regNo: reg, rateId, model: rc?rc.model:'',
      status: g('v-status') ? g('v-status').value : (old?old.status:'available'),
      cost: g('v-cost') ? (Number(g('v-cost').value)||0) : (old?old.cost:0),
      insExpiry: g('v-ins') ? g('v-ins').value : (old?old.insExpiry:''),
      pucExpiry: g('v-puc') ? g('v-puc').value : (old?old.pucExpiry:''),
      odo: old ? (old.odo||0) : 0,
      /* Car-only fields. Read from the form when it rendered them (a car), and
         otherwise carried straight through from the existing record — so
         editing a car while the More-details panel is collapsed cannot wipe
         its fitness date, and a bike never gains fields it has no use for. */
      ...(vKind==='car' ? {
        commercial: !!(g('v-comm-t') && g('v-comm-t').classList.contains('on')),
        fitnessExpiry: g('v-fit') ? g('v-fit').value : (old?(old.fitnessExpiry||''):''),
        permitExpiry:  g('v-permit') ? g('v-permit').value : (old?(old.permitExpiry||''):''),
        transmission:  g('v-trans') ? (this.pmGet('v-trans')==='automatic' ? 'automatic' : 'manual')
                                    : (old?(old.transmission||'manual'):'manual'),
        seats:         g('v-seats') ? (Number(g('v-seats').value)||0) : (old?(old.seats||0):0),
        fuelType:      g('v-fuel') ? g('v-fuel').value : (old?(old.fuelType||''):''),
      } : {}),
    };
    if (window.Cloud && Cloud.ready){
      const vid = id || Cloud.nid('v');
      const pend = this._pendingRate; this._pendingRate = null;
      /* If a rate card was created in this same save, it has to land first —
         otherwise a failed rate leaves a bike pointing at nothing. */
      const writeVeh = () => Cloud.put('vehicles', vid, rec).then(w => {
        if (!w.ok) toast(Cloud.explainWrite(w.code));
      });
      if (pend){
        Cloud.put('rates', pend.id, pend.rec).then(w => {
          if (!w.ok){
            /* Roll the optimistic copy back so the UI does not show a rate the
               server rejected, and do NOT create the bike. */
            DB.d.rates = DB.d.rates.filter(r => r.id !== pend.id);
            DB.save(); R.render();
            return toast('Could not save the rate \u2014 ' + Cloud.explainWrite(w.code));
          }
          return writeVeh();
        });
      } else { writeVeh(); }
    } else if (id){ Object.assign(DB.d.vehicles.find(x=>x.id===id), rec); }
    else { DB.d.vehicles.push(Object.assign({ id: DB.id('v') }, rec)); }
    DB.save(); closeSheet(); this.render();
    toast(Noun() + (id ? ' updated' : ' added'));
  },

  /* ── clean up the old seeder's leftovers ─────────────────────────
     Removing seed() from createShop() stops NEW shops getting ten phantom
     bikes; it does nothing for shops that already have them sitting in
     Firestore. This finds them and takes them out.

     Deliberately conservative about what counts as a leftover: the rate card
     must be unpriced, and the bike must never have been rented. A bike with
     any rental history is somebody's real record and is left alone whatever
     its price says. Everything is soft-deleted — the rules forbid a hard
     delete, and history should survive anyway. */
  starterJunk(){
    const rates = DB.d.rates||[];
    return (DB.d.vehicles||[]).filter(v => {
      if (v.deletedAt) return false;
      /* "Never been rented" has to mean lifetime, not "not open right now."
         DB.d.rentals is the open-only listener — a bike with 50 closed
         rentals but nothing open at this moment used to read as never
         rented here, so the bulk-cleanup button below could delete a
         vehicle with real earnings history, exactly what this guard exists
         to prevent. /vehicleStats carries the lifetime trip count that
         listener can't. */
      const stat = (DB.d.vehicleStats||[]).find(s => s.id === v.id);
      if (stat && (Number(stat.closedTrips)||0) > 0) return false;
      if ((DB.d.rentals||[]).some(r => r.vehicleId === v.id)) return false;
      const rc = rates.find(r => r.id === v.rateId);
      return rc && !this.rateReady(rc);
    });
  },
  clearStarters(){
    if (!this.isOwner()) return toast('Only the owner can do this');
    const junk = this.starterJunk();
    if (!junk.length) return toast('Nothing to remove');
    if (!confirm('Remove ' + junk.length + ' unpriced ' + noun(junk.length!==1) +
      ' that have never been rented?\n\nRate cards for them go too. Nothing with rental ' +
      'history is touched.')) return;
    const rids = new Set();
    junk.forEach(v => {
      if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', v.id);
      if (v.rateId) rids.add(v.rateId);
    });
    /* A rate card only goes if no surviving bike still points at it. */
    const keep = new Set((DB.d.vehicles||[])
      .filter(v => !junk.some(j => j.id === v.id))
      .map(v => v.rateId));
    rids.forEach(rid => {
      if (keep.has(rid)) return;
      if (window.Cloud && Cloud.ready) Cloud.softDelete('rates', rid);
      DB.d.rates = (DB.d.rates||[]).filter(r => r.id !== rid);
    });
    const ids = new Set(junk.map(v => v.id));
    DB.d.vehicles = (DB.d.vehicles||[]).filter(v => !ids.has(v.id));
    DB.save(); this.render();
    toast('Removed ' + junk.length + ' unpriced ' + noun(junk.length!==1));
  },

  delVehicle(id){
    if (DB.d.rentals.some(r=>r.vehicleId===id && r.status==='open'))
      return toast('This vehicle is out — check it in first');
    if (!confirm('Remove this ' + noun() + '? Past rentals stay in your records.')) return;
    /* soft delete only — nothing is ever destroyed */
    if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', id);
    DB.d.vehicles = DB.d.vehicles.filter(x=>x.id!==id);
    DB.save(); closeSheet(); this.render(); toast(Noun()+' removed');
  },

  /* ── RATE CARDS ─────────────────────────────────────────────────── */
  renderRates(){
    const box = document.getElementById('rates-list');
    /* The header is built either way; only the list below it differs. */
    const hdr =
      /* The centre button used to be the only way to create a rate card. Now
         that it always means Rent out, Rates carries its own — otherwise the
         screen becomes read-only for anyone who has not memorised the old
         behaviour. */
      (this.isOwner() ? `<button class="btn" style="margin-bottom:9px" onclick="R.editRate()">
          + New rate card</button>
        <button class="btn ghost" style="margin-bottom:12px" onclick="R.scanRates()">
          📷 Read my price list from a photo</button>` : '') +
      `<div class="muted" style="margin:0 2px 12px">Tap a card to edit. Rates are copied onto each
        rental at check-out, so changing a price never re-prices a ${noun()} that is already out.</div>` +
      '';
    if (this.isWide()) return this.ratesTable(hdr);
    box.innerHTML = hdr +
      DB.d.rates.map(r=>{
        const n = DB.d.vehicles.filter(v=>v.rateId===r.id).length;
        return `<div class="card tap" onclick="R.editRate('${r.id}')">
          <div class="row" style="margin-bottom:8px">
            <b class="grow" style="font-size:15.5px">${esc(r.model)}</b>
            ${this.rateReady(r) ? `<span class="pill ok">${n} ${noun(n!==1)}</span>`
                                : `<span class="pill late">SET PRICE</span>`}
          </div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            ${TIERS.map(t=>`<span class="pill" style="background:var(--p-50);color:var(--t2)">
              ${t.label} ${money(r.tiers[t.k])}</span>`).join('')}
          </div>
          <div class="muted" style="margin-top:8px">
            Deposit ${money(r.deposit)} · overtime ${money(r.ot)}/hr${
            r.weekend ? ' · <b>weekend rates set</b>' : ''}
          </div>
          <button class="btn ghost sm" style="margin-top:10px;width:100%"
            onclick="event.stopPropagation();R.editVehicle(null,'${r.id}')">
            + Add another ${esc(r.model)}</button>
        </div>`;
      }).join('');
  },

  /* ── read a rate card from a photo ────────────────────────────────
     The shop hands over a printed price list; typing 10 models x 7 numbers
     is the single most tedious part of onboarding and the easiest place to
     fat-finger a price. Photograph it instead — then CONFIRM every figure,
     because a misread 620 as 820 costs money on every rental until someone
     notices. Nothing is saved from this screen without a second tap. */
  /* ── RATES, desktop ──────────────────────────────────────────────────
     One editable grid instead of one sheet per model. Owners set prices
     relatively — "Aviator should be ₹50 more than Activa" — and the sheet
     made that comparison impossible: you had to open two, and remember the
     first. Desktop has the width for the whole price list at once.

     Edits are staged in _rdraft and written on Save rather than per
     keystroke: a price list is edited in sweeps, and a write per keystroke
     would be both expensive and impossible to undo. */
  rateEdit(id, field, val){
    this._rdraft = this._rdraft || {};
    const rc = (DB.d.rates||[]).find(r=>r.id===id); if (!rc) return;
    const cur = field==='dep' ? (Number(rc.deposit)||0)
              : field==='ot'  ? (Number(rc.ot)||0)
              : Number((rc.tiers||{})[field])||0;
    const n = val === '' ? 0 : (Number(String(val).replace(/[^0-9.]/g,''))||0);
    this._rdraft[id] = this._rdraft[id] || {};
    if (n === cur) delete this._rdraft[id][field];
    else this._rdraft[id][field] = n;
    if (!Object.keys(this._rdraft[id]).length) delete this._rdraft[id];
    this.ratesSaveBar();
  },
  rateDraftCount(){
    return Object.values(this._rdraft||{}).reduce((a,o)=>a+Object.keys(o).length,0);
  },
  /* Only the bar is re-rendered while typing. A full render() would replace
     the input under the cursor and lose the caret on every keystroke. */
  ratesSaveBar(){
    const el = document.getElementById('rt-savebar'); if (!el) return;
    const n = this.rateDraftCount();
    if (!n){ el.style.display='none'; return; }
    const names = Object.keys(this._rdraft).map(id=>{
      const rc=(DB.d.rates||[]).find(r=>r.id===id); return rc?rc.model:''; }).filter(Boolean);
    el.style.display='';
    el.innerHTML = `<b>${n} price${n===1?'':'s'} changed</b>
      <span class="rt-sb-s">${esc(names.slice(0,4).join(', '))}${names.length>4?' +'+(names.length-4)+' more':''}</span>
      <span class="grow"></span>
      <button class="rt-bs g" onclick="R.rateDiscard()">Discard</button>
      <button class="rt-bs y" onclick="R.rateSaveAll()">Save changes</button>`;
  },
  rateDiscard(){ this._rdraft = null; this.render(); },
  rateSaveAll(){
    const d = this._rdraft || {};
    const ids = Object.keys(d);
    if (!ids.length) return;
    ids.forEach(id => {
      const rc = (DB.d.rates||[]).find(r=>r.id===id); if (!rc) return;
      const patch = {};
      const tiers = Object.assign({}, rc.tiers||{});
      let touchedTiers = false;
      Object.keys(d[id]).forEach(f => {
        if (f==='dep') patch.deposit = d[id][f];
        else if (f==='ot') patch.ot = d[id][f];
        else { tiers[f] = d[id][f]; touchedTiers = true; }
      });
      if (touchedTiers) patch.tiers = tiers;
      /* Same write path saveRate() uses, so a grid edit and a sheet edit
         are indistinguishable to Firestore and to the offline queue. */
      if (window.Cloud && Cloud.ready){
        Cloud.put('rates', id, patch).then(w => { if (!w.ok) toast(Cloud.explainWrite(w.code)); });
      }
      Object.assign(rc, patch);
    });
    DB.save();
    this._rdraft = null;
    Haptic.success();
    toast(ids.length + ' rate card' + (ids.length===1?'':'s') + ' updated');
    this.render();
  },
  ratesFilter(k){ this._rtf = k; this.render(); },

  ratesTable(hdr){
    const box = document.getElementById('rates-list');
    const all = (DB.d.rates||[]).slice();
    const bikesOf = rc => (DB.d.vehicles||[]).filter(v=>v.rateId===rc.id && !v.deletedAt).length;
    const blocked = all.filter(rc => !this.rateReady(rc));
    const withWk = all.filter(rc => rc.weekend);

    const filt = this._rtf || 'all';
    const list = filt==='bad' ? blocked : (filt==='wk' ? withWk : all);

    /* Earned per model over 30 days, from the closed cache Money loads.
       Pricing without knowing what a model actually earns is guesswork,
       and this is the only screen where that number changes a decision. */
    if (!this._closed && window.Cloud && Cloud.ready){
      this._closed = [];
      Cloud.recentClosed(400).then(rows => { this._closed = rows; this.render(); });
    }
    const since = Date.now() - 30*24*HOUR;
    const earnedOf = rc => {
      const ids = new Set((DB.d.vehicles||[]).filter(v=>v.rateId===rc.id).map(v=>v.id));
      return (this._closed||[]).filter(x => ids.has(x.vehicleId) && !x.voidedAt
          && x.status!=='cancelled' && (x.outAt||0) >= since)
        .reduce((a,x)=>a+(Number(x.revenue)||0),0);
    };

    const d = this._rdraft || {};
    const val = (rc, f) => {
      if (d[rc.id] && d[rc.id][f] != null) return d[rc.id][f];
      return f==='dep' ? (Number(rc.deposit)||0)
           : f==='ot'  ? (Number(rc.ot)||0)
           : Number((rc.tiers||{})[f])||0;
    };
    /* A blank tier and a zero tier mean different things — one is "not
       offered", the other blocks the bike — and the old table showed both
       as a dash. Zero on a REQUIRED field (24hr, overtime) is red; zero on
       an optional tier just means the shop does not sell that length. */
    const cell = (rc, f, req) => {
      const v = val(rc, f);
      const dirty = d[rc.id] && d[rc.id][f] != null;
      const cls = (req && !v) ? 'zero' : (!v ? 'dim' : '');
      return `<td class="${f==='dep'||f==='h3'||f==='ot'?'grp':''}">
        <input class="rt-pc ${cls}${dirty?' dirty':''}" value="${v?v:''}"
          placeholder="${req?'0':'\u2014'}" inputmode="numeric"
          oninput="R.rateEdit('${rc.id}','${f}',this.value)"></td>`;
    };

    const chip = (k,label,n)=>`<button class="dfl-chip${filt===k?' on':''}"
      onclick="R.ratesFilter('${k}')">${label} ${n}</button>`;

    const warn = !blocked.length ? '' : `<div class="dout-alert rt-warn">
      <div class="dout-alert-i">\u26A0\uFE0F</div>
      <div><b>${blocked.length} model${blocked.length===1?'':'s'} still ${
        blocked.length===1?'has':'have'} no price</b>
        <div class="s">A ${noun()} cannot go out until its 24-hour rate and overtime are set.
          ${esc(blocked.slice(0,3).map(r=>r.model).join(', '))}${
          blocked.length>3?' and '+(blocked.length-3)+' more':''} ${
          blocked.length===1?'is':'are'} blocked at the counter right now.</div></div>
    </div>`;

    const d24 = all.map(rc=>val(rc,'h24')).filter(Boolean);
    const totalBikes = all.reduce((a,rc)=>a+bikesOf(rc),0);

    box.innerHTML = hdr + warn + `
      <div class="dfl-tools">
        ${chip('all','All',all.length)}${chip('bad','Needs price',blocked.length)}
        ${chip('wk','Weekend set',withWk.length)}
        <span class="grow"></span>
        <button class="dfl-chip" onclick="R.ratesBulkAll()">\u2195 Change all prices</button>
      </div>
      <div class="card">
        <div class="dmn-h"><span class="dmn-t">Price list</span><span class="grow"></span>
          <span class="dmn-sub">Click any price to edit \u00b7 Tab moves across</span></div>
        <div style="overflow-x:auto">
        <table class="rt-tbl">
          <thead><tr>
            <th class="mdl">Model</th>
            <th class="grp">Deposit</th>
            ${TIERS.map((t,i)=>`<th class="${i===0?'grp':''}">${esc(t.label)}</th>`).join('')}
            <th class="grp">Overtime<br><span class="rt-th-s">per hr</span></th>
            <th class="grp we">Weekend</th>
            <th class="grp">${Noun(1)}</th>
            <th>Earned 30d</th>
          </tr></thead>
          <tbody>${!list.length
            ? `<tr><td colspan="${TIERS.length+6}" class="muted" style="padding:22px;text-align:center">
                No rate cards here.</td></tr>`
            : list.map(rc=>{
            const nb = bikesOf(rc);
            const et = earnedOf(rc);
            const ok = this.rateReady(rc);
            return `<tr>
              <td class="mdl" onclick="R.editRate('${rc.id}')">
                <div class="rt-nm">${esc(rc.model)}</div>
                <div class="rt-meta"><span class="pill ${ok?'ok':'late'}">${ok?'Live':'Blocked'}</span>
                  ${rc.kind==='car'?'<span class="rt-dot"></span>car':''}</div></td>
              ${cell(rc,'dep',false)}
              ${TIERS.map(t=>cell(rc,t.k,t.k==='h24')).join('')}
              ${cell(rc,'ot',true)}
              <td class="grp we">${rc.weekend
                ? `<button class="rt-tog on" onclick="R.editRate('${rc.id}')">Set \u203A</button>`
                : `<button class="rt-tog" onclick="R.editRate('${rc.id}')">Off</button>`}</td>
              <td class="grp"><span class="rt-bk${nb?'':' none'}">${nb}</span></td>
              <td><span class="rt-earn${et?'':' nil'}">${et?money(et):'\u2014'}</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="rt-hint">
          <span>Blank means this length is not offered and will not appear at the counter.</span>
          <span class="rt-hint-r">Red means \u20B90 on a required price \u2014 the ${noun()} is blocked.</span>
        </div>
        <div class="dfl-foot"><span>${all.length} rate card${all.length===1?'':'s'} \u00b7 ${
          totalBikes} ${noun(totalBikes!==1)} priced</span>
          <span>${d24.length?`Cheapest 24 hr <b>${money(Math.min(...d24))}</b> \u00b7 dearest <b>${money(Math.max(...d24))}</b>`:''}</span></div>
      </div>
      <div class="rt-savebar" id="rt-savebar" style="display:none"></div>`;
    this.ratesSaveBar();
  },

  /* ── seasonal pricing ─────────────────────────────────────────────
     The bulk action that earns its place. Two rules it must never break:
     a blank tier stays blank, and nothing commits without a preview naming
     every number that changes. */
  bulkPrice(){
    const ids = this.selIds(); if (!ids.length) return;
    this._bpMode = 'pct'; this._bpVal = 10; this._bpDep = false;
    this.bulkPriceSheet();
  },
  /* The desktop grid replaced the checkbox column that used to feed
     bulkPrice(), which would have stranded a whole working feature —
     percentage/fixed changes across cards, with a preview. This selects
     every card currently in view and opens the same sheet. */
  ratesBulkAll(){
    const filt = this._rtf || 'all';
    const all = (DB.d.rates||[]);
    const list = filt==='bad' ? all.filter(rc=>!this.rateReady(rc))
               : filt==='wk' ? all.filter(rc=>rc.weekend) : all;
    if (!list.length) return toast('No rate cards to change');
    this._sel = new Set(list.map(r=>r.id));
    this._bpMode = 'pct'; this._bpVal = 10; this._bpDep = false;
    this.bulkPriceSheet();
  },
  bulkPriceSet(mode){ this._bpMode = mode; this.bulkPriceSheet(); },
  bulkPriceInput(){
    const el = document.getElementById('bp-val');
    this._bpVal = Number(el && el.value) || 0;
    const d = document.getElementById('bp-dep');
    this._bpDep = !!(d && d.checked);
    this.bulkPricePreview();
  },
  /* Zero means "we do not sell this package", so it is skipped rather than
     becoming 0 + 10%, or worse, 0 + ₹50 — which would silently create tiers
     the shop never meant to offer, across every card at once. */
  _bpApply(v){
    v = Number(v)||0;
    if (!v) return 0;
    const n = Number(this._bpVal)||0;
    if (this._bpMode === 'pct') return Math.max(0, Math.round(v * (1 + n/100)));
    if (this._bpMode === 'flat') return Math.max(0, Math.round(v + n));
    return Math.max(0, Math.round(n));
  },
  bulkPricePreview(){
    const box = document.getElementById('bp-prev'); if (!box) return;
    const ids = this.selIds();
    let changed = 0, skipped = 0;
    const rows = ids.map(id=>{
      const r = (DB.d.rates||[]).find(x=>x.id===id); if (!r) return '';
      const cells = TIERS.map(t=>{
        const was = Number((r.tiers||{})[t.k])||0;
        if (!was){ skipped++; return `<td class="num"><span class="skip">not set</span></td>`; }
        const now = this._bpApply(was);
        if (now!==was) changed++;
        return `<td class="num"><span class="was">${was}</span><span class="now">${now}</span></td>`;
      }).join('');
      const dw = Number(r.deposit)||0;
      const dn = this._bpDep ? this._bpApply(dw) : dw;
      if (this._bpDep && dn!==dw) changed++;
      return `<tr><td class="nm">${esc(r.model)}</td>${cells}
        <td class="num">${this._bpDep && dn!==dw
          ? `<span class="was">${dw}</span><span class="now">${dn}</span>`
          : `<span class="muted">${dw||'—'} · unchanged</span>`}</td></tr>`;
    }).join('');
    box.innerHTML = `<table class="prev">
      <thead><tr><th>Rate card</th>${TIERS.map(t=>`<th class="num">${t.label}</th>`).join('')}
        <th class="num">Deposit</th></tr></thead><tbody>${rows}</tbody></table>`;
    const s = document.getElementById('bp-sum');
    if (s) s.textContent = changed + ' price' + (changed===1?'':'s') + ' change · ' +
      skipped + ' blank tier' + (skipped===1?'':'s') + ' skipped' +
      (this._bpDep ? '' : ' · deposits untouched');
  },
  bulkPriceSheet(){
    const ids = this.selIds();
    const seg = (k,label,sub) => `<div class="tier ${this._bpMode===k?'on':''}"
      onclick="R.bulkPriceSet('${k}')"><div class="t">${label}</div><div class="p">${sub}</div></div>`;
    openSheet(`
      <div class="sheet-hd"><h2>Change ${ids.length} rate card${ids.length===1?'':'s'}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Cancel</button></div>
      <div class="tiers" style="margin-bottom:10px">
        ${seg('pct','Percent','+ / − %')}
        ${seg('flat','Flat \u20B9','+ / − \u20B9')}
        ${seg('set','Set to','\u20B9')}
      </div>
      <div class="fld"><label class="lbl">${
        this._bpMode==='pct' ? 'Change by (%)'
        : this._bpMode==='flat' ? 'Add or subtract (\u20B9)' : 'Set every priced tier to (\u20B9)'}</label>
        <input class="in" id="bp-val" type="number" inputmode="numeric"
          value="${this._bpVal}" oninput="R.bulkPriceInput()"></div>
      <div class="card" style="background:var(--y-tint);border-color:var(--y-bd)">
        <b style="font-size:12.5px">Blank tiers stay blank</b>
        <div class="muted" style="margin-top:2px">A rate left at zero is one you do not sell, so
        it is skipped rather than becoming a package you never offered.</div>
        <label class="row" style="margin-top:9px;gap:8px;cursor:pointer">
          <input type="checkbox" id="bp-dep" ${this._bpDep?'checked':''}
            onchange="R.bulkPriceInput()" style="width:18px;height:18px">
          <span style="font-size:12.5px;font-weight:700">Change deposits too</span></label>
      </div>
      <div class="card" style="padding:8px 10px;overflow-x:auto" id="bp-prev"></div>
      <div class="muted" id="bp-sum" style="margin:2px 2px 10px"></div>
      <button class="btn" onclick="R.bulkPriceCommit()">Apply to ${ids.length} rate card${
        ids.length===1?'':'s'}</button>
      <div class="muted" style="text-align:center;margin-top:8px">Bikes already out keep the price
        they were rented at.</div>`);
    this.bulkPricePreview();
  },
  bulkPriceCommit(){
    const ids = this.selIds(); if (!ids.length) return;
    let n = 0;
    ids.forEach(id=>{
      const r = (DB.d.rates||[]).find(x=>x.id===id); if (!r) return;
      const before = { deposit: r.deposit, tiers: Object.assign({}, r.tiers) };
      const tiers = Object.assign({}, r.tiers||{});
      TIERS.forEach(t=>{ tiers[t.k] = this._bpApply(tiers[t.k]); });
      const dep = this._bpDep ? this._bpApply(r.deposit) : (Number(r.deposit)||0);
      r.tiers = tiers; r.deposit = dep; n++;
      if (window.Cloud && Cloud.ready){
        Cloud.put('rates', id, { tiers, deposit: dep });
        Cloud.audit('rate.bulk', id, before, { deposit: dep, tiers });
      }
    });
    DB.save(); this._sel = null; closeSheet(); this.render();
    Haptic.success();
    toast(n + ' rate card' + (n===1?'':'s') + ' updated');
  },

  scanRates(){
    if (!this.isOwner()) return toast('Only the owner can set prices');
    if (!window.Cloud || !Cloud.ready) return toast('Sign in first');
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.style.display='none';
    inp.onchange = async () => {
      const file = inp.files && inp.files[0];
      try { document.body.removeChild(inp); } catch(e){}
      if (!file) return;
      openSheet(`<div class="sheet-hd"><h2>Reading price list…</h2></div>
        <div class="empty"><div class="e">📄</div><b>Working on it</b>
        <span>Usually 5–15 seconds.</span></div>`);
      try {
        const b64 = await this._shrink(file);
        const res = await Cloud.readRateCard(b64, 'image/jpeg');
        if (!res || !res.ok || !res.rows || !res.rows.length){
          Haptic.error();
          return openSheet(`<div class="sheet-hd"><h2>Could not read it</h2>
            <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
            <div class="card"><div class="muted">
            Try again with the sheet flat, filling the frame, in good light.
            ${res && res.msg ? '<br><br>' + esc(res.msg) : ''}</div></div>
            <button class="btn" onclick="R.scanRates()">Take another photo</button>`);
        }
        Haptic.success();
        this._scan = res.rows;
        this.scanReview();
      } catch(e){
        console.error(e); Haptic.error();
        openSheet(`<div class="sheet-hd"><h2>Could not read it</h2>
          <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
          <div class="card"><div class="muted">${esc(e.message||'Please try again')}</div></div>`);
      }
    };
    document.body.appendChild(inp); inp.click();
  },

  /* Phone photos are 3–8 MB; the callable has a hard request limit and a
     big upload on shop wifi is its own failure mode. 1600px wide is more
     than enough for a printed table. */
  _shrink(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const max = 1600;
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
        } catch(e){ reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not open that image')); };
      img.src = url;
    });
  },

  _scanSet(i, k, v){
    if (!this._scan || !this._scan[i]) return;
    this._scan[i][k] = (k === 'model') ? v : (Number(v)||0);

  async scanApply(){
    const rows = (this._scan||[]).filter(r => String(r.model||'').trim());
    if (!rows.length) return toast('Nothing to save');
    let made = 0, failed = null;
    for (const r of rows){
      const existing = (DB.d.rates||[]).find(x =>
        String(x.model||'').toLowerCase().trim() === String(r.model).toLowerCase().trim());
      const rec = { model: String(r.model).trim(), deposit: Number(r.deposit)||0,
                    ot: Number(r.ot)||0,
                    tiers: { h3:Number(r.h3)||0, h6:Number(r.h6)||0, h12:Number(r.h12)||0,
                             h24:Number(r.h24)||0, d7:Number(r.d7)||0 } };
      const rid = existing ? existing.id
                           : ('rc_' + rec.model.toLowerCase().replace(/[^a-z0-9]+/g,'_'));
      const w = await Cloud.put('rates', rid, rec);
      if (!w.ok){ failed = w; break; }
      /* a model with no bike cannot be rented, so make one alongside */
      if (!(DB.d.vehicles||[]).some(v => v.rateId === rid)){
        const wv = await Cloud.put('vehicles', 'v_'+rid, {
          name: rec.model, regNo:'', rateId: rid, model: rec.model,
          /* Photographing a car price list was creating bikes. A scan cannot
             know the kind on its own, so it follows what the shop said it
             rents; a mixed yard defaults to bike and can change it per
             vehicle afterwards. */
          kind: rentKind()==='car' ? 'car' : 'bike',
          status:'available', cost:0, insExpiry:'', pucExpiry:'', odo:0 });
        if (!wv.ok){ failed = wv; break; }
      }
      made++;
    }
    if (failed){
      Haptic.error();
      return toast((made ? 'Saved ' + made + ', then stopped: ' : '') + Cloud.explainWrite(failed.code));
    }
    Haptic.success(); closeSheet(); this.nav('rates');
    toast('Saved ' + made + ' rate card' + (made===1?'':'s'));
  },

  editRate(id){
    if (!this.isOwner()) return toast('Only the owner can change prices');
    const r = id ? DB.d.rates.find(x=>x.id===id) : null;
    /* An existing rate card keeps whatever it was tagged — the same rule
       vehicles follow.

       rate.kind is new in this build. Every rate card created before it —
       including a real car's — has no kind field at all, only the vehicles
       pointing at it do (vehicle.kind has existed since Phase 1). Defaulting
       an unset rate card straight to 'bike' would hide the km section on a
       shop's EXISTING car rate card forever, on the very release meant to
       let them use it. So an unset kind is inferred from any vehicle already
       pointing at this rate card before falling back to 'bike'. */
    const ek = r ? (r.kind || (DB.d.vehicles.some(v=>v.rateId===r.id && v.kind==='car') ? 'car' : 'bike'))
                 : (this._addRateKind || (rentKind()==='car' ? 'car' : 'bike'));
    this._addRateKind = ek;
    openSheet(`
      <div class="sheet-hd"><h2>${r?'Edit rate card':'New '+noun()+' rate card'}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      ${(!r && rentKind()==='both') ? `
        <!-- A shop that rents both must say which, for a NEW card only — same
             rule as the vehicle picker: asked once, not on every screen, and
             never for something that already has an answer. -->
        <div class="kindrow">
          <div class="kbtn ${ek==='bike'?'on':''}" onclick="R.setRateKind('bike')">
            <span class="e">\u{1F6F5}</span><b>Bike</b></div>
          <div class="kbtn ${ek==='car'?'on car':''}" onclick="R.setRateKind('car')">
            <span class="e">\u{1F697}</span><b>Car</b></div>
        </div>` : ''}
      <div class="fld"><label class="lbl">${Noun(0,ek)} model <span class="req">*</span></label>
        <input class="in" id="r-model" value="${esc(r?r.model:'')}"
          placeholder="${ek==='car'?'Swift':'Activa 3G'}"></div>
      <div class="two">
        <div class="fld"><label class="lbl">Deposit <span class="req">*</span></label>
          <input class="in" id="r-dep" type="number" inputmode="numeric" value="${r?r.deposit:''}" placeholder="₹"></div>
        <div class="fld"><label class="lbl">Overtime / hr <span class="req">*</span></label>
          <input class="in" id="r-ot" type="number" inputmode="numeric" value="${r?r.ot:''}" placeholder="₹"></div>
      </div>
      <div class="sec-hd" style="margin-top:6px">Duration prices</div>
      ${TIERS.map(t=>`<div class="fld"><label class="lbl">${t.label}</label>
        <input class="in" id="r-${t.k}" type="number" inputmode="numeric"
          value="${r?r.tiers[t.k]:''}" placeholder="₹"></div>`).join('')}

      <!-- Cars only, and optional even there — same reasoning as rateFields():
           a scooter's wear tracks time, not distance, and metering one would
           tax every bike shop to serve the minority that needs it. Blank
           means unlimited, the same rule the hourly tiers already use. -->
      ${ek==='car' ? `
      <div class="sec-hd" style="margin-top:6px">Kilometres — optional</div>
      <div class="fld"><label class="lbl">Included per day</label>
        <input class="in" id="r-kmi" type="number" inputmode="numeric"
          value="${r&&r.kmIncluded?r.kmIncluded:''}" placeholder="km"></div>
      <div class="fld"><label class="lbl">After that, per km</label>
        <input class="in" id="r-kme" type="number" inputmode="numeric"
          value="${r&&r.kmExtra?r.kmExtra:''}" placeholder="₹"></div>` : ''}

      <button type="button" class="btn ghost" style="margin:4px 0 12px"
        onclick="R.more('r-wk',this)">Weekend prices <span class="muted">— optional</span></button>
      <div id="r-wk" style="display:none">
        <div class="muted" style="margin:0 2px 12px">Leave blank to charge the same all week.
        Used when the ${noun()} goes out on Saturday or Sunday, and frozen for that rental.</div>
        <div class="two">
          <div class="fld"><label class="lbl">Deposit</label>
            <input class="in" id="rw-dep" type="number" inputmode="numeric"
              value="${r&&r.weekend?(r.weekend.deposit||''):''}"></div>
          <div class="fld"><label class="lbl">Overtime /hr</label>
            <input class="in" id="rw-ot" type="number" inputmode="numeric"
              value="${r&&r.weekend?(r.weekend.ot||''):''}"></div>
        </div>
        ${TIERS.map(t=>`<div class="fld"><label class="lbl">${t.label} · weekend</label>
          <input class="in" id="rw-${t.k}" type="number" inputmode="numeric"
            value="${r&&r.weekend&&r.weekend.tiers?(r.weekend.tiers[t.k]||''):''}" placeholder="₹"></div>`).join('')}
      </div>
      <button class="btn" onclick="R.saveRate('${id||''}')">${r?'Save changes':'Add '+noun()+' rate card'}</button>
    `);
  },

  /* Reopens the sheet so the heading, placeholder and km section all follow,
     and keeps whatever the shop already typed — same pattern as
     setEditKind()/setAddKind() on the vehicle form. */
  setRateKind(k){
    if (this._addRateKind === k) return;
    const g = i => document.getElementById(i);
    const keep = { model:(g('r-model')||{}).value, dep:(g('r-dep')||{}).value, ot:(g('r-ot')||{}).value,
      h3:(g('r-h3')||{}).value, h6:(g('r-h6')||{}).value, h12:(g('r-h12')||{}).value,
      h24:(g('r-h24')||{}).value, d7:(g('r-d7')||{}).value };
    this._addRateKind = k;
    Haptic.tap();
    this.editRate();
    Object.keys(keep).forEach(id=>{ const el=document.getElementById('r-'+id);
      if (el && keep[id]) el.value = keep[id]; });
  },

  saveRate(id){
    const model = document.getElementById('r-model').value.trim();
    if (!model) return toast(Noun()+' model is required');
    const tiers = {};
    for (const t of TIERS) tiers[t.k] = Number(document.getElementById('r-'+t.k).value)||0;
    const g = i => Number((document.getElementById(i)||{value:0}).value)||0;
    const wt = {}; TIERS.forEach(t=>{ wt[t.k] = g('rw-'+t.k); });
    const anyWk = Object.keys(wt).some(k=>wt[k]>0);
    /* An existing card keeps its own kind; a new one is whatever the picker
       (or the shop's single answer) said — same expression editRate() uses
       to decide which fields to show, so the two can never disagree. */
    const old = id ? DB.d.rates.find(x=>x.id===id) : null;
    /* Same inference as editRate() above, and it must be — saveRate() is
       what WRITES kind onto the record. If this resolved differently to a
       'car' rate card than the sheet that rendered its edit form did, saving
       would permanently stamp kind:'bike' onto a car, having shown the km
       fields the whole time the shop was editing it. */
    const ek = old ? (old.kind || (DB.d.vehicles.some(v=>v.rateId===old.id && v.kind==='car') ? 'car' : 'bike'))
                   : (this._addRateKind || (rentKind()==='car' ? 'car' : 'bike'));
    const rec = {
      model, deposit: Number(document.getElementById('r-dep').value)||0,
      ot: Number(document.getElementById('r-ot').value)||0, tiers, kind: ek,
      ...(ek==='car' ? { kmIncluded: g('r-kmi'), kmExtra: g('r-kme') } : {}),
      weekend: anyWk ? { deposit: g('rw-dep'), ot: g('rw-ot'), tiers: wt } : null
    };
    if (window.Cloud && Cloud.ready){
      Cloud.put('rates', id || Cloud.nid('rc'), rec).then(w => {
        if (!w.ok) toast(Cloud.explainWrite(w.code));
      });
      if (id) DB.d.vehicles.forEach(v=>{ if (v.rateId===id) Cloud.put('vehicles', v.id, { model }); });
    } else if (id){
      Object.assign(DB.d.rates.find(x=>x.id===id), rec);
      DB.d.vehicles.forEach(v=>{ if (v.rateId===id) v.model = model; });
    } else DB.d.rates.push(Object.assign({ id: DB.id('rc') }, rec));
    DB.save(); closeSheet(); this.render(); toast(Noun()+' rate card saved');
  },

  checkoutStart(){

          <div class="fld"><label class="lbl">Fuel out</label>
            <select class="in" id="c-fuel">
              <option value="E">Empty</option><option value="1/4">1/4</option>
