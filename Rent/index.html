  /* Every bike row is a question — "why did this one earn that?" — so it
     opens its own rentals rather than being a dead statistic. */
  vehicleBills(vid){
    const v = DB.d.vehicles.find(x=>x.id===vid);
    const rng = this._range();
    /* Filtered by outAt, matching the card totals on the Money page and the
       "revenue belongs to check-out day" rule (see the note in checkinSave).
       This used to filter by settledAt instead, so a rental checked out on
       one day and settled the next counted here but not in the card above
       it — the total in this sheet and the number on the card it was
       opened from could silently disagree. */
    const rows = (this._closed||[]).filter(x => x.vehicleId===vid && !x.voidedAt
      && x.status!=='cancelled'
      && (this._period==='all' || (x.outAt>=rng.start && x.outAt<=rng.end)))
      .sort((a,b)=>(b.outAt||0)-(a.outAt||0));
    const total = rows.reduce((a,x)=>a+(Number(x.revenue)||0),0);
    openSheet(`<div class="sheet-hd"><h2>${esc(v?vLabel(v):'Bike')}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="card" style="background:var(--p-50);border-color:#D9E2EA">
        <div class="line"><span>${esc(rng.label)}</span><b>${money(total)}</b></div>
        <div class="line"><span>Rentals</span><b>${rows.length}</b></div>
        ${v&&v.regNo?`<div class="line"><span>Number</span><b>${esc(v.regNo)}</b></div>`:''}
      </div>
      ${!rows.length ? '<div class="empty"><b>No rentals in this period</b></div>'
        : rows.map(r=>`<div class="card tap" onclick="R.bill('${esc(r.id)}')">
            <div class="row"><div class="grow">
              <b class="ell">${esc(r.customerName||'—')}</b>
              <div class="muted" style="margin-top:2px">${r.outAt?fmtDT(r.outAt):''}
                ${r.extraHours?' · '+r.extraHours+'h extra':''}</div></div>
              <div style="text-align:right"><b>${money(r.revenue)}</b>
                <div style="font-size:10.5px;font-weight:800;color:var(--p);margin-top:3px">BILL ›</div>
              </div></div></div>`).join('')}`);
  },

  /* ── the bill ─────────────────────────────────────────────────────
     A settled rental is a document the shop may need to hand over or
     defend in an argument, so it reads as an invoice: what was taken,
     what was charged, what came back. */
  bill(id){
    const r = ((this._closed||[]).concat((this._h&&this._h.rows)||[])).find(x=>x.id===id);
    if (!r) return toast('Bill not found');
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
    const c = r.charges || {};
    const shop = (window.Cloud && Cloud.shopName) || 'Rental';
    const line = (l,a,cls) => a ? `<div class="line"><span>${l}</span><b class="${cls||''}">${money(a)}</b></div>` : '';
    const applied = (Number(r.depositHeld)||0) - (Number(r.depositRefunded)||0);
    openSheet(`
      <div class="sheet-hd"><h2>Bill</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="bill">
        <div class="bill-top">
          <div class="bill-shop">${esc(shop)}</div>
          <div class="bill-no">#${esc(String(r.id||'').slice(-6).toUpperCase())}</div></div>
        <div class="bill-veh">
          <div><div class="bill-veh-n">${esc(v?vLabel(v):((r.rateSnapshot&&r.rateSnapshot.model)||'Vehicle'))}</div>
          ${v&&v.regNo?`<div class="muted">${esc(v.regNo)}</div>`:''}</div>
          <div style="font-size:30px">${kindEmoji()}</div></div>
        <div class="bill-grid">
          <div><span>Customer</span><b>${esc(r.customerName||'—')}</b></div>
          <div><span>Phone</span><b>${esc(r.customerPhone||'—')}</b></div>
          <div><span>Out</span><b>${r.outAt?fmtDT(r.outAt):'—'}</b></div>
          <div><span>Returned</span><b>${r.returnedAt?fmtDT(r.returnedAt):'—'}</b></div>
          <div><span>Package</span><b>${r.tier?tierOf(r.tier).label:'—'}${
            (r.rateSnapshot&&r.rateSnapshot.weekend)?' <span class="muted">· weekend rate</span>':''}</b></div>
          <div><span>Time used</span><b>${r.hoursUsed!=null?fmtDur(r.hoursUsed):'—'}</b></div>
        </div>
        <div class="bill-sec">Charges</div>
        ${line('Rent · '+(r.tier?tierOf(r.tier).label:''), c.rent)}
        ${line('Overtime · '+(r.extraHours||0)+' hr', c.overtime, 'neg')}
        ${line('Damage', c.damage, 'neg')}
        ${line('Fuel', c.fuel, 'neg')}
        ${line('Other / fine', c.other, 'neg')}
        <div class="line tot"><span>Total</span><b>${money(r.revenue)}</b></div>
        <div class="bill-sec">Payment</div>
        ${line('Paid at pickup' + (r.outPayMode?' · '+esc(r.outPayMode):''), r.advancePaid, 'pos')}
        ${line('Collected on return' + (r.inPayMode?' · '+esc(r.inPayMode):''), r.balanceCollected, 'pos')}
        <div class="line"><span>Deposit taken</span><b>${money(r.depositHeld)}</b></div>
        ${line('Deposit returned' + (r.refundMode?' · '+esc(r.refundMode):''), r.depositRefunded, 'pos')}
        ${applied>0?`<div class="line"><span>Deposit applied to bill</span><b class="neg">${money(applied)}</b></div>`:''}
        ${Number(r.unpaid)>0?`<div class="line tot"><span>Still owed</span>
          <b class="neg">${money(r.unpaid)}</b></div>`:''}
        <div class="bill-foot">Settled ${r.settledAt?fmtDT(r.settledAt):''}</div>
      </div>
      ${r.voidedAt?`<div class="card" style="background:var(--danger-tint);border-color:var(--danger);margin-top:12px">
        <b style="color:var(--danger)">VOIDED</b>
        <div class="muted" style="margin-top:3px">Kept for the record; removed from all totals.</div></div>`:''}
      ${r.customerPhone && !r.voidedAt?`<button class="btn g" style="margin-top:12px" onclick="R.billWa('${esc(id)}')">
        Send this bill on WhatsApp</button>`:''}
      ${this.isManager() && !r.voidedAt?`<button class="btn ghost" style="margin-top:9px"
        onclick="R.editBill('${esc(id)}')">Edit or void this bill</button>`:''}`);
  },

  billWa(id){
    const r = ((this._closed||[]).concat((this._h&&this._h.rows)||[])).find(x=>x.id===id);
    if (!r || !r.customerPhone) return;
    const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
    const c = r.charges || {};
    const L = ['*'+((window.Cloud&&Cloud.shopName)||'Rental')+'*',
      'Bill #'+String(r.id||'').slice(-6).toUpperCase(), '',
      'Vehicle: '+(v?vLabel(v):'')+(v&&v.regNo?' ('+v.regNo+')':''),
      'Out: '+fmtDT(r.outAt), 'Back: '+fmtDT(r.returnedAt),
      'Used: '+fmtDur(r.hoursUsed||0), '', 'Rent: '+money(c.rent||0)];
    if (c.overtime) L.push('Overtime ('+(r.extraHours||0)+' hr): '+money(c.overtime));
    if (c.damage) L.push('Damage: '+money(c.damage));
    if (c.fuel) L.push('Fuel: '+money(c.fuel));
    if (c.other) L.push('Other: '+money(c.other));
    L.push('*Total: '+money(r.revenue)+'*', '',
      'Deposit taken: '+money(r.depositHeld),
      'Deposit returned: '+money(r.depositRefunded), '', 'Thank you!');
    window.open('https://wa.me/91'+r.customerPhone+'?text='+encodeURIComponent(L.join('\n')), '_blank');
  },

};

/* `const DB` at the top level of a CLASSIC script is script-scoped — it never
   becomes a window property, unlike a function declaration. The Firebase code
   lives in an ES module block, which is a separate scope, so every window.DB
   reference there was undefined: snapshots could not write into DB.d and the
   UI stayed empty while Firestore quietly held the data. Anything the module
   needs has to be handed across explicitly. */
window.DB = DB;
window.seed = seed;
window.R = R;
window.closeSheet = closeSheet;
R.boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>navigator.serviceWorker.register('rentalnow-sw.js').catch(()=>{}));
}

/* ══════════════════════════════════════════════════════════════════
   INSTALL
   Chrome fires beforeinstallprompt once, early, and the event is the
   only way to open the install dialog later — so it is captured and
   held rather than used on arrival. The banner is then shown when the
   shop is actually looking at their yard, not over the login screen.

   iOS has no such event and never will: Safari only installs through
   Share → Add to Home Screen. So iOS gets instructions instead of a
   button that could not work, which is the honest version.
   ══════════════════════════════════════════════════════════════════ */
const Install = {
  evt: null,
  DISMISS_DAYS: 7,

  standalone(){
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  },
  isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  /* Available means "we can actually put this on their home screen" —
     either Chrome handed us an event, or it is iOS where the manual route
     always exists. */
  available(){
    return !this.standalone() && (!!this.evt || this.isIOS());
  },
  snoozed(){
    try {
      const t = Number(localStorage.getItem('rn_inst_snooze') || 0);
      return t && (Date.now() - t) < this.DISMISS_DAYS * 86400000;
    } catch(e){ return false; }
  },
  snooze(){
    try { localStorage.setItem('rn_inst_snooze', String(Date.now())); } catch(e){}
    const b = document.getElementById('rn-install'); if (b) b.remove();
  },

  /* Only once the app is genuinely in use. Showing this over the phone-OTP
     screen is how an install prompt gets dismissed for good.

     The gate is #gate — it is display:none until auth needs it, and it sits
     at z-index 900, so a banner shown while it is up would float over the
     OTP field. An earlier version of this checked for #login-screen, which
     does not exist in this app: the guard silently passed and the only
     thing standing between the banner and the login screen was the
     #out-list check below. */
  ready(){
    const gate = document.getElementById('gate');
    if (gate && getComputedStyle(gate).display !== 'none') return false;
    return !!document.getElementById('out-list');
  },

  banner(){
    if (!this.available() || this.snoozed()) return;
    if (!this.ready()) return;
    if (document.getElementById('rn-install')) return;
    const ios = this.isIOS() && !this.evt;
    const el = document.createElement('div');
    el.id = 'rn-install';
    el.innerHTML =
      /* icon-192 is now the RN mark too, so this banner and the home-screen
         result finally agree. */
      '<img class="ii" src="./icon-192.png" alt="">' +
      '<div class="it"><b>' + (ios ? 'Add RentalNow to your home screen'
                                   : 'Install RentalNow') + '</b>' +
      '<span>' + (ios ? 'Tap Share, then "Add to Home Screen".'
                      : 'Opens full screen and works without signal.') + '</span></div>' +
      (ios ? '' : '<button class="ib" id="rn-inst-go">Install</button>') +
      '<button class="ix" id="rn-inst-x" aria-label="Not now">&times;</button>';
    document.body.appendChild(el);
    const go = document.getElementById('rn-inst-go');
    if (go) go.addEventListener('click', () => Install.prompt());
    document.getElementById('rn-inst-x').addEventListener('click', () => Install.snooze());
  },

  async prompt(){
    if (this.isIOS() && !this.evt) return this.help();
    if (!this.evt) return this.help();
    const e = this.evt;
    this.evt = null;                      /* single use, by spec */
    const b = document.getElementById('rn-install'); if (b) b.remove();
    try {
      e.prompt();
      const res = await e.userChoice;
      if (res && res.outcome === 'accepted'){
        if (typeof toast === 'function') toast('Installing RentalNow…');
      } else {
        this.snooze();
      }
    } catch(err){ this.help(); }
  },

  /* Shown when there is no event to fire: iOS, an in-app browser, a desktop
     that cannot install, or an already-installed app. Names the actual
     situation instead of saying "install failed". */
  help(){
    const ios = this.isIOS();
    const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp/i.test(navigator.userAgent);
    let body;
    if (this.standalone()){
      body = '<div class="card"><b style="font-size:14px">Already installed</b>' +
        '<div class="muted" style="margin-top:4px">You are using the installed app right now.</div></div>';
    } else if (inApp){
      body = '<div class="card"><b style="font-size:14px">Open this in your browser first</b>' +
        '<div class="muted" style="margin-top:4px">This page is inside another app\u2019s browser, ' +
        'which cannot install. Tap the menu and choose \u201cOpen in Chrome\u201d or \u201cOpen in Safari\u201d, ' +
        'then try again.</div></div>';
    } else if (ios){
      body = '<div class="card"><b style="font-size:14px">On iPhone and iPad</b>' +
        '<div class="muted" style="margin-top:6px;line-height:1.6">1. Tap the Share button at the bottom of Safari<br>' +
        '2. Scroll down and tap <b>Add to Home Screen</b><br>3. Tap <b>Add</b></div>' +
        '<div class="muted" style="margin-top:8px">Safari only \u2014 Chrome on iPhone cannot add to the home screen.</div></div>';
    } else {
      body = '<div class="card"><b style="font-size:14px">On Android</b>' +
        '<div class="muted" style="margin-top:6px;line-height:1.6">1. Tap the three-dot menu in Chrome<br>' +
        '2. Tap <b>Install app</b> or <b>Add to Home screen</b></div>' +
        '<div class="muted" style="margin-top:8px">If neither appears, update Chrome and reload this page.</div></div>';
    }
    openSheet('<div class="sheet-hd"><h2>Install RentalNow</h2>' +
      '<button class="btn ghost sm" onclick="closeSheet()">Close</button></div>' + body +
      '<div class="muted" style="margin:0 2px;line-height:1.55">Once installed it opens full screen ' +
      'from your home screen, and keeps working when the signal drops \u2014 rentals you take offline ' +
      'upload by themselves.</div>');
  }
};
window.Install = Install;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();          /* keep it, so our own button can fire it */
  Install.evt = e;
  setTimeout(() => Install.banner(), 2500);
});
window.addEventListener('appinstalled', () => {
  Install.evt = null;
  try { localStorage.removeItem('rn_inst_snooze'); } catch(e){}
  const b = document.getElementById('rn-install'); if (b) b.remove();
  if (typeof toast === 'function') toast('RentalNow installed');
});
/* iOS never fires the event, so its banner needs its own nudge. */
if (Install.isIOS()) setTimeout(() => Install.banner(), 4000);
</script>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════
   CLOUD LAYER  (Tier 0)
   Auth · multi-shop · scoped realtime sync · transactional check-out

   Design notes that matter:

   1. LISTENERS ARE SCOPED. We never listen to the whole rentals
      collection — at 70k rentals a year that grows without bound. Live
      listeners cover the hot set only (vehicles, rates, members, and
      rentals where status == 'open'), which stays ~350 docs forever.
      History is a paged query, not a listener.

   2. CHECK-OUT IS A SERVER TRANSACTION. Renting a specific bike
      allocates a scarce thing: two staff must not both get it. The
      transaction flips available -> rented and aborts otherwise. With
      no signal we do NOT refuse — we hold the rental and complete it
      the moment the connection returns.

   3. CHECK-IN DOES NOT NEED THE SERVER. The bike is physically back;
      nobody else can be returning it. That write queues offline and
      replays, which is what Firestore's persistence is for.
   ═══════════════════════════════════════════════════════════════════ */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

   makes "never lost" true for work done without a connection.

   disabled or broken outright (storage permissions, embedded webview
   restrictions, private-browsing variants that differ from Chrome's).
