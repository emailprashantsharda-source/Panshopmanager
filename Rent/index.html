        </div>
        <button class="btn" onclick="R.payHelp('${esc(id)}')">Pay on WhatsApp instead</button>`);
    }
  },

  /* ── promo codes, on the plans list ──────────────────────────────────
     One field above the four cards rather than one per card. A code is
     checked against every plan at once, so the list itself re-prices and a
     shopkeeper can see which plans the code actually covers instead of
     discovering it after picking one.

     _promo.prices is a map of tier -> discounted price, holding only the
     tiers the code is valid for. A tier missing from that map keeps its list
     price and buys at list price. */
  _promo: null,

  async applyPromo(){
    const inp = document.getElementById('pl-code');
    const code = ((inp && inp.value) || '').trim().toUpperCase();
    if (!code) return this._plMsg('Enter a promo code', false);
    const cycle = this._billing === 'y' ? 'annual' : 'monthly';
    this._plMsg('Checking\u2026', null);
    /* Four checks in parallel, because the answer differs per plan and the
       shopkeeper should not have to tap four times to find that out. */
    const res = await Promise.all(this.PLANS.map(p =>
      Cloud.checkPromo(p.id, cycle, code).then(d => ({ id:p.id, d }))));
    const prices = {}; let anyReason = '';
    res.forEach(r => {
      if (r.d && r.d.valid && typeof r.d.finalPrice === 'number') prices[r.id] = r.d.finalPrice;
      else if (!anyReason && r.d && r.d.reason) anyReason = r.d.reason;
    });
    const hits = Object.keys(prices);
    if (!hits.length){
      this._promo = null; Haptic.error();
      this._promoMsgPending = esc(anyReason || 'Invalid or expired code');
      this._promoMsgOk = false;
      return this._plMsg(this._promoMsgPending, false);
    }
    this._promo = { code, prices, cycle };
    Haptic.success();
    const names = hits.map(h => (this.planById(h)||{}).name).filter(Boolean).join(', ');
    this._promoMsgPending = '\u2713 <b>' + esc(code) + '</b> applied to ' + esc(names) +
      '. <span style="color:var(--danger);font-weight:800;text-decoration:underline" onclick="R.clearPromo()">Remove</span>';
    this._promoMsgOk = true;
    this.plans();          /* re-render so the cards show the new prices */
  },

  clearPromo(){
    this._promo = null;
    this._promoMsgPending = ''; this._promoMsgOk = null;
    this.plans();
  },

  _plMsg(html, ok){
    const el = document.getElementById('pl-msg'); if (!el) return;
    el.style.display = 'block';
    el.style.color = ok === true ? 'var(--success-d)'
                   : (ok === false ? 'var(--danger)' : 'var(--t3)');
    el.innerHTML = html;
  },

  /* If checkout fails there still has to be a way to give you money. */
  payHelp(id){
    const p = this.PLANS.find(x=>x.id===id);
    const yearly = this._billing === 'y';
    const shop = (window.Cloud && Cloud.shopName) || '';
    const msg = 'RentalNow — I want the ' + (p?p.name:'') + ' plan ('
      + (yearly ? 'yearly ' + money(p?p.y:0) : 'monthly ' + money(p?p.m:0)) + ')'
      + (shop ? '\nBusiness: ' + shop : '')
      + ((window.Cloud && Cloud.shopId) ? '\nRef: ' + Cloud.shopId : '');
    window.open('https://wa.me/919289792666?text=' + encodeURIComponent(msg), '_blank');
  },

  /* Coming back from PayU: say what happened. The webhook is the source of
     truth, so a success here is confirmed by the shop document updating —
     we do not take the redirect's word for it. */
  /* ?plan=growth&cycle=annual — arriving from a pricing card on the landing
     page. Opens the Plans sheet with that billing period already chosen and
     the plan marked, rather than dropping someone who just tapped a price on
     a dashboard with no mention of it.

     It deliberately does NOT jump to PayU. A visitor from a marketing page may
     not have signed in, may not have a shop yet, and has certainly not agreed
     to be charged by tapping a price on a webpage. */
  planDeepLink(){
    try {
      const q = new URLSearchParams(location.search);
      const want = String(q.get('plan') || '').toLowerCase();
      if (!want) return;
      const cyc = String(q.get('cycle') || 'annual').toLowerCase();
      history.replaceState({}, '', location.pathname);
      if (!this.planById(want)) return;
      this._billing = /month/.test(cyc) ? 'm' : 'y';
      this._wantPlan = want;
      /* Waits for sign-in. Cloud.ready is false while the OTP gate is up, and
         a plans sheet over the phone-number screen helps nobody. */
      const open = () => {
        if (!(window.Cloud && Cloud.ready)) return setTimeout(open, 600);
        this.plans();
      };
      setTimeout(open, 900);
    } catch(e){ console.warn('planDeepLink', e); }
  },

  payuReturnCheck(){
    try {
      const q = new URLSearchParams(location.search);
      const r = q.get('payu'); if (!r) return;
      history.replaceState({}, '', location.pathname);
      if (r === 'success'){
        Haptic.success();
        setTimeout(()=>{
          const t = (window.Cloud && Cloud.ready) ? Cloud.trialInfo() : null;
          openSheet(`<div class="sheet-hd"><h2>Payment received</h2>
            <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
            <div class="card" style="background:var(--success-tint);border-color:#B7ECD1">
              <b style="font-size:14px;color:var(--success-d)">You're all set</b>
              <div class="muted" style="margin-top:4px">${t && t.paid
                ? esc(R.planLabel(t)) + ' is active' +
                  (t.subEnds ? ' until ' + esc(fmtDay(t.subEnds)) : '') + '.'
                : 'Activation can take a few seconds. If it has not appeared in a minute, message us and we will sort it.'}</div></div>`);
        }, 1200);
      } else {
        Haptic.error();
        toast('Payment did not go through — nothing was charged');
      }
    } catch(e){}
  },

  /* ── staff ──────────────────────────────────────────────────────── */
  staff(){
    const ms = DB.d.members || [];
    openSheet(`<div class="sheet-hd"><h2>Staff &amp; roles</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      ${ms.map(m=>`<div class="card"><div class="row">
          <b class="grow">${esc(m.phone||m.id)}</b>
          <span class="pill ${m.role==='owner'?'ok':'out'}">${esc(m.role||'')}</span></div></div>`).join('')}
      <div class="sec-hd">Invite someone</div>
      <div class="muted" style="margin:0 2px 10px">They join when they sign in with this number.</div>
      <div class="fld"><input class="in" id="st-ph" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></div>
      <div class="fld"><label class="lbl">Role</label>
        <select class="in" id="st-role">
          <option value="counter">Counter — rent out &amp; take back only</option>
          <option value="manager">Manager — also bikes &amp; money</option>
        </select></div>
      <button class="btn" onclick="R.staffAdd()">Send invite</button>`);
  },
  async staffAdd(){
    const ph = document.getElementById('st-ph').value;
    const role = document.getElementById('st-role').value;
    const res = await Cloud.addStaff(ph, role);
    if (!res.ok) return toast(res.msg||'Could not invite');
    closeSheet(); toast('Invited — they join when they sign in');
  },

  /* ── history: paged query, never a live listener ─────────────────
     Closed rentals grow without bound, so this is the one screen that
     must never load "everything". */
  async history(reset){
    if (!window.Cloud || !Cloud.ready) return toast('Sign in to see history');
    if (reset) this._h = { rows: [], cursor: null, done: false };
    const st = this._h = this._h || { rows: [], cursor: null, done: false };
    if (st.done) return;
    try {
      const res = await Cloud.history(st.cursor, 25);
      st.rows = st.rows.concat(res.rows);
      st.cursor = res.cursor;
      if (!res.rows.length || res.rows.length < 25) st.done = true;
    } catch(e){ console.error(e); return toast('Could not load history — index may still be building'); }
    this.historySheet();
  },
  historySheet(){
    const st = this._h || { rows: [] };
    openSheet(`<div class="sheet-hd"><h2>Past rentals</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      ${!st.rows.length ? '<div class="empty"><b>No closed rentals yet</b></div>' :
        st.rows.map(r=>{
          const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
          const isVoid = !!r.voidedAt || r.status === 'cancelled';
          return `<div class="card tap" onclick="R.bill('${esc(r.id)}')"
            style="${isVoid?'opacity:.55':''}"><div class="row">
            <div class="grow"><b class="ell">${esc(v?vLabel(v):(r.vehicleId||'—'))}</b>
              <div class="muted" style="margin-top:2px">${esc(r.customerName||'')} ${esc(r.customerPhone||'')}
                ${isVoid?`<span class="pill late" style="margin-left:5px">${r.status==='cancelled'?'CANCELLED':'VOID'}</span>`:''}</div>
              <div class="muted" style="margin-top:3px">${r.outAt?fmtDT(r.outAt):''} → ${r.returnedAt?fmtDT(r.returnedAt):''}
                ${r.extraHours?' · '+r.extraHours+'h extra':''}</div></div>
            <div style="text-align:right"><b>${money(r.revenue)}</b>
              <div class="muted" style="font-size:11px">refund ${money(r.depositRefunded)}</div>
              <div style="font-size:10.5px;font-weight:800;color:var(--p);margin-top:3px">VIEW BILL ›</div></div>
          </div></div>`;
        }).join('')}
      ${st.done ? '<div class="muted" style="text-align:center;padding:8px">That\'s everything.</div>'
                : '<button class="btn ghost" onclick="R.history()">Load more</button>'}`);
  },

  topAction(){
    Haptic.primary();
    /* Renting out, from wherever the shop is standing. Adding a bike or a rate
       lives at the top of the list it belongs to, not in the nav. */
    if (!(DB.d.vehicles||[]).filter(v=>!v.deletedAt).length) return this.firstBike();
    return this.checkoutStart();
  },

  render(){
    const titles = { out:'Out Now', fleet:'Fleet', rates:'Rate cards', money:'Money' };
    /* One meaning on every tab. It used to read Add bike on Fleet and Add rate
       on Rates — duplicating the button already at the top of those lists, and
       leaving the only action that earns money reachable from two tabs out of
       four. The permanent control gets the permanent job. */
    const acts   = { out:'Rent out', fleet:'Rent out', rates:'Rent out', money:'Rent out' };
    document.getElementById('top-title').textContent = titles[this.page];
    const biz = document.getElementById('top-biz');
    if (biz) biz.textContent = (window.Cloud && Cloud.shopName) || 'RentalNow';
    const cl = document.getElementById('nv-cta-l');
    if (cl) cl.textContent = acts[this.page] || 'Rent out';
    /* Dim it when there is genuinely nothing to rent, rather than letting a
       shopkeeper tap the biggest button on screen and be told no. */
    const cta = document.getElementById('nv-cta');
    /* Never dimmed. It used to grey out whenever no bike was available, which
       for a one- or two-bike shop is most of the working day — the button went
       dead exactly when the app was doing its job, and a dead primary action
       reads as a broken app rather than a considerate one.
       
       checkoutStart() already refuses politely and says why, which is a better
       answer than a grey circle that says nothing. */
    if (cta) cta.classList.remove('off');
    /* The sidebar mirrors the bottom nav rather than replacing it: same page
       state, same counts, so whichever one the screen is showing is right. */
    const held = (DB.d.bookings||[]).filter(b=>b.status==='held').length;
    const openN = (DB.d.rentals||[]).filter(r=>r.status==='open').length;
    const setTx = (id,v) => { const e=document.getElementById(id); if (e) e.textContent = v||''; };
    setTx('sv-out-c',   openN||'');
    setTx('sv-book-c',  held||'');
    setTx('sv-fleet-c', (DB.d.vehicles||[]).filter(v=>!v.deletedAt).length||'');
    const sb = document.getElementById('side-biz');
    if (sb) sb.firstChild && (sb.firstChild.nodeValue = (window.Cloud && Cloud.shopName) || 'RentalNow');
    const sp = document.getElementById('side-plan');
    if (sp && window.Cloud && Cloud.ready){
      const t = Cloud.trialInfo();
      sp.textContent = t.paid ? this.planLabel(t)
        : (t.active ? t.trialDaysLeft + ' days left' : 'Trial ended');
    }
    ['out','book','fleet','rates','money'].forEach(k=>{
      const el = document.getElementById('sv-'+k);
      if (el) el.classList.toggle('on',
        k==='book' ? (this.page==='out' && this._bookTab)
                   : (this.page===k && !(k==='out' && this._bookTab)));
    });

    if (this.page==='out') this.renderOut();
    if (this.page==='fleet') this.renderFleet();
    if (this.page==='rates') this.renderRates();
    if (this.page==='money') this.renderMoney();
  },

  /* ── OUT NOW ────────────────────────────────────────────────────── */
  /* ── onboarding ───────────────────────────────────────────────────
     State is derived from the data, never stored. There is no `onboarded`
     flag to fall out of step with reality: delete the only bike and step 1
     comes back, which is correct. It also needs no migration, works the same
     on a second phone, and cannot claim a shop is set up when it owns
     nothing. */
  obState(){
    const veh   = (DB.d.vehicles||[]).filter(v=>!v.deletedAt);
    const rates = (DB.d.rates||[]);
    return {
      bikes:   veh.length > 0,
      priced:  rates.some(r => this.rateReady(r)),
      rented:  (DB.d.rentals||[]).length > 0,
      nBikes:  veh.length,
      firstReady: (veh.find(v => { const rc = rates.find(r=>r.id===v.rateId);
                                   return rc && this.rateReady(rc); }) || null)
    };
  },
  obDone(){ const o=this.obState(); return o.bikes && o.priced && o.rented; },

  obCard(){
    if (!this.isManager()) return '';          /* setup is the owner's job */
    const o = this.obState();
    if (o.bikes && o.priced && o.rented){
      /* BUG FIX: obDismiss() wrote rn_ob_done to localStorage and nothing ever
         read it, so "Got it" lasted until the next reload and the congratulations
         card came back for ever. */
      if (this._obDismissed) return '';
      try { if (localStorage.getItem('rn_ob_done')) { this._obDismissed = true; return ''; } } catch(e){}
      return `<div class="card" style="background:var(--success-tint);border-color:#B7ECD1">
        <div class="row"><b class="grow" style="font-size:13.5px">Your shop is set up \u{1F389}</b>
          <button class="btn ghost sm" onclick="R.obDismiss()">Got it</button></div>
        <div class="muted" style="margin-top:3px">Add the rest of your bikes whenever you have a
        minute \u2014 Fleet, then Add a ${noun()}.</div></div>`;
    }
    const pct = (o.bikes?33:4) + (o.priced?33:0) + (o.rented?34:0);
    const step = (n,label,state) => `<div class="row" style="gap:9px;padding:5px 0;font-size:13px;
        font-weight:${state==='now'?'800':'700'};color:${
          state==='done'?'#9FBACD':(state==='now'?'#fff':'#7E9AAE')}">
      <span style="width:20px;height:20px;border-radius:99px;flex:0 0 auto;display:flex;
        align-items:center;justify-content:center;font-size:10px;font-weight:900;
        background:${state==='done'?'var(--success)':(state==='now'?'var(--y)':'rgba(255,255,255,.14)')};
        color:${state==='done'?'#04361D':(state==='now'?'#0A0A0A':'#fff')}">${
          state==='done'?'\u2713':n}</span>${label}</div>`;
    const s1 = o.bikes ? 'done' : 'now';
    const s2 = o.priced ? 'done' : (o.bikes ? 'now' : 'todo');
    const s3 = o.rented ? 'done' : ((o.bikes&&o.priced) ? 'now' : 'todo');
    let cta;
    if (!o.bikes)       cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.firstBike()">Add your first ${noun()}</button>`;
    else if (!o.priced) cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.nav('rates')">Set what you charge</button>`;
    else                cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.checkoutStart()">Rent out ${
                                  esc((this.obState().firstReady||{}).name||'a bike')}</button>`;
    return `<div style="background:linear-gradient(160deg,#12466A,#0A2C43);color:#fff;
        border-radius:14px;padding:14px;margin-bottom:11px">
      <div style="font-size:14px;font-weight:875;letter-spacing:-.02em">${
        o.bikes ? 'Almost there' : 'Set up your shop'}</div>
      <div style="font-size:11.5px;color:#BFD4E2;margin-top:2px">${
        o.bikes ? (o.priced ? 'One step left.' : 'Two steps left.') : 'Three steps. About two minutes.'}</div>
      <div style="height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:11px 0 10px;overflow:hidden">
        <i style="display:block;height:100%;width:${pct}%;background:var(--y);border-radius:99px"></i></div>
      ${step(1, o.bikes ? (o.nBikes===1?'1 '+noun()+' added':o.nBikes+' '+noun(1)+' added') : 'Add your first bike', s1)}
      ${step(2, o.priced ? 'Prices set' : 'Check the prices', s2)}
      ${step(3, o.rented ? 'First rental done' : 'Rent it out', s3)}
      <div style="margin-top:11px">${cta}</div></div>`;
  },
  /* The first screen after a new shop signs in. Deliberately the only thing on
     it: a shop that owns nothing has exactly one useful next action, and every
     extra card on this screen is a chance to pick the wrong one. */
  /* ── what do you rent? ────────────────────────────────────────────
     Asked once, straight after the shop exists. Ninety-odd percent of yards
     rent one kind, so asking here means never asking again on the screen
     they use forty times a week.

     Shown only when rentKind is unset AND the shop owns nothing — an
     existing shop must never meet this screen. */
  needsKind(){
    if (!(window.Cloud && Cloud.ready && Cloud.shop)) return false;
    if (Cloud.shop.rentKind) return false;
    if (!this.isOwner()) return false;
    return !((DB.d.vehicles||[]).filter(v=>!v.deletedAt).length);
  },
  askKind(){
    const opt = (k, ic, title, eg) => `
      <div class="kind-opt ${this._kindPick===k?'on':''}" onclick="R.pickKind('${k}')">
        <span class="e">${ic}</span>
        <div class="tx"><b>${title}</b><span>${eg}</span></div>
        ${this._kindPick===k?'<span class="tick">\u2713</span>':''}
      </div>`;
    return `
      <div class="wl" style="padding-top:20px">
        <h2>What do you rent out?</h2>
        <p>So the app uses your words and asks the right questions.</p>
      </div>
      <div style="margin-top:16px">
        ${opt('bike','\u{1F6F5}','Bikes &amp; scooters','Activa, Jupiter, Pulsar')}
        ${opt('car','\u{1F697}','Cars','Swift, Ertiga, Innova')}
        ${opt('both','\u{1F6F5}\u{1F697}','Both','A mixed yard')}
      </div>
      <button class="btn y" style="margin-top:14px" onclick="R.saveKind()">Continue</button>
      <div class="wl-foot">You can change this later, and adding a car to a bike shop just works.</div>`;
  },
  _kindPick: 'bike',
  pickKind(k){ this._kindPick = k; Haptic.tap(); this.render(); },
  saveKind(){
    const k = this._kindPick || 'bike';
    if (window.Cloud && Cloud.ready){
      Cloud.putShop({ rentKind: k }).then(w => {
        /* A rejection here means the rules whitelist has not been deployed.
           Say so rather than silently pretending it saved — the app would then
           call cars bikes for ever and nobody would know why. */
        if (w && !w.ok) toast('Could not save that \u2014 ' + Cloud.explainWrite(w.code));
      });
    }
    Haptic.success();
    this.render();
  },

  welcome(){
    const who = (Cloud.shopName||'').trim().split(/\s+/)[0] || 'there';
    const t = (window.Cloud && Cloud.ready) ? Cloud.trialInfo() : null;
    const step = (n, title, sub, state) => `
      <div class="sr ${state}"><span class="n">${state==='done'?'\u2713':n}</span>
        <div class="tx"><b>${title}</b><span>${sub}</span></div></div>`;
    return `
      <div class="wl">
        <div class="wl-ring">${fleetKind()==='car' ? '\u{1F697}' : '\u{1F6F5}'}</div>
        <h2>Welcome, ${esc(who)}</h2>
        <p>Let\u2019s get your shop ready. Two minutes, and you can rent a ${noun()} out today.</p>
      </div>
      <div class="wl-steps">
        ${step(1,'Add your first '+noun(),'Name it and set what you charge','now')}
        ${step(2,'Check it looks right','Deposit, 24-hour rate, overtime','')}
        ${step(3,'Rent it out','Your first customer, on the app','')}
      </div>
      <button class="btn y" style="margin-top:14px" onclick="R.firstBike()">Add your first ${noun()}</button>
      ${this.isOwner() ? `<div class="wl-link" onclick="R.scanRates()">I have a printed rate card
        \u2014 photograph it</div>` : ''}
      <div class="wl-foot">${t && t.paid ? esc(this.planLabel(t)) + ' active'
        : (t && t.active ? t.trialDaysLeft + ' days free left \u00b7 no card needed'
        : '14 days free \u00b7 no card needed')}</div>`;
  },

  /* ── desktop ──────────────────────────────────────────────────────
     One number, one place. Renderers ask isWide() rather than each carrying
     its own breakpoint, so the CSS and the JavaScript cannot drift apart
     about where desktop begins. */
  WIDE_AT: 1024,
  isWide(){ return window.innerWidth >= this.WIDE_AT; },

  sideToggle(){
    const mini = !document.body.classList.contains('side-mini');
    document.body.classList.toggle('side-mini', mini);
    const s = document.getElementById('side');
    if (s) s.classList.toggle('mini', mini);
    const a = document.querySelector('.side-tog .a');
    if (a) a.textContent = mini ? '\u00BB' : '\u00AB';
    try { localStorage.setItem('rn_side_mini', mini ? '1' : ''); } catch(e){}
  },
  sideRestore(){
    let mini = false;
    try { mini = !!localStorage.getItem('rn_side_mini'); } catch(e){}
    if (mini){
      document.body.classList.add('side-mini');
      const s = document.getElementById('side'); if (s) s.classList.add('mini');
      const a = document.querySelector('.side-tog .a'); if (a) a.textContent = '\u00BB';
    }
  },
  /* Crossing the breakpoint changes which renderer is correct, so a resize has
     to re-render — but only when it actually crosses, not on every pixel of a
     window drag. */
  _wasWide: null,
  onResize(){
    const w = this.isWide();
    if (w === this._wasWide) return;
    this._wasWide = w;
    this.render();
  },

  /* ── selection ────────────────────────────────────────────────────
     A Set of ids, cleared on every tab change, filter change and completed
     action. Selection that survives a filter is selection nobody can audit:
     the shop ticks three rows, filters to something else, and acts on rows it
     can no longer see. */
  _sel: null,
  selHas(id){ return !!(this._sel && this._sel.has(id)); },
  selCount(){ return this._sel ? this._sel.size : 0; },
  selClear(){ this._sel = null; this.render(); },
  selToggle(id){
    if (!this._sel) this._sel = new Set();
    this._sel.has(id) ? this._sel.delete(id) : this._sel.add(id);
    if (!this._sel.size) this._sel = null;
    this.render();
  },
  /* Selects the rows currently on screen, never the ones a filter is hiding.
     "Select all" meaning "including the thirty you cannot see" is how bulk
     actions earn their reputation. */
  selAll(ids){
    const all = ids.every(i => this.selHas(i));
    this._sel = all ? null : new Set(ids);
    this.render();
  },
  selIds(){ return this._sel ? Array.from(this._sel) : []; },
  cbox(on){ return `<span class="cb${on?' on':''}"></span>`; },

  outTab(i){ this._sel=null; this._bookTab = !!i; Haptic.tap(); this.render(); },

  /* Grouped by day, nearest first. Today's carry their actions inline; later
     ones are rows until their day comes round. */
  bookedList(held){
    if (!held.length) return `<div class="empty"><div class="e">\u{1F4C5}</div>
      <b>No bookings yet</b>
      <span>Set a future date on the rent-out sheet and it becomes a booking.</span>
      <div style="margin-top:18px"><button class="btn" style="background:var(--vi)"
        onclick="R.newBooking()">+ New booking</button></div></div>`;
    const dayKey = ms => { const d=new Date(ms);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const today = dayKey(Date.now());
    const tmr   = dayKey(Date.now()+24*HOUR);
    let out = `<button class="btn" style="background:var(--vi);margin-bottom:11px"
      onclick="R.newBooking()">+ New booking</button>`;
    let last = '';
    held.forEach(b => {
      const k = dayKey(b.fromAt);
      if (k !== last){
        last = k;
        const lbl = k===today ? 'Today' : (k===tmr ? 'Tomorrow' : fmtDT(b.fromAt).split(',')[0]);
        out += `<div class="day-hd">${esc(lbl)}${k===today?'':' · '+fmtDT(b.fromAt).split(',')[0]}</div>`;
      }
      const isToday = k === today;
      const time = fmtDT(b.fromAt).split(', ').slice(1).join(', ');
      out += `<div class="card" style="${isToday?'border-color:var(--vi)':''}">
        <div class="row">
          <b class="grow" style="font-size:15px">A ${esc(b.model)}</b>
          <span class="pill ${isToday?'warn':'bk'}">${isToday?esc(time):'HELD'}</span>
        </div>
        <div class="muted" style="margin-top:2px">${esc(b.customerName)}${
          b.customerPhone?' · '+esc(b.customerPhone):''}</div>
        <div class="muted" style="margin-top:3px;color:var(--t2);font-weight:650">
          ${esc(tierOf(b.tier).label)} · ${money(b.quotedRent)}${
          b.token?' · token '+money(b.token)+' taken':' · no token'}</div>
        ${b.preferredVehicleId ? (()=>{ const pv=DB.d.vehicles.find(v=>v.id===b.preferredVehicleId);
          return pv?`<div class="muted" style="margin-top:2px">prefers ${esc(vSub(pv))||esc(vLabel(pv))}</div>`:''; })() : ''}
        ${isToday ? `<div class="two" style="margin-top:10px">
          <button class="btn sm" style="background:var(--y);color:#0A0A0A"
            onclick="R.startBooking('${b.id}')">Start rental</button>
          <button class="btn ghost sm" onclick="R.bookNoShow('${b.id}')">No-show</button>
        </div>` : `<div style="margin-top:9px"><button class="btn ghost sm" style="width:100%"
            onclick="R.bookCancel('${b.id}')">Cancel booking</button></div>`}
      </div>`;
    });
    return out;
  },

  /* The second door. Same sheet, date pre-set to tomorrow — nobody discovers a
     feature by scrolling to a date field. */
  newBooking(){
    this._prefillOut = Date.now() + 24*HOUR;
    this.checkoutStart();
  },

  /* Booking becomes a rental. The bike is chosen NOW, from what is actually
     standing in the yard — the preference is offered first, not forced. */
  startBooking(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    const bikes = (DB.d.vehicles||[]).filter(v =>
      !v.deletedAt && v.rateId === b.rateId && v.status === 'available');
    if (!bikes.length) return toast('No ' + b.model + ' is free right now — check one in first');
    bikes.sort((a,c)=> (a.id===b.preferredVehicleId?-1:0) - (c.id===b.preferredVehicleId?-1:0));
    this._fromBooking = b.id;
    this._prefillOut = Date.now();
    this._prefillVeh = bikes[0].id;
    this._prefillTier = b.tier;
    closeSheet();
    this.checkoutStart();
  },

  bookNoShow(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    if (!confirm('Mark ' + b.customerName + ' as a no-show?\n\nThe bike is freed for anyone else. ' +
      (b.token ? 'The ' + money(b.token) + ' token stays with you unless you refund it yourself.'
               : 'No token was taken.'))) return;
    this._bookSet(id, { status:'noshow', closedAt: Date.now() });
    toast('Marked no-show — the ' + b.model + ' is free');
  },

  bookCancel(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    if (!confirm('Cancel this booking?\n\n' + (b.token
      ? 'Refunding the ' + money(b.token) + ' token is your call — the app only records the cancellation.'
      : 'No token was taken.'))) return;
    this._bookSet(id, { status:'cancelled', closedAt: Date.now() });
    toast('Booking cancelled');
  },

  _bookSet(id, patch){
    const i = (DB.d.bookings||[]).findIndex(x=>x.id===id);
    if (i<0) return;
    Object.assign(DB.d.bookings[i], patch);
    if (window.Cloud && Cloud.ready) Cloud.put('bookings', id, patch);
    DB.save(); this.render();
  },

  obDismiss(){ this._obDismissed = true; try{ localStorage.setItem('rn_ob_done','1'); }catch(e){} this.render(); },

  renderOut(){
    const open = DB.d.rentals.filter(r => r.status === 'open');
    const now = Date.now();
    const late = open.filter(r => now > r.dueAt);
    const depHeld = open.reduce((s,r)=> s + (Number(r.depositHeld)||0), 0);

    /* From today's rollup, not from the open-rentals array — which by
       definition never contains a settled rental. */
    const dk = new Date(); const dayKey = dk.getFullYear() + '-' +
      String(dk.getMonth()+1).padStart(2,'0') + '-' + String(dk.getDate()).padStart(2,'0');
    const today = (DB.d.daily||[]).find(d => d.id === dayKey);
    const todayRev = today ? (Number(today.revenue)||0) : 0;

    document.getElementById('k-out').textContent  = open.length;
    document.getElementById('k-late').textContent = late.length;
    document.getElementById('k-rev').textContent  = money(todayRev);
    document.getElementById('k-dep').textContent  = money(depHeld);
    document.getElementById('k-dep-sub').textContent =
      open.length + ' open rental' + (open.length===1?'':'s') + ' · refundable';

    const box = document.getElementById('out-list');
    /* Onboarding first: while a shop has no bikes, no prices and no rentals,
       nothing else on this screen matters. ratesBanner() would otherwise fire
       at the same time and say the same thing twice, so it stands down until
       setup is done. */
    /* ── a shop with no bikes gets ONE thing on screen ──────────────
       Not a KPI strip of zeros, not a trial banner, not an empty state
       offering to "create 0 bikes from my rate card" — which is what this
       branch used to do, having been written when rate cards shipped
       pre-seeded. One welcome, three steps, one button. */
    const noBikes = !(DB.d.vehicles||[]).filter(v=>!v.deletedAt).length;
    const kp = document.getElementById('out-kpis');
    if (kp) kp.style.display = noBikes ? 'none' : '';
    if (noBikes && this.isManager()){
      /* The question first, then the welcome. Both are full-screen and both
         belong to a shop that owns nothing; showing them together would be two
         primary actions on one screen, which is the thing the welcome rework
         set out to remove. */
      box.innerHTML = this.needsKind() ? this.askKind() : this.welcome();
      return;
    }

    const ob = this.obCard();
    const held = this.bookings().sort((a,b)=> Number(a.fromAt)-Number(b.fromAt));
    const seg = held.length || this._bookTab ? `
      <div class="seg">
        <div class="${this._bookTab?'':'on'}" onclick="R.outTab(0)">Out now${
          open.length?` <span class="sb">${open.length}</span>`:''}</div>
        <div class="${this._bookTab?'on':''}" onclick="R.outTab(1)">Booked${
          held.length?` <span class="sb">${held.length}</span>`:''}</div>
      </div>` : '';

    if (this._bookTab){
      const kp2 = document.getElementById('out-kpis');
      if (kp2) kp2.style.display = 'none';
      box.innerHTML = seg + this.bookedList(held);
      return;
    }

    /* Pickups due today, at the top, because it is the only thing that changes
       what a shop does this morning: how many bikes not to give a walk-in. */
    const dayEnd = new Date(); dayEnd.setHours(23,59,59,999);
    const todays = held.filter(b => Number(b.fromAt) <= dayEnd.getTime());
    const pick = todays.length ? `
      <div class="card" style="background:var(--y-tint);border-color:var(--y-bd)">
        <div class="row"><b class="grow" style="font-size:13px">${todays.length} pickup${
          todays.length===1?'':'s'} today</b>
          <button class="btn ghost sm" onclick="R.outTab(1)">See</button></div>
        <div class="muted" style="margin-top:3px">Keep ${todays.map(b=>esc(b.model)).join(', ')} back.</div>
      </div>` : '';

    const banner = ob + seg + pick + (this.obDone() ? this.ratesBanner() : '') + this.trialBanner();
    if (!open.length){
      box.innerHTML = banner + `<div class="empty"><div class="e">🛵</div>
          <b>Nothing is out right now</b>
          <span>Every ${noun()} is in the yard.</span>
          <div style="margin-top:18px"><button class="btn y" onclick="R.checkoutStart()">
            Rent out a ${noun()}</button></div></div>`;
      return;
    }
    open.sort((a,b)=> a.dueAt - b.dueAt);
    box.innerHTML = banner + open.map(r => {
      const v = DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
      const isLate = now > r.dueAt;
      const overH = isLate ? hoursBetween(r.dueAt, now) : 0;
      return `<div class="card tap" onclick="R.checkinStart('${r.id}')">
        <div class="row">
          <div class="grow">
            <div class="row" style="gap:7px">
              <b class="ell" style="font-size:15.5px">${esc(vLabel(v))}</b>
              <span class="pill ${isLate?'late':'out'}">${isLate?'OVERDUE '+fmtDur(overH):'OUT'}</span>
            </div>
            <div class="muted ell" style="margin-top:2px">
              ${[esc(v.regNo||''), esc(r.customerName||'—'), esc(r.customerPhone||'')].filter(Boolean).join(' · ')}
            </div>
            <div class="muted" style="margin-top:4px">
              Due ${fmtDT(r.dueAt)} · ${tierOf(r.tier).label} · deposit ${money(r.depositHeld)}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:800;color:var(--t3)">CHECK IN</div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  /* ── FLEET ──────────────────────────────────────────────────────── */
  renderFleet(){
    const box = document.getElementById('fleet-list');
    const missing = DB.d.rates.filter(rc => !DB.d.vehicles.some(v => v.rateId===rc.id)).length;
    /* Top of the list, not the bottom. It was at the end and a shop with more
       bikes than fit on screen never saw it — which is the whole point of the
       button, since the FAB was already there for anyone who had found it. */
    /* One count at the top beats discovering it bike by bike. ratesPending()
       already exists for exactly this and is what the Rates tab badges. */
    const pending = this.ratesPending();
    const junk = this.starterJunk().length;
    const hdr = (pending ? `<div class="card" style="background:var(--y-tint);border-color:var(--y-bd);margin-bottom:11px">
        <b style="font-size:13.5px">${pending} rate card${pending===1?'':'s'} still at \u20B90</b>
        <div class="muted" style="margin-top:3px">A bike cannot be rented out until its rate is
        set. Photograph your printed price list and the app can read them in.</div>
        <button class="btn sm" style="margin-top:10px;width:100%" onclick="R.nav('rates')">Open Rates</button>
        ${junk && this.isOwner() ? `<button class="btn ghost sm" style="margin-top:8px;width:100%"
          onclick="R.clearStarters()">Remove ${junk} unpriced bike${junk===1?'':'s'} I never added</button>` : ''}
      </div>` : '') +
      `<div class="muted" style="margin:0 2px 10px">
        One ${noun()} per row. Rename it, add a vehicle number, or add a second ${noun()}
        of the same model from Rates.</div>
      <button class="btn" style="margin-bottom:12px" onclick="R.editVehicle()">
        + Add a ${noun()}</button>` +
      /* Only offered when there genuinely are priced rate cards with no bike
         against them. With no seeding that is a real, useful state — a shop that
         photographed its price list and now wants a bike per model. */
      (missing ? `<button class="btn ghost" style="margin-bottom:12px" onclick="R.fillFromRates()">
          + Add ${missing} missing ${missing===1?noun():noun(1)} from your rate card</button>` : '');
    if (!DB.d.vehicles.length){
      /* One action. This used to read "Your rate card lists 0 models" and offer
         "+ Create 0 bikes from my rate card" — copy written when rate cards
         shipped pre-seeded, which now offers to create nothing. */
      box.innerHTML = `<div class="empty"><div class="e">🏍️</div>
        <b>No ${noun(1)} yet</b>
        <span>Add the ${noun(1)} you actually own. Each one gets its own row, and you can
          give it a number plate.</span>
        <div style="margin-top:18px"><button class="btn y" onclick="R.firstBike()">
          Add your first ${noun()}</button></div>
        ${this.isOwner() ? `<div style="margin-top:9px"><button class="btn ghost"
          onclick="R.scanRates()">\u{1F4F7} Photograph my printed rate card</button></div>` : ''}
      </div>`;
      return;
    }
    /* Desktop gets a table: twelve bikes readable at once, plus the two
       columns a phone cannot afford — Idle days and Earned — which are what an
       owner sitting down actually wants. Same data, different question. */
    if (this.isWide()) return this.fleetTable(hdr);

    const order = { available:0, rented:1, maintenance:2, retired:3 };
    const vs = [...DB.d.vehicles].sort((a,b)=>
      (order[a.status]-order[b.status]) || String(vLabel(a)).localeCompare(String(vLabel(b))));
    box.innerHTML = hdr + vs.map(v => {
      const rc = DB.d.rates.find(r=>r.id===v.rateId);
      const r  = DB.d.rentals.find(x=>x.vehicleId===v.id && x.status==='open');
      const docs = this.docWarn(v);
      const pill = { available:'ok', rented:'out', maintenance:'maint', retired:'late' }[v.status]||'ok';
      const earned = DB.d.rentals.filter(x=>x.vehicleId===v.id && x.status==='closed')
                      .reduce((s,x)=>s+(Number(x.revenue)||0),0);
      return `<div class="card tap" onclick="R.editVehicle('${v.id}')">
        <div class="row">
          <div class="grow">
            <div class="row" style="gap:7px">
              <b class="ell" style="font-size:15.5px">${esc(vLabel(v))}</b>
              <span class="pill ${pill}">${v.status.toUpperCase()}</span>
              ${docs ? `<span class="pill warn">${esc(docs)}</span>` : ''}
              ${rc && !this.rateReady(rc) ? `<span class="pill late">NO RATE</span>` : ''}
            </div>
            ${(()=>{
              /* A booking holds a MODEL, so this line is a fact about the rate
                 card, not about this one bike. It used to read "Booked 9 Aug"
                 on every bike sharing the card, which says the opposite of
                 what is true: one booking against two Activas leaves one free.
                 
                 So it now counts. Two bikes, one booking reads "1 of 2 booked",
                 which is both accurate and identical on every row — correct,
                 because it is a model-level fact. The preferred bike says so. */
              const bs = this.bookings().filter(b => b.rateId === v.rateId)
                .sort((a,c)=> Number(a.fromAt)-Number(c.fromAt));
              if (!bs.length) return '';
              const nb = bs[0];
              const bikes = (DB.d.vehicles||[]).filter(x =>
                !x.deletedAt && x.rateId === v.rateId && x.status !== 'retired').length;
              const tight = bs.length >= bikes;
              const mine = nb.preferredVehicleId === v.id;
              return `<div class="muted" style="margin-top:3px;font-weight:750;color:${
                tight ? 'var(--danger)' : 'var(--vi)'}">
                \u{1F4C5} ${bs.length} of ${bikes} ${esc(nb.model||'')} booked \u00b7 ${
                  esc(fmtDT(nb.fromAt))}${bs.length===1?' \u00b7 '+esc(nb.customerName):''}${
                  mine ? ' \u00b7 this one preferred' : ''}</div>`;
            })()}
            <div class="muted ell" style="margin-top:2px">
              ${esc(vSub(v))||esc(v.model)}${
                !rc ? ' · no rate card'
                : (this.rateReady(rc) ? ' · deposit '+money(rc.deposit) : '')
              }</div>
            ${rc && !this.rateReady(rc) ? `
            <!-- The prompt sits where the problem was noticed, and goes straight
                 to the rate card rather than to the Rates list. stopPropagation
                 because the whole card already opens the bike editor, and a
                 thumb aiming at this should not land there instead. -->
            <div class="muted" style="margin-top:4px;color:var(--danger)">
              Rate not set \u2014 this ${noun()} cannot go out.
              <span style="font-weight:850;text-decoration:underline"
                onclick="event.stopPropagation();R.editRate('${rc.id}')">Set rate</span>
            </div>` : ''}
            <div class="muted" style="margin-top:4px">
              Earned ${money(earned)}${v.cost?' of '+money(v.cost)+' cost':''}
              ${r?' · out, due '+fmtDT(r.dueAt):''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
      /* The second Add button at the end of the list is gone. It existed because
         the first one was hard to find at the bottom; the first one now sits at
         the top, and two of them four centimetres apart on a one-bike fleet was
         the result. */
  },

  /* Days since this bike last went out. The number that says the Maestro has
     sat for 41 days having earned ₹2,100 all year. */
  idleDays(v){
    const last = (DB.d.rentals||[])
      .filter(r => r.vehicleId === v.id)
      .reduce((m,r)=> Math.max(m, Number(r.outAt)||0), 0);
    if (!last) return v.createdAt ? Math.floor((Date.now()-v.createdAt)/(24*HOUR)) : null;
    return Math.floor((Date.now()-last)/(24*HOUR));
  },
  earnedBy(v){
    return (DB.d.rentals||[])
      .filter(r => r.vehicleId === v.id && r.status === 'closed')
      .reduce((s,r)=> s + (Number(r.revenue)||0), 0);
  },

  fleetTable(hdr){
    const box = document.getElementById('fleet-list');
    const order = { available:0, rented:1, maintenance:2, retired:3 };
    const list = (DB.d.vehicles||[]).filter(v=>!v.deletedAt)
      .slice().sort((a,b)=> (order[a.status]||0)-(order[b.status]||0)
        || String(vLabel(a)).localeCompare(String(vLabel(b))));
    const ids = list.map(v=>v.id);
    const n = this.selCount();

    box.innerHTML = hdr + (n ? this.bulkBar(n + ' bike' + (n===1?'':'s') + ' selected', [
        ['R.bulkStatus(\'maintenance\')', 'Mark unavailable'],
        ['R.bulkStatus(\'available\')',   'Mark available'],
        ['R.bulkRetire()',                'Retire', 'dg'],
      ]) : '') +
      `<div class="dt-tbl"><table>
        <thead><tr>
          <th class="selcol" onclick="R.selAll(${JSON.stringify(ids).replace(/"/g,'&quot;')})">
            ${this.cbox(ids.length && ids.every(i=>this.selHas(i)))}</th>
          <th>${Noun()}</th><th>Number</th><th>Rate card</th>
          <th class="num">Deposit</th><th class="num">Rentals</th>
          <th class="num">Earned</th><th class="num">Idle days</th>
          <th>Papers</th><th>Status</th>
        </tr></thead><tbody>
        ${list.map(v=>{
          const rc = (DB.d.rates||[]).find(r=>r.id===v.rateId);
          const docs = this.docWarn(v);
          const rides = (DB.d.rentals||[]).filter(r=>r.vehicleId===v.id).length;
          const idle = this.idleDays(v);
          const pill = { available:'ok', rented:'out', maintenance:'maint', retired:'late' }[v.status]||'ok';
          const sel = this.selHas(v.id);
          return `<tr class="${sel?'sel':''}" onclick="R.editVehicle('${v.id}')">
            <td class="selcol" onclick="event.stopPropagation();R.selToggle('${v.id}')">${this.cbox(sel)}</td>
            <td class="nm">${esc(vLabel(v))}</td>
            <td class="muted">${esc(v.regNo)||'—'}</td>
            <td>${rc ? (this.rateReady(rc) ? esc(rc.model)
                  : `<span class="pill late">NO RATE</span>`) : '<span class="pill late">NONE</span>'}</td>
            <td class="num">${rc && this.rateReady(rc) ? money(rc.deposit) : '—'}</td>
            <td class="num">${rides}</td>
            <td class="num">${money(this.earnedBy(v))}</td>
            <td class="num" ${idle!=null && idle>30 ? 'style="color:var(--danger);font-weight:850"':''}>${
              idle==null?'—':idle}</td>
            <td>${docs?`<span class="pill warn">${esc(docs)}</span>`:'<span class="muted">ok</span>'}</td>
            <td><span class="pill ${pill}">${v.status.toUpperCase()}</span></td>
          </tr>`;
        }).join('')}
      </tbody></table></div>`;
  },

  /* One bar, every screen. Sits where the header was so nothing shifts under
     the cursor when a row is ticked. */
  bulkBar(label, actions){
    return `<div class="bulkbar">
      ${this.cbox(true)}<b>${esc(label)}</b><span class="sp"></span>
      ${actions.map(a=>`<button class="bb ${a[2]||''}" onclick="${a[0]}">${esc(a[1])}</button>`).join('')}
      <button class="bb gh" onclick="R.selClear()">Clear</button>
    </div>`;
  },

  bulkStatus(st){
    const ids = this.selIds(); if (!ids.length) return;
    const out = ids.filter(id => (DB.d.rentals||[]).some(r=>r.vehicleId===id && r.status==='open'));
    if (out.length) return toast(out.length + ' of these are out — check them in first');
    ids.forEach(id => {
      const v = (DB.d.vehicles||[]).find(x=>x.id===id); if (!v) return;
      v.status = st;
      if (window.Cloud && Cloud.ready) Cloud.put('vehicles', id, { status: st });
    });
    DB.save(); this._sel = null; this.render();
    toast(ids.length + ' bike' + (ids.length===1?'':'s') + ' marked ' + st);
  },

  bulkRetire(){
    const ids = this.selIds(); if (!ids.length) return;
    const out = ids.filter(id => (DB.d.rentals||[]).some(r=>r.vehicleId===id && r.status==='open'));
    if (out.length) return toast(out.length + ' of these are out — check them in first');
    const withHist = ids.filter(id => (DB.d.rentals||[]).some(r=>r.vehicleId===id));
    if (!confirm('Remove ' + ids.length + ' bike' + (ids.length===1?'':'s') + '?\n\n' +
      (withHist.length ? withHist.length + ' of them have rental history, which is kept.'
                       : 'None of them have been rented.'))) return;
    /* Soft delete only — the rules forbid a hard one, and history should
       outlive the bike anyway. */
    ids.forEach(id => { if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', id); });
    DB.d.vehicles = (DB.d.vehicles||[]).filter(v=>!ids.includes(v.id));
    DB.save(); this._sel = null; this.render();
    toast('Removed ' + ids.length + ' bike' + (ids.length===1?'':'s'));
  },

  docWarn(v){
    const soon = Date.now() + 30*24*HOUR;
    const bad = [];
    if (v.insExpiry && new Date(v.insExpiry).getTime() < Date.now()) bad.push('INSURANCE EXPIRED');
    else if (v.insExpiry && new Date(v.insExpiry).getTime() < soon) bad.push('INSURANCE DUE');
    if (v.pucExpiry && new Date(v.pucExpiry).getTime() < Date.now()) bad.push('PUC EXPIRED');
    else if (v.pucExpiry && new Date(v.pucExpiry).getTime() < soon) bad.push('PUC DUE');
    return bad[0] || '';
  },
  docBlocked(v){
    const now = Date.now();
    if (v.insExpiry && new Date(v.insExpiry).getTime() < now) return 'insurance';
    if (v.pucExpiry && new Date(v.pucExpiry).getTime() < now) return 'PUC';
    return '';
  },

  /* (v1.2.1) The auto-seed only ran when the fleet was completely empty, so a
     single leftover test bike silently blocked all ten — and a one-time flag
     meant there was no way to ask for them again. This is the same job as a
     visible, repeatable button: one bike for every rate card that has none.
     Safe to press any time; it never duplicates and never touches what is
     already there. */
  fillFromRates(){
    let made = 0;
    DB.d.rates.forEach(rc => {
      if (DB.d.vehicles.some(v => v.rateId === rc.id)) return;
      const rec = { name: rc.model, regNo: '', rateId: rc.id, model: rc.model,
                    status: 'available', cost: 0, insExpiry: '', pucExpiry: '', odo: 0 };
      if (window.Cloud && Cloud.ready) Cloud.put('vehicles', Cloud.nid('v'), rec);
      else DB.d.vehicles.push(Object.assign({ id: DB.id('v') }, rec));
      made++;
    });
    if (!made) return toast('Every rate card already has a ${noun()}');
    DB.save(); this.render();
    toast(made + ' bike' + (made===1?'':'s') + ' added from your rate card');
  },

  editVehicle(id, preRate){
    if (!this.isManager()) return toast('Ask the owner or manager to change ${noun(1)}');
    const v = id ? DB.d.vehicles.find(x=>x.id===id) : null;
    const sel = v ? v.rateId : (preRate||'');
    const opts = DB.d.rates.map(r=>
      /* A seeded rate card is all zeros, so "dep ₹0" is accurate and useless —
         it reads as "this bike needs no deposit" when it means "nobody has told
         me the price yet". rateReady() is the same test that blocks renting the
         bike out, so the dropdown, the fleet card and the counter now agree on
         what "set" means. */
      `<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.model)} · ${
        this.rateReady(r) ? 'dep ' + money(r.deposit) : 'rate not set'
      }</option>`).join('');
    const anyReady = (DB.d.rates||[]).some(r => this.rateReady(r));
    openSheet(`
      <div class="sheet-hd"><h2>${v?'Edit '+noun():'Add '+noun()}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
      <div class="fld"><label class="lbl">${Noun()} name <span class="req">*</span></label>
        <input class="in" id="v-name" value="${esc(v?(v.name||v.regNo||''):'')}"
          placeholder="${fleetKind()==='car'?'Swift — white':'Activa 3G — red'}"></div>
      ${v ? '' : `<div class="muted" style="margin:-4px 2px 6px">Common models \u2014 tap to fill, or type your own</div>
      <div class="chips" style="margin-bottom:12px">${((fleetKind()==='car'?window.CAR_SUGGESTIONS:window.MODEL_SUGGESTIONS)||[]).map(m=>
        `<span class="chip" onclick="R.pickModel('${esc(m)}')">${esc(m)}</span>`).join('')}</div>`}
      <div class="fld"><label class="lbl">Vehicle no. <span class="muted">optional</span></label>
        <input class="in" id="v-reg" value="${esc(v?(v.regNo||''):'')}"
          placeholder="MP04 AB 1234" autocapitalize="characters"></div>
      <div class="fld"><label class="lbl">Rate card <span class="req">*</span></label>
        <select class="in" id="v-rate" onchange="R.rateSel()">
          <option value="">— choose —</option>${opts}
          <option value="__new">+ New rate \u2014 set the price here</option></select>

        <!-- Set the price inline rather than sending him to Rates and back. A
             shop adding its second model has one rate card and no reason to
             know that a rate card is a separate thing from a bike. -->
        <div id="v-newrate" style="display:none">
          <div class="card" style="background:var(--y-tint);border-color:var(--y-bd);margin-top:10px;padding:13px 12px">
            <b style="font-size:13.5px">Price for this model</b>
            <div class="muted" style="margin:2px 0 4px">Every ${noun()} you point at this rate card
              charges the same.</div>
            ${this.rateFields('vnr', null)}
          </div>
        </div>
        ${anyReady ? '' : `
        <!-- Every option in that picker reads "rate not set", so choosing one is
             a dead end: the bike is created and then cannot be rented out. Say
             that here, next to the field causing it, rather than letting the
             shop find out at the counter. Adding the bike is still allowed —
             building the fleet first is a legitimate order of work. -->
        <div class="muted" style="margin-top:7px;color:var(--danger);line-height:1.5">
          None of your rate cards have prices yet, so this bike will not be
          rentable until you set one.
          <span style="font-weight:850;text-decoration:underline"
            onclick="closeSheet();R.nav('rates')">Set prices first</span>
        </div>`}</div>

      <button type="button" class="btn ghost" style="margin:4px 0 12px"
        onclick="R.more('v-more',this)">More details <span class="muted">— optional</span></button>
      <div id="v-more" style="display:none">
        <div class="two">
          <div class="fld"><label class="lbl">Status</label>
            <select class="in" id="v-status">
              ${['available','rented','maintenance','retired'].map(s=>
                `<option value="${s}" ${v&&v.status===s?'selected':''}>${s}</option>`).join('')}
            </select></div>
          <div class="fld"><label class="lbl">Purchase cost</label>
            <input class="in" id="v-cost" type="number" inputmode="numeric" value="${v?(v.cost||''):''}" placeholder="₹"></div>
        </div>
        <div class="two">
          <div class="fld"><label class="lbl">Insurance expiry</label>
            <input class="in" id="v-ins" type="date" value="${v?(v.insExpiry||''):''}"></div>
          <div class="fld"><label class="lbl">PUC expiry</label>
            <input class="in" id="v-puc" type="date" value="${v?(v.pucExpiry||''):''}"></div>
        </div>
        <div class="muted" style="margin:-4px 2px 12px;font-size:11.5px">
          Leave the dates blank if you do not want expiry warnings.</div>
      </div>
      <button class="btn" onclick="R.saveVehicle('${id||''}')">${v?'Save changes':'Add bike'}</button>
      ${v?`<button class="btn ghost" style="margin-top:9px" onclick="R.delVehicle('${id}')">Remove bike</button>`:''}
    `);
  },

  /* collapsible "more details" — keeps the counter path to the fields the
     shop actually asked for, without deleting the ones that protect them */
  more(id, btn){
    const el = document.getElementById(id);
    const open = el.style.display !== 'none';
    el.style.display = open ? 'none' : '';
    btn.innerHTML = (open ? 'More details' : 'Hide details') + ' <span class="muted">— optional</span>';
  },

  /* ── rate entry ───────────────────────────────────────────────────
     One definition, used by the first-bike sheet and by the inline
     "+ New rate" in Add bike. Two copies of a price form is how the two
     drift apart and one of them quietly stops saving the 7-day rate.

     Laid out as rows rather than a grid: label left, amount right, in the
     order a printed rate card lists them. A shop can start at the top and
     tab straight down with the keyboard's Next key, which is the fastest way
     to enter six numbers on a phone.

     Only 24 hr and overtime are required. The rest are the tiers this shop
     may simply not rent by, and demanding five numbers before a bike can
     exist is what made the old screen feel like paperwork. */
  rateFields(pfx, rc){
    rc = rc || {};
    const t = rc.tiers || {};
    /* No placeholder. A grey "700" sitting right-aligned in a price field is
       indistinguishable from a real 700 at arm's length on a cream card — the
       first person to use this filled nothing in, saw every row apparently
       complete, and got told to enter the 24-hour rate. Example prices live in
       the hint line underneath instead, where they cannot be mistaken for
       data. */
    const row = (id, label, val, req) => `
      <div class="rt-row">
        <label class="rt-l" for="${pfx}-${id}">${label}${req?' <span class="req">*</span>':''}</label>
        <div class="rt-in"><span>\u20B9</span>
          <input id="${pfx}-${id}" type="number" inputmode="numeric" enterkeyhint="next"
            value="${val?val:''}"></div>
      </div>`;
    return `
      <div class="rt">
        ${row('dep','Deposit', rc.deposit, false)}
        <div class="rt-sep">Rent by</div>
        ${row('h3','3 hours',  t.h3,  false)}
        ${row('h6','6 hours',  t.h6,  false)}
        ${row('h12','12 hours',t.h12, false)}
        ${row('h24','24 hours',t.h24, true)}
        ${row('d7','7 days',   t.d7,  false)}
        <div class="rt-sep">If they are late</div>
        ${row('ot','Overtime / hour', rc.ot, true)}
        <!-- No example figures anywhere on this form. A number printed near an
             empty price box gets read as the price, whether it sits inside the
             box or under it. Every rate here comes from the shop and nowhere
             else. -->
        <div class="rt-hint">
          Fill only the ones you actually rent by \u2014 blank ones are not offered at the
          counter. <b>24 hours</b> and <b>overtime</b> are the two the app cannot work without.
        </div>
      </div>`;
  },
  /* Reads whatever rateFields(pfx) wrote. Returns null with a toast if the two
     required numbers are missing, so both callers fail the same way. */
  readRate(pfx){
    const g = i => document.getElementById(pfx + '-' + i);
    const n = i => Number((g(i)||{}).value) || 0;
    /* Point at the box, do not just complain. A toast saying "enter the 24-hour
       rate" while the row looks the same as every other row is how someone ends
       up certain they already filled it in. */
    const flag = i => { const el = g(i); if (el && el.parentElement){
      el.parentElement.classList.add('miss'); el.focus(); } };
    const clear = () => ['dep','h3','h6','h12','h24','d7','ot'].forEach(i => {
      const el = g(i); if (el && el.parentElement) el.parentElement.classList.remove('miss'); });
    clear();
    const d24 = n('h24'), ot = n('ot');
    if (!(d24 > 0)) { flag('h24'); Haptic.error(); toast('Enter what you charge for 24 hours'); return null; }
    if (!(ot > 0))  { flag('ot');  Haptic.error(); toast('Enter the overtime rate \u2014 it is what late returns cost you'); return null; }
    return { deposit: n('dep'), ot: ot,
             tiers: { h3:n('h3'), h6:n('h6'), h12:n('h12'), h24:d24, d7:n('d7') } };
  },

  /* ══════════════════════════════════════════════════════════════════
     ADVANCE BOOKINGS
     A booking holds a MODEL for a window. The bike the shop happened to be
     looking at is recorded as a preference and chosen for real at pickup —
     naming it now would mean reassigning by hand every time a bike is late,
     damaged or sold before the date arrives.
     ══════════════════════════════════════════════════════════════════ */

  /* Anything within the next half hour is a rental; beyond that is a booking.
     
     90 seconds was too tight: a shop that says "out at 7.30" when it is 7.05,
     because the customer is parking his car, would have had it silently
     recorded as a booking. Nobody fills in a checkout sheet half an hour
     before handing a bike over unless they mean to reserve it — and the sheet
     says out loud which mode it is in, so a wrong guess is visible before
     anything saves. */
  BOOK_SLACK_MS: 30 * 60 * 1000,
  isFuture(ms){ return ms > Date.now() + this.BOOK_SLACK_MS; },

  bookings(){ return (DB.d.bookings||[]).filter(b => b.status === 'held'); },

  /* How many bikes of this model are free for [from,to).
     
     total          bikes on the rate card, not deleted, not retired
     minus rentals  open rentals of those bikes still running at `from`
     minus bookings other held bookings for the model whose window overlaps
     
     Overlap is counted rather than peak concurrency: two bookings on
     different days inside one long window both count against it. That makes
     the answer conservative and occasionally refuses a booking that would
     have fitted. Correct direction to be wrong — turning one away costs a
     day's rent, double-booking costs the customer and the review. */
  bookFree(rateId, from, to, ignoreId){
    const bikes = (DB.d.vehicles||[]).filter(v =>
      !v.deletedAt && v.rateId === rateId && v.status !== 'retired');
    const total = bikes.length;
    if (!total) return { total:0, free:0, outNow:0, booked:0 };
    const ids = new Set(bikes.map(v=>v.id));
    const outNow = (DB.d.rentals||[]).filter(r =>
      r.status === 'open' && ids.has(r.vehicleId) && (Number(r.dueAt)||0) > from).length;
    const booked = this.bookings().filter(b =>
      b.id !== ignoreId && b.rateId === rateId &&
      Number(b.fromAt) < to && Number(b.toAt) > from).length;
    return { total, outNow, booked, free: Math.max(0, total - outNow - booked) };
  },

  /* Held bookings for a model that start before a proposed rental would end —
     the walk-in clash. Returns the soonest, which is the one worth naming. */
  bookClash(rateId, from, to, ignoreId){
    const hits = this.bookings().filter(b =>
      b.id !== ignoreId && b.rateId === rateId &&
      Number(b.fromAt) < to && Number(b.toAt) > from);
    if (!hits.length) return null;
    const f = this.bookFree(rateId, from, to, ignoreId);
    /* Only a clash if capacity actually runs out. Three Jupiters and one
       booking is not a conflict. */
    if (f.free > 0) return null;
    hits.sort((a,b)=> Number(a.fromAt) - Number(b.fromAt));
    return hits[0];
  },

  /* Models with capacity in the window, for the "offer something else" panel. */
  bookAlternatives(rateId, from, to){
    return (DB.d.rates||[])
      .filter(r => r.id !== rateId && this.rateReady(r))
      .map(r => ({ rate:r, f:this.bookFree(r.id, from, to) }))
      .filter(x => x.f.free > 0)
      .sort((a,b)=> b.f.free - a.f.free)
      .slice(0,3);
  },

  /* The soonest time this model has capacity, scanning day by day. Cheap: at
     most 21 evaluations of an in-memory filter. */
  bookNextFree(rateId, from, to){
    const span = to - from;
    for (let d=1; d<=21; d++){
      const f2 = from + d*24*HOUR;
      if (this.bookFree(rateId, f2, f2+span).free > 0) return f2;
    }
    return null;
  },

  /* ── first bike ──────────────────────────────────────────────────
     A rate card cannot be chosen before one exists, so the first bike collects
     its own price and writes both records together. Three price fields only:
     deposit, a 24-hour rate and overtime. The 3, 6, 12-hour and weekly tiers
     are real and stay in Rates — a shop that needs them will go looking, and
     one that does not should not have to type five zeros to open for business. */
  firstBike(){
    /* Which list depends on what the shop said it rents. A car yard offered
       Activa and Jupiter would conclude the app is not for it. */
    const k = this._addKind || (rentKind()==='car' ? 'car' : 'bike');
    this._addKind = k;
    const src = k==='car' ? (window.CAR_SUGGESTIONS||[]) : (window.MODEL_SUGGESTIONS||[]);
    const chips = src.map(m =>
      `<span class="chip" onclick="R.pickModel('${esc(m)}')">${esc(m)}</span>`).join('');
    openSheet(`
      <div class="sheet-hd"><h2>Add your first ${noun(0,k)}</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>

      <div class="fld"><label class="lbl">${Noun()} name <span class="req">*</span></label>
        <input class="in" id="fb-name" placeholder="${k==='car'?'Swift':'Activa 5G'}" autocomplete="off"></div>
      <div class="muted" style="margin:-4px 2px 6px">Common models \u2014 tap to fill, or type your own</div>
      <div class="chips" id="fb-chips">${chips}</div>

      <div class="fld" style="margin-top:12px"><label class="lbl">Vehicle no.
        <span class="muted">optional</span></label>
        <input class="in" id="fb-reg" placeholder="MP04 AB 1234" autocapitalize="characters"></div>

      <div class="card" style="background:var(--y-tint);border-color:var(--y-bd);padding:13px 12px">
        <b style="font-size:13.5px">What do you charge for it?</b>
        <div class="muted" style="margin:2px 0 4px">This becomes the rate card for every ${noun()} of
          this model you add later.</div>
        ${this.rateFields('fb', null)}
      </div>

      <button class="btn" onclick="R.saveFirstBike()">Save ${noun()} &amp; price</button>
      ${this.isOwner() ? `<button class="btn ghost" style="margin-top:9px" onclick="closeSheet();R.scanRates()">
        \u{1F4F7} I have a printed rate card \u2014 photograph it</button>` : ''}
      <div class="muted" style="text-align:center;margin-top:9px">You can add more bikes and more
        rates any time.</div>`);
  },
  pickModel(m){
    const el = document.getElementById('fb-name') || document.getElementById('v-name');
    if (el){ el.value = m; }
    /* Mark the tapped chip so the choice is visible after the keyboard covers
       the field. Not focusing the input on purpose: on Android that throws the
       keyboard up and hides the rest of the sheet, and the shop still has a
       deposit and two prices to fill in below. */
    document.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('on', (c.textContent||'').trim() === m));
    Haptic.tap();
  },
  saveFirstBike(){
    const g = i => document.getElementById(i);
    const name = (g('fb-name').value||'').trim();
    const reg  = (g('fb-reg').value||'').trim().toUpperCase();
    if (!name) return toast(Noun()+' name is required');
    const rt = this.readRate('fb');
    if (!rt) return;
    const dep = rt.deposit, d24 = rt.tiers.h24;
    /* Deposit of zero is a legitimate choice — plenty of shops take none — so
       it is not validated. A 24-hour price of zero is, because rateReady() would
       then refuse to let the bike out and we would be back at the screen this
       whole change exists to remove. */
    /* Same persistence path saveVehicle() and saveRate() use — Cloud.put when
       signed in, local push otherwise. Written by hand rather than reused
       because the rate card must land before the vehicle that points at it. */
    const rateRec = { model: name, deposit: rt.deposit, tiers: rt.tiers, ot: rt.ot };
    if (window.Cloud && Cloud.ready){
      const rid = Cloud.nid('rc');
      const vid = Cloud.nid('v');
      const vehRec = { name, regNo: reg, rateId: rid, model: name,
        status:'available', cost:0, insExpiry:'', pucExpiry:'', odo:0 };
      /* BUG FIX: local state was left empty until the Firestore listener echoed
         back, so render() ran with zero bikes and painted the welcome screen
         again. The shop saved its first bike and watched the setup screen
         reappear, which reads exactly like the save failing.
         
         The listener replaces these arrays wholesale, so an optimistic copy
         cannot duplicate anything. */
      DB.d.rates.push(Object.assign({ id: rid }, rateRec));
      DB.d.vehicles.push(Object.assign({ id: vid }, vehRec));
      Cloud.put('rates', rid, rateRec).then(w => {
        if (!w.ok){
          DB.d.rates = DB.d.rates.filter(r => r.id !== rid);
          DB.d.vehicles = DB.d.vehicles.filter(v => v.id !== vid);
          DB.save(); R.render();
          return toast('Could not save \u2014 ' + Cloud.explainWrite(w.code));
        }
        return Cloud.put('vehicles', vid, vehRec).then(w2 => {
          if (!w2.ok) toast(Cloud.explainWrite(w2.code));
        });
      });
    } else {
      const rid = DB.id('rc');
      DB.d.rates.push(Object.assign({ id: rid }, rateRec));
      DB.d.vehicles.push({ id: DB.id('v'), name, regNo: reg, rateId: rid, model: name,
        status:'available', cost:0, insExpiry:'', pucExpiry:'', odo:0 });
    }
    DB.save();
    Haptic.success();
    closeSheet();
    toast(name + ' added at ' + money(d24) + ' for 24 hr');
    this.render();
  },

  rateSel(){
    const sel = document.getElementById('v-rate');
    const box = document.getElementById('v-newrate');
    if (!sel || !box) return;
    box.style.display = sel.value === '__new' ? 'block' : 'none';
    if (sel.value === '__new'){
      /* Prefill the model name from the bike name — for a first bike of a model
         they are the same thing, and retyping it is friction for no reason. */
      const nm = document.getElementById('v-name');
      const d24 = document.getElementById('vnr-h24');
      if (nm && d24 && !d24.value) d24.focus();
    }
  },

  saveVehicle(id){
    const name = document.getElementById('v-name').value.trim();
    const reg  = document.getElementById('v-reg').value.trim().toUpperCase();
    let rateId = document.getElementById('v-rate').value;
    if (!name) return toast(Noun()+' name is required');
    if (!rateId) return toast('Choose a rate card');

    /* "+ New rate" creates the card first, then falls through to the normal
       save with its id. Doing it here rather than in a second sheet keeps the
       name and number the shop already typed. */
    if (rateId === '__new'){
      const rt = this.readRate('vnr');
      if (!rt) return;
      const rateRec = { model: name, deposit: rt.deposit, tiers: rt.tiers, ot: rt.ot };
      if (window.Cloud && Cloud.ready){
        rateId = Cloud.nid('rc');
        /* BUG FIX: this used to fire the rate write and carry straight on to the
           vehicle write. If the rate write failed — offline, or an owner-only
           rules refusal for a manager — the bike saved anyway, pointing at a
           rate card that does not exist. The shop got a permanent "no rate
           card" bike and no explanation.
           
           Now the vehicle write is queued from inside the rate's callback, so a
           failed rate means no orphan. Local state is still updated
           immediately so the sheet can close without waiting. */
        this._pendingRate = { id: rateId, rec: rateRec };
        DB.d.rates.push(Object.assign({ id: rateId }, rateRec));
      } else {
        rateId = DB.id('rc');
        DB.d.rates.push(Object.assign({ id: rateId }, rateRec));
      }
    }
    /* Reg is optional now, so NAME is the identity. Only guard duplicates on
       whichever one the shop actually filled in. */
    if (reg && DB.d.vehicles.some(x=>x.regNo===reg && x.id!==id))
      return toast('That vehicle number already exists');
    if (!reg && DB.d.vehicles.some(x=>x.name===name && x.id!==id))
      return toast('A '+noun()+' with that name already exists — add a number or change the name');
    const rc = DB.d.rates.find(r=>r.id===rateId);
    const g = i => document.getElementById(i);
    const old = id ? DB.d.vehicles.find(x=>x.id===id) : null;
    const rec = {
      name, regNo: reg, rateId, model: rc?rc.model:'',
      status: g('v-status') ? g('v-status').value : (old?old.status:'available'),
      cost: g('v-cost') ? (Number(g('v-cost').value)||0) : (old?old.cost:0),
      insExpiry: g('v-ins') ? g('v-ins').value : (old?old.insExpiry:''),
      pucExpiry: g('v-puc') ? g('v-puc').value : (old?old.pucExpiry:''),
      odo: old ? (old.odo||0) : 0,
    };
    if (window.Cloud && Cloud.ready){
      const vid = id || Cloud.nid('v');
      const pend = this._pendingRate; this._pendingRate = null;
      /* If a rate card was created in this same save, it has to land first —
         otherwise a failed rate leaves a bike pointing at nothing. */
      const writeVeh = () => Cloud.put('vehicles', vid, rec).then(w => {
        if (!w.ok) toast(Cloud.explainWrite(w.code));
      });
      if (pend){
        Cloud.put('rates', pend.id, pend.rec).then(w => {
          if (!w.ok){
            /* Roll the optimistic copy back so the UI does not show a rate the
               server rejected, and do NOT create the bike. */
            DB.d.rates = DB.d.rates.filter(r => r.id !== pend.id);
            DB.save(); R.render();
            return toast('Could not save the rate \u2014 ' + Cloud.explainWrite(w.code));
          }
          return writeVeh();
        });
      } else { writeVeh(); }
    } else if (id){ Object.assign(DB.d.vehicles.find(x=>x.id===id), rec); }
    else { DB.d.vehicles.push(Object.assign({ id: DB.id('v') }, rec)); }
    DB.save(); closeSheet(); this.render(); toast(id?'Bike updated':'Bike added');
  },

  /* ── clean up the old seeder's leftovers ─────────────────────────
     Removing seed() from createShop() stops NEW shops getting ten phantom
     bikes; it does nothing for shops that already have them sitting in
     Firestore. This finds them and takes them out.

     Deliberately conservative about what counts as a leftover: the rate card
     must be unpriced, and the bike must never have been rented. A bike with
     any rental history is somebody's real record and is left alone whatever
     its price says. Everything is soft-deleted — the rules forbid a hard
     delete, and history should survive anyway. */
  starterJunk(){
    const rates = DB.d.rates||[];
    return (DB.d.vehicles||[]).filter(v => {
      if (v.deletedAt) return false;
      if ((DB.d.rentals||[]).some(r => r.vehicleId === v.id)) return false;
      const rc = rates.find(r => r.id === v.rateId);
      return rc && !this.rateReady(rc);
    });
  },
  clearStarters(){
    if (!this.isOwner()) return toast('Only the owner can do this');
    const junk = this.starterJunk();
    if (!junk.length) return toast('Nothing to remove');
    if (!confirm('Remove ' + junk.length + ' unpriced bike' + (junk.length===1?'':'s') +
      ' that have never been rented?\n\nRate cards for them go too. Nothing with rental ' +
      'history is touched.')) return;
    const rids = new Set();
    junk.forEach(v => {
      if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', v.id);
      if (v.rateId) rids.add(v.rateId);
    });
    /* A rate card only goes if no surviving bike still points at it. */
    const keep = new Set((DB.d.vehicles||[])
      .filter(v => !junk.some(j => j.id === v.id))
      .map(v => v.rateId));
    rids.forEach(rid => {
      if (keep.has(rid)) return;
      if (window.Cloud && Cloud.ready) Cloud.softDelete('rates', rid);
      DB.d.rates = (DB.d.rates||[]).filter(r => r.id !== rid);
    });
    const ids = new Set(junk.map(v => v.id));
    DB.d.vehicles = (DB.d.vehicles||[]).filter(v => !ids.has(v.id));
    DB.save(); this.render();
    toast('Removed ' + junk.length + ' unpriced bike' + (junk.length===1?'':'s'));
  },

  delVehicle(id){
    if (DB.d.rentals.some(r=>r.vehicleId===id && r.status==='open'))
      return toast('This vehicle is out — check it in first');
    if (!confirm('Remove this bike? Past rentals stay in your records.')) return;
    /* soft delete only — nothing is ever destroyed */
    if (window.Cloud && Cloud.ready) Cloud.softDelete('vehicles', id);
    DB.d.vehicles = DB.d.vehicles.filter(x=>x.id!==id);
    DB.save(); closeSheet(); this.render(); toast(Noun()+' removed');
  },

  /* ── RATE CARDS ─────────────────────────────────────────────────── */
  renderRates(){

    const hdr =
      /* The centre button used to be the only way to create a rate card. Now

      (this.isOwner() ? `<button class="btn" style="margin-bottom:9px" onclick="R.editRate()">

  /* ── read a rate card from a photo ────────────────────────────────
     The shop hands over a printed price list; typing 10 models x 7 numbers
     is the single most tedious part of onboarding and the easiest place to
     fat-finger a price. Photograph it instead — then CONFIRM every figure,
     because a misread 620 as 820 costs money on every rental until someone

  ratesTable(hdr){
