  /* ══════════════════════════════════════════════════════════════════
     PLANS
     Priced by fleet size, because a 15-bike shop and a 150-bike operator
     get very different value from identical software. Kept as data so the
     price can change without touching any logic.

     Annual is priced at ten months for twelve — the shape everyone already
     understands ("pay for ten, use twelve") and the one that matters most
     in a seasonal trade, where a monthly customer cancels in the quiet
     months and an annual one rides them out.
     ══════════════════════════════════════════════════════════════════ */
  PLANS: [
    { id:'starter', name:'Starter', bikes:15,  m:499,  y:4990  },
    { id:'growth',  name:'Growth',  bikes:50,  m:1299, y:12990 },
    { id:'pro',     name:'Pro',     bikes:150, m:2499, y:24990 },
    { id:'multi',   name:'Multi-branch', bikes:null, m:4999, y:49990 },
  ],
  _billing: 'y',

  /* Suggest the plan that actually fits their yard, rather than making a
     shopkeeper work out which bracket he is in. */
  fleetCount(){ return (DB.d.vehicles||[]).filter(v=>!v.deletedAt).length; },
  suggestedPlan(){
    const n = this.fleetCount();
    return this.PLANS.find(p => p.bikes === null || n <= p.bikes) || this.PLANS[this.PLANS.length-1];
  },
  planById(id){
    const k = String(id||'').toLowerCase();
    return this.PLANS.find(p => p.id === k) || null;
  },
  /* Position in PLANS is the price ladder, so it doubles as upgrade order.
     -1 means "no tier we recognise" — which the UI must treat as unknown
     rather than as the cheapest plan. */
  planRank(id){
    const k = String(id||'').toLowerCase();
    return this.PLANS.findIndex(p => p.id === k);
  },
  /* Never invents a tier name. If the webhook did not record which plan was
     bought, the shop is told it is paid and nothing more. */
  planLabel(t){
    const p = t && t.tier ? this.planById(t.tier) : null;
    return p ? p.name + ' plan' : 'Paid plan';
  },
  cycleLabel(t){
    if (!t || !t.cycle) return '';
    return /ann|year/.test(t.cycle) ? 'yearly' : 'monthly';
  },

  plans(){
    const fleet = this.fleetCount();
    const sug = this.suggestedPlan();
    const t = (window.Cloud && Cloud.ready) ? Cloud.trialInfo() : null;
    /* -1 when unpaid OR when the webhook recorded no tier. Both mean "we do
       not know what he is on", and in both cases every plan stays buyable —
       guessing would either hide the plan he needs or offer him his own. */
    const curRank = (t && t.paid && t.tier) ? this.planRank(t.tier) : -1;
    const yearly = this._billing === 'y';
    openSheet(`
      <div class="sheet-hd"><h2>Plans</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>

      ${t && t.paid ? `<div class="card" style="background:${t.renewSoon?'var(--y-tint)':'var(--success-tint)'};
        border-color:${t.renewSoon?'var(--y-bd)':'#B7ECD1'}">
        <b style="font-size:13.5px;color:${t.renewSoon?'#95610A':'var(--success-d)'}">${esc(this.planLabel(t))} active
          · ${t.subDaysLeft} day${t.subDaysLeft===1?'':'s'} left</b>
        <div class="muted" style="margin-top:3px">Changing plan is done by hand so the days you
          have already paid for are not lost. Tap any plan and we will set it up.</div>
      </div>` : ''}

      ${t && !t.paid ? `<div class="card" style="background:${t.active?'var(--y-tint)':'var(--danger-tint)'};
        border-color:${t.active?'var(--y-bd)':'var(--danger)'}">
        <b style="font-size:13.5px">${t.active
          ? t.trialDaysLeft + ' day' + (t.trialDaysLeft===1?'':'s') + ' left in your trial'
          : (t.tier && t.subEnds && this.planById(t.tier)
              ? 'Your ' + esc(this.planById(t.tier).name) + ' plan has ended'
              : 'Your trial has ended')}</b>
        <div class="muted" style="margin-top:3px">${t.active
          ? 'Everything keeps working. Renting out pauses when it ends — returns never do.'
          : 'Returns and settlements still work, so no customer is left stranded. Renting out is paused.'}</div>
      </div>` : ''}

      <div class="pl-toggle">
        <button class="${yearly?'':'on'}" onclick="R.setBilling('m')">Monthly</button>
        <button class="${yearly?'on':''}" onclick="R.setBilling('y')">Yearly <span>2 months free</span></button>
      </div>

      <div class="muted" style="margin:0 2px 12px">You have <b>${fleet}</b> ${noun(fleet!==1)}.</div>

      <div style="margin:0 2px 14px">
        <div class="row" style="gap:8px">
          <input class="in" id="pl-code" placeholder="Promo code" autocomplete="off"
            value="${this._promo?esc(this._promo.code):''}" ${this._promo?'disabled':''}
            onkeydown="if(event.key==='Enter'){R.applyPromo();}"
            style="flex:1;border-style:dashed;border-color:var(--y);text-transform:uppercase;letter-spacing:.04em">
          <button class="btn sm" style="background:var(--p-deep)" onclick="R.applyPromo()">Apply</button>
        </div>
        <div class="muted" id="pl-msg" style="margin-top:8px;display:${this._promoMsgPending?'block':'none'};
          color:${this._promoMsgOk===true?'var(--success-d)':(this._promoMsgOk===false?'var(--danger)':'var(--t3)')}"
          >${this._promoMsgPending||''}</div>
      </div>

      ${this.PLANS.map(p=>{
        const list = yearly ? p.y : p.m;
        const cut  = (this._promo && this._promo.prices && typeof this._promo.prices[p.id] === 'number')
                     ? this._promo.prices[p.id] : null;
        const price = cut === null ? list : cut;
        const rank  = this.planRank(p.id);
        const isCur = curRank >= 0 && rank === curRank;
        /* A plan that cannot hold the bikes he already owns is not a choice,
           it is a mis-sale waiting for a refund request. */
        const tooSmall = p.bikes !== null && fleet > p.bikes;
        const isSug = !isCur && !tooSmall && p.id === sug.id;
        let cls = 'ghost', label = 'Choose ' + p.name, dis = '';
        if (isCur){
          label = t.subEnds ? 'Active until ' + fmtDay(t.subEnds) : 'Your current plan';
          dis = 'disabled';
        } else if (tooSmall){
          label = 'Too small for ' + fleet + ' ' + noun(fleet!==1);
          dis = 'disabled';
        } else if (curRank >= 0 && rank > curRank){
          cls = ''; label = 'Upgrade to ' + p.name;
        } else if (curRank >= 0){
          label = 'Switch to ' + p.name;
        } else if (isSug){
          cls = '';
        }
        const wanted = this._wantPlan === p.id;
        return `<div class="pl ${isCur?'cur':(isSug?'sug':'')}"${wanted
          ? ' style="outline:2.5px solid var(--y);outline-offset:2px"' : ''}>
          ${isCur?'<div class="pl-tag cur">YOUR PLAN</div>'
                 :(isSug?'<div class="pl-tag">Fits your fleet</div>':'')}
          <div class="row">
            <div class="grow">
              <div class="pl-n">${p.name}</div>
              <div class="muted">${p.bikes ? 'Up to '+p.bikes+' bikes' : 'Unlimited · multiple branches'}</div>
            </div>
            <div style="text-align:right">
              ${cut!==null?`<div class="muted" style="font-size:12px;text-decoration:line-through">${money(list)}</div>`:''}
              <div class="pl-p" style="${cut!==null?'color:var(--success-d)':''}">${money(price)}</div>
              <div class="muted" style="font-size:11px">${yearly?'per year':'per month'}</div>
              ${cut!==null
                ? `<div class="pl-save">${esc(this._promo.code)}</div>`
                : (yearly?`<div class="pl-save">save ${money(p.m*12 - p.y)}</div>`:'')}
            </div>
          </div>
          <button class="btn ${cls}" style="margin-top:11px" ${dis}
            onclick="R.choosePlan('${p.id}')">${esc(label)}</button>
        </div>`;
      }).join('')}

      <div class="muted" style="margin:14px 2px 0;line-height:1.55">
        Every plan includes all features, unlimited staff and unlimited rentals.
        Prices exclude GST.</div>
    `);
  },
  setBilling(b){
    this._billing = b; Haptic.tap();
    /* A code can be valid yearly and not monthly. Dropping it on a cycle
       switch is the honest move — silently carrying a yearly-only discount
       onto monthly prices would show a number PayU refuses to honour. */
    if (this._promo && this._promo.cycle !== (b === 'y' ? 'annual' : 'monthly')){
      this._promo = null;
      this._promoMsgPending = 'Promo code cleared \u2014 re-apply it for this billing period.';
      this._promoMsgOk = null;
    }
    this.plans();
  },

  async choosePlan(id){
    const p = this.PLANS.find(x=>x.id===id); if (!p) return;
    if (!this.isManager()) return toast('Ask the owner to pay for the plan');
    /* Nothing upstream stops this. The server prices whatever tier it is
       handed and the webhook overwrites the expiry it finds — so a second
       purchase of the same tier, mid-term, is real money for zero extra
       days. The disabled button is UX; this is the actual guard. */
    const ti = (window.Cloud && Cloud.ready) ? Cloud.trialInfo() : null;
    if (ti && ti.paid && ti.tier === p.id && !ti.renewSoon)  /* lapsed shops fall through: paid is false */
      return toast('You are already on ' + p.name + ' until ' +
        (ti.subEnds ? fmtDay(ti.subEnds) : 'later'));
    /* A tier change mid-term is not something to hand to a payment gateway
       yet. PayU would take the new plan's full price and the webhook would
       overwrite the expiry, silently burning whatever the shop had already
       paid for. Until that is settled server-side, an upgrade goes to a
       person who can do it properly. Renewing the SAME tier still goes
       straight through, because it is only offered near the end of the term
       when there is nothing left to lose. */
    if (ti && ti.paid && ti.tier && ti.tier !== p.id) return this.planChangeHelp(p.id);
    const fleet = this.fleetCount();
    if (p.bikes !== null && fleet > p.bikes)
      return toast(p.name + ' covers ' + p.bikes + ' bikes — you have ' + fleet);
    Haptic.primary();
    const yearly = this._billing === 'y';
    /* Straight to PayU. The code, if one is applied and valid for THIS tier,
       rides along as a string — the server re-prices it and decides the
       amount. A promo that does not cover this plan is simply not sent. */
    const promo = (this._promo && this._promo.prices &&
                   typeof this._promo.prices[p.id] === 'number') ? this._promo.code : null;
    const shown = promo ? this._promo.prices[p.id] : (yearly ? p.y : p.m);
    openSheet(`<div class="sheet-hd"><h2>Opening payment\u2026</h2></div>
      <div class="empty"><div class="e">\u{1F4B3}</div><b>Taking you to PayU</b>
      <span>${esc(p.name)} \u00b7 ${money(shown)} ${yearly?'per year':'per month'}${
        promo?' \u00b7 '+esc(promo):''}</span></div>`);
    const res = await Cloud.startCheckout(p.id, yearly ? 'annual' : 'monthly', promo);
    if (!res.ok){
      Haptic.error();
      openSheet(`<div class="sheet-hd"><h2>Could not start payment</h2>
        <button class="btn ghost sm" onclick="closeSheet()">Close</button></div>
        <div class="card" style="${res.wrongProduct?'background:var(--y-tint);border-color:var(--y-bd)':''}">
          <div class="muted">${esc(res.msg||'Please try again.')}</div>
          ${res.wrongProduct?'<div class="muted" style="margin-top:6px">No payment was started, so nothing could be charged to the wrong plan.</div>':''}
        </div>
        <button class="btn" onclick="R.payHelp('${esc(id)}')">Pay on WhatsApp instead</button>`);
    }
  },

  /* ── promo codes, on the plans list ──────────────────────────────────
     One field above the four cards rather than one per card. A code is
     checked against every plan at once, so the list itself re-prices and a
     shopkeeper can see which plans the code actually covers instead of
     discovering it after picking one.

     _promo.prices is a map of tier -> discounted price, holding only the
     tiers the code is valid for. A tier missing from that map keeps its list
     price and buys at list price. */
  _promo: null,

  async applyPromo(){
    const inp = document.getElementById('pl-code');
    const code = ((inp && inp.value) || '').trim().toUpperCase();
    if (!code) return this._plMsg('Enter a promo code', false);
    const cycle = this._billing === 'y' ? 'annual' : 'monthly';
    this._plMsg('Checking\u2026', null);
    /* Four checks in parallel, because the answer differs per plan and the
       shopkeeper should not have to tap four times to find that out. */
    const res = await Promise.all(this.PLANS.map(p =>
      Cloud.checkPromo(p.id, cycle, code).then(d => ({ id:p.id, d }))));
    const prices = {}; let anyReason = '';
    res.forEach(r => {
      if (r.d && r.d.valid && typeof r.d.finalPrice === 'number') prices[r.id] = r.d.finalPrice;
      else if (!anyReason && r.d && r.d.reason) anyReason = r.d.reason;
    });
    const hits = Object.keys(prices);
    if (!hits.length){
      this._promo = null; Haptic.error();
      this._promoMsgPending = esc(anyReason || 'Invalid or expired code');
      this._promoMsgOk = false;
      return this._plMsg(this._promoMsgPending, false);
    }
    this._promo = { code, prices, cycle };
    Haptic.success();
    const names = hits.map(h => (this.planById(h)||{}).name).filter(Boolean).join(', ');

  /* Coming back from PayU: say what happened. The webhook is the source of
     truth, so a success here is confirmed by the shop document updating —
     we do not take the redirect's word for it. */
  /* ?plan=growth&cycle=annual — arriving from a pricing card on the landing
     page. Opens the Plans sheet with that billing period already chosen and
     the plan marked, rather than dropping someone who just tapped a price on
     a dashboard with no mention of it.

     It deliberately does NOT jump to PayU. A visitor from a marketing page may
     not have signed in, may not have a shop yet, and has certainly not agreed
     to be charged by tapping a price on a webpage. */
  planDeepLink(){
    try {
      const q = new URLSearchParams(location.search);
      const want = String(q.get('plan') || '').toLowerCase();
      if (!want) return;
      const cyc = String(q.get('cycle') || 'annual').toLowerCase();
      history.replaceState({}, '', location.pathname);
      if (!this.planById(want)) return;
      this._billing = /month/.test(cyc) ? 'm' : 'y';
      this._wantPlan = want;
      /* Waits for sign-in. Cloud.ready is false while the OTP gate is up, and
         a plans sheet over the phone-number screen helps nobody. */
      const open = () => {
        if (!(window.Cloud && Cloud.ready)) return setTimeout(open, 600);
        this.plans();

      setTimeout(open, 900);

  /* ── history: paged query, never a live listener ─────────────────
     Closed rentals grow without bound, so this is the one screen that
     must never load "everything". */
  async history(reset){
    if (!window.Cloud || !Cloud.ready) return toast('Sign in to see history');
    if (reset) this._h = { rows: [], cursor: null, done: false };
    const st = this._h = this._h || { rows: [], cursor: null, done: false };
    if (st.done) return;
    try {
      const res = await Cloud.history(st.cursor, 25);
      st.rows = st.rows.concat(res.rows);
      st.cursor = res.cursor;
      if (!res.rows.length || res.rows.length < 25) st.done = true;
    } catch(e){ console.error(e); return toast('Could not load history — index may still be building'); }
    this.historySheet();
  },

        st.rows.map(r=>{
          const v = DB.d.vehicles.find(x=>x.id===r.vehicleId);
          const isVoid = !!r.voidedAt || r.status === 'cancelled';
          return `<div class="card tap" onclick="R.bill('${esc(r.id)}')"

              <div class="muted" style="margin-top:3px">${r.outAt?fmtDT(r.outAt):''} → ${r.returnedAt?fmtDT(r.returnedAt):''}

  topAction(){

  render(){
    const titles = { out:'Out Now', fleet:'Fleet', rates:'Rate cards', money:'Money' };
    /* One meaning on every tab. It used to read Add bike on Fleet and Add rate
       on Rates — duplicating the button already at the top of those lists, and

    const acts   = { out:'Rent out', fleet:'Rent out', rates:'Rent out', money:'Rent out' };
    document.getElementById('top-title').textContent = titles[this.page];
    const biz = document.getElementById('top-biz');
    if (biz) biz.textContent = (window.Cloud && Cloud.shopName) || 'RentalNow';
    const cl = document.getElementById('nv-cta-l');
    if (cl) cl.textContent = acts[this.page] || 'Rent out';
    /* Dim it when there is genuinely nothing to rent, rather than letting a
       shopkeeper tap the biggest button on screen and be told no. */
    const cta = document.getElementById('nv-cta');
    /* Never dimmed. It used to grey out whenever no bike was available, which
       for a one- or two-bike shop is most of the working day — the button went
       dead exactly when the app was doing its job, and a dead primary action
       reads as a broken app rather than a considerate one.
       
       checkoutStart() already refuses politely and says why, which is a better
       answer than a grey circle that says nothing. */
    if (cta) cta.classList.remove('off');
    /* The sidebar mirrors the bottom nav rather than replacing it: same page
       state, same counts, so whichever one the screen is showing is right. */
    const held = (DB.d.bookings||[]).filter(b=>b.status==='held').length;
    const openN = (DB.d.rentals||[]).filter(r=>r.status==='open').length;
    const setTx = (id,v) => { const e=document.getElementById(id); if (e) e.textContent = v||''; };
    setTx('sv-out-c',   openN||'');

    if (sb) sb.firstChild && (sb.firstChild.nodeValue = (window.Cloud && Cloud.shopName) || 'RentalNow');

  /* ── OUT NOW ────────────────────────────────────────────────────── */
  /* ── onboarding ───────────────────────────────────────────────────
     State is derived from the data, never stored. There is no `onboarded`
     flag to fall out of step with reality: delete the only bike and step 1
     comes back, which is correct. It also needs no migration, works the same
     on a second phone, and cannot claim a shop is set up when it owns
     nothing. */
  obState(){
    const veh   = (DB.d.vehicles||[]).filter(v=>!v.deletedAt);
    const rates = (DB.d.rates||[]);
    /* DB.d.rentals is bound to a LIVE listener scoped to status=='open' —
       deliberately, so it never grows with the age of the business (see
       Cloud.open()). That means the instant a shop's first rental is
       settled, DB.d.rentals goes straight back to empty, and reading
       "rented" off its length made the whole onboarding card reappear —
       forever, for every shop, the moment they closed their first rental.
       The step needed something that stays true once true. Cloud already
       writes a rollup to /daily on every settle, so any row there at all
       means a rental has happened at some point; that document does not
       depend on which rentals are still open. */
    const everRented = (DB.d.daily||[]).length > 0
      || (DB.d.rentals||[]).length > 0
      || (function(){ try { return localStorage.getItem('rn_ever_rented')==='1'; } catch(e){ return false; } })();
    return {
      bikes:   veh.length > 0,
      priced:  rates.some(r => this.rateReady(r)),
      rented:  everRented,
      nBikes:  veh.length,
      firstReady: (veh.find(v => { const rc = rates.find(r=>r.id===v.rateId);
                                   return rc && this.rateReady(rc); }) || null)
    };
  },
  obDone(){ const o=this.obState(); return o.bikes && o.priced && o.rented; },

  obCard(){
    if (!this.isManager()) return '';          /* setup is the owner's job */
    const o = this.obState();
    if (o.bikes && o.priced && o.rented){
      /* BUG FIX: obDismiss() wrote rn_ob_done to localStorage and nothing ever
         read it, so "Got it" lasted until the next reload and the congratulations
         card came back for ever. */
      if (this._obDismissed) return '';
      try { if (localStorage.getItem('rn_ob_done')) { this._obDismissed = true; return ''; } } catch(e){}
      return `<div class="card" style="background:var(--success-tint);border-color:#B7ECD1">
        <div class="row"><b class="grow" style="font-size:13.5px">Your shop is set up \u{1F389}</b>
          <button class="btn ghost sm" onclick="R.obDismiss()">Got it</button></div>
        <div class="muted" style="margin-top:3px">Add the rest of your bikes whenever you have a
        minute \u2014 Fleet, then Add a ${noun()}.</div></div>`;
    }
    const pct = (o.bikes?33:4) + (o.priced?33:0) + (o.rented?34:0);
    const step = (n,label,state) => `<div class="row" style="gap:9px;padding:5px 0;font-size:13px;
        font-weight:${state==='now'?'800':'700'};color:${
          state==='done'?'#9FBACD':(state==='now'?'#fff':'#7E9AAE')}">
      <span style="width:20px;height:20px;border-radius:99px;flex:0 0 auto;display:flex;
        align-items:center;justify-content:center;font-size:10px;font-weight:900;
        background:${state==='done'?'var(--success)':(state==='now'?'var(--y)':'rgba(255,255,255,.14)')};
        color:${state==='done'?'#04361D':(state==='now'?'#0A0A0A':'#fff')}">${
          state==='done'?'\u2713':n}</span>${label}</div>`;
    const s1 = o.bikes ? 'done' : 'now';
    const s2 = o.priced ? 'done' : (o.bikes ? 'now' : 'todo');
    const s3 = o.rented ? 'done' : ((o.bikes&&o.priced) ? 'now' : 'todo');
    let cta;
    if (!o.bikes)       cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.firstBike()">Add your first ${noun()}</button>`;
    else if (!o.priced) cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.nav('rates')">Set what you charge</button>`;
    else                cta = `<button class="btn" style="background:var(--y);color:#0A0A0A"
                                onclick="R.checkoutStart()">Rent out ${
                                  esc((this.obState().firstReady||{}).name||'a bike')}</button>`;
    return `<div style="background:linear-gradient(160deg,#12466A,#0A2C43);color:#fff;
        border-radius:14px;padding:14px;margin-bottom:11px">
      <div style="font-size:14px;font-weight:875;letter-spacing:-.02em">${
        o.bikes ? 'Almost there' : 'Set up your shop'}</div>
      <div style="font-size:11.5px;color:#BFD4E2;margin-top:2px">${
        o.bikes ? (o.priced ? 'One step left.' : 'Two steps left.') : 'Three steps. About two minutes.'}</div>
      <div style="height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:11px 0 10px;overflow:hidden">
        <i style="display:block;height:100%;width:${pct}%;background:var(--y);border-radius:99px"></i></div>
      ${step(1, o.bikes ? (o.nBikes===1?'1 '+noun()+' added':o.nBikes+' '+noun(1)+' added') : 'Add your first bike', s1)}
      ${step(2, o.priced ? 'Prices set' : 'Check the prices', s2)}
      ${step(3, o.rented ? 'First rental done' : 'Rent it out', s3)}
      <div style="margin-top:11px">${cta}</div></div>`;
  },
  /* The first screen after a new shop signs in. Deliberately the only thing on
     it: a shop that owns nothing has exactly one useful next action, and every
     extra card on this screen is a chance to pick the wrong one. */
  /* ── what do you rent? ────────────────────────────────────────────
     Asked once, straight after the shop exists. Ninety-odd percent of yards
     rent one kind, so asking here means never asking again on the screen
     they use forty times a week.

     existing shop must never meet this screen. */
  needsKind(){
    if (!(window.Cloud && Cloud.ready && Cloud.shop)) return false;
    if (Cloud.shop.rentKind) return false;

        <span class="e">${ic}</span>

        ${this._kindPick===k?'<span class="tick">\u2713</span>':''}
      </div>`;
    return `
      <div class="wl" style="padding-top:20px">
        <h2>What do you rent out?</h2>
        <p>So the app uses your words and asks the right questions.</p>
      </div>
      <div style="margin-top:16px">
        ${opt('bike','\u{1F6F5}','Bikes &amp; scooters','Activa, Jupiter, Pulsar')}

      <div class="wl-foot">You can change this later, and adding a car to a bike shop just works.</div>`;
  },

  pickKind(k){ this._kindPick = k; Haptic.tap(); this.render(); },

        ${step(1,'Add your first '+noun(),'Name it and set what you charge','now')}

      </div>

        \u2014 photograph it</div>` : ''}

        : (t && t.active ? t.trialDaysLeft + ' days free left \u00b7 no card needed'
        : '14 days free \u00b7 no card needed')}</div>`;
  },

  /* ── desktop ──────────────────────────────────────────────────────
     One number, one place. Renderers ask isWide() rather than each carrying
     its own breakpoint, so the CSS and the JavaScript cannot drift apart
     about where desktop begins. */
  WIDE_AT: 1024,
  isWide(){ return window.innerWidth >= this.WIDE_AT; },

  sideToggle(){
    const mini = !document.body.classList.contains('side-mini');
    document.body.classList.toggle('side-mini', mini);
    const s = document.getElementById('side');
    if (s) s.classList.toggle('mini', mini);
    const a = document.querySelector('.side-tog .a');
    if (a) a.textContent = mini ? '\u00BB' : '\u00AB';
    try { localStorage.setItem('rn_side_mini', mini ? '1' : ''); } catch(e){}
  },
  sideRestore(){
    let mini = false;
    try { mini = !!localStorage.getItem('rn_side_mini'); } catch(e){}
    if (mini){
      document.body.classList.add('side-mini');
      const s = document.getElementById('side'); if (s) s.classList.add('mini');
      const a = document.querySelector('.side-tog .a'); if (a) a.textContent = '\u00BB';
    }
  },
  /* Crossing the breakpoint changes which renderer is correct, so a resize has
     to re-render — but only when it actually crosses, not on every pixel of a
     window drag. */
  _wasWide: null,
  onResize(){
    const w = this.isWide();
    if (w === this._wasWide) return;
    this._wasWide = w;
    this.render();
  },

  /* ── selection ────────────────────────────────────────────────────
     A Set of ids, cleared on every tab change, filter change and completed
     action. Selection that survives a filter is selection nobody can audit:
     the shop ticks three rows, filters to something else, and acts on rows it
     can no longer see. */
  _sel: null,
  selHas(id){ return !!(this._sel && this._sel.has(id)); },
  selCount(){ return this._sel ? this._sel.size : 0; },
  selClear(){ this._sel = null; this.render(); },
  selToggle(id){
    if (!this._sel) this._sel = new Set();
    this._sel.has(id) ? this._sel.delete(id) : this._sel.add(id);
    if (!this._sel.size) this._sel = null;
    this.render();
  },
  /* Selects the rows currently on screen, never the ones a filter is hiding.
     "Select all" meaning "including the thirty you cannot see" is how bulk
     actions earn their reputation. */
  selAll(ids){
    const all = ids.every(i => this.selHas(i));
    this._sel = all ? null : new Set(ids);
    this.render();
  },
  selIds(){ return this._sel ? Array.from(this._sel) : []; },
  cbox(on){ return `<span class="cb${on?' on':''}"></span>`; },

  outTab(i){ this._sel=null; this._bookTab = !!i; Haptic.tap(); this.render(); },

  /* Grouped by day, nearest first. Today's carry their actions inline; later
     ones are rows until their day comes round. */
  bookedList(held){
    if (this.isWide()) return this.bookedTable(held);
    if (!held.length) return `<div class="empty"><div class="e">\u{1F4C5}</div>
      <b>No bookings yet</b>
      <span>Set a future date on the rent-out sheet and it becomes a booking.</span>
      <div style="margin-top:18px"><button class="btn" style="background:var(--vi)"
        onclick="R.newBooking()">+ New booking</button></div></div>`;
    const dayKey = ms => { const d=new Date(ms);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const today = dayKey(Date.now());
    const tmr   = dayKey(Date.now()+24*HOUR);
    let out = `<button class="btn" style="background:var(--vi);margin-bottom:11px"
      onclick="R.newBooking()">+ New booking</button>`;
    let last = '';
    held.forEach(b => {
      const k = dayKey(b.fromAt);
      if (k !== last){
        last = k;
        const lbl = k===today ? 'Today' : (k===tmr ? 'Tomorrow' : fmtDT(b.fromAt).split(',')[0]);
        out += `<div class="day-hd">${esc(lbl)}${k===today?'':' · '+fmtDT(b.fromAt).split(',')[0]}</div>`;
      }
      const isToday = k === today;
      const time = fmtDT(b.fromAt).split(', ').slice(1).join(', ');
      out += `<div class="card" style="${isToday?'border-color:var(--vi)':''}">
        <div class="row">
          <b class="grow" style="font-size:15px">A ${esc(b.model)}</b>
          <span class="pill ${isToday?'warn':'bk'}">${isToday?esc(time):'HELD'}</span>
        </div>
        <div class="muted" style="margin-top:2px">${esc(b.customerName)}${
          b.customerPhone?' · '+esc(b.customerPhone):''}</div>
        <div class="muted" style="margin-top:3px;color:var(--t2);font-weight:650">
          ${esc(tierOf(b.tier).label)} · ${money(b.quotedRent)}${
          b.token?' · token '+money(b.token)+' taken':' · no token'}</div>
        ${b.preferredVehicleId ? (()=>{ const pv=DB.d.vehicles.find(v=>v.id===b.preferredVehicleId);
          return pv?`<div class="muted" style="margin-top:2px">prefers ${esc(vSub(pv))||esc(vLabel(pv))}</div>`:''; })() : ''}
        ${isToday ? `<div class="two" style="margin-top:10px">
          <button class="btn sm" style="background:var(--y);color:#0A0A0A"
            onclick="R.startBooking('${b.id}')">Start rental</button>
          <button class="btn ghost sm" onclick="R.bookNoShow('${b.id}')">No-show</button>
        </div>` : `<div style="margin-top:9px"><button class="btn ghost sm" style="width:100%"
            onclick="R.bookCancel('${b.id}')">Cancel booking</button></div>`}
      </div>`;
    });
    return out;
  },

  bookFilter(k){ this._bkf = k; this.render(); },

  /* ── BOOKINGS, desktop ───────────────────────────────────────────────
     Built around the fact stated in bookFree() above: a booking holds a
     MODEL, not a named bike. So the question is never "which bike is
     free on Saturday" but "how many Activas are spoken for" — which the
     phone list, being one card per booking, cannot show at all. */
  bookedTable(held){
    const now = Date.now();
    const dayKey = ms => { const d=new Date(ms);
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const today = dayKey(now);
    const startOfDay = n => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d.getTime(); };

    /* 'past' needs the statuses bookings() filters out, so it reads
       DB.d.bookings directly rather than through that helper. */
    const filt = this._bkf || 'up';
    const all = DB.d.bookings || [];
    const past = all.filter(b => b.status && b.status !== 'held')
      .sort((a,b)=> Number(b.fromAt)-Number(a.fromAt));
    const todays = held.filter(b => dayKey(b.fromAt) === today);
    const list = filt==='today' ? todays : (filt==='past' ? past : held);

    /* ── capacity grid ──────────────────────────────────────────────
       One bookFree() call per model per day. Seven days by however many
       priced models a shop has — pure in-memory arithmetic over small
       arrays, computed once here rather than inside the template. */
    const models = (DB.d.rates||[]).filter(rc => this.rateReady(rc)
      && (DB.d.vehicles||[]).some(v => !v.deletedAt && v.rateId===rc.id && v.status!=='retired'));
    const cols = [];
    for (let i=0;i<7;i++){
      const s = startOfDay(i), e = s + 86399999;
      const d = new Date(s);
      cols.push({ s, e,
        top: i===0 ? 'Today' : d.toLocaleDateString('en-IN',{ weekday:'short' }),
        bot: String(d.getDate()) + (i===0||d.getDate()===1 ? ' '+d.toLocaleDateString('en-IN',{month:'short'}) : ''),
        wk: [0,6].includes(d.getDay()) });
    }
    let over = null;
    /* A row is one rate card, and bookFree() pools every vehicle pointing at
       it — so two genuinely different vehicles sharing a card show as one
       row with a count of 2, labelled with the card's model name. That is
       arithmetically right and practically misleading: "Bolero · 2 cars"
       when the second is a Tiago hides both a pooling error and a pricing
       one, since the Tiago is being quoted at Bolero rates. Collect the
       distinct vehicle names per card so the row can say what it actually
       covers instead of only how many. */
    const namesFor = rc => {
      const vs = (DB.d.vehicles||[]).filter(v =>
        !v.deletedAt && v.rateId === rc.id && v.status !== 'retired');
      const names = [];
      vs.forEach(v => { const n = String(vLabel(v)||'').trim();
        if (n && names.indexOf(n) === -1) names.push(n); });
      /* The odd ones out are the vehicles whose own name is not the card's
         model — those are the ones worth offering to split off, and one
         entry per distinct name so three identical Activas offer one fix,
         not three. */
      const seen = new Set();
      const odd = vs.filter(v => {
        const n = String(vLabel(v)||'').trim().toLowerCase();
        if (!n || n === String(rc.model||'').trim().toLowerCase()) return false;
        if (seen.has(n)) return false;
        seen.add(n); return true;
      });
      return { names, odd };
    };
    const grid = models.map(rc => { const nm = namesFor(rc);
      return { rc, names: nm.names, odd: nm.odd, cells: cols.map(c => {
      const f = this.bookFree(rc.id, c.s, c.e);
      /* bookFree clamps free at 0, which hides the case that matters most:
         more bookings than bikes. Recomputed raw so a shop is told it is
         oversubscribed rather than just seeing "full". */
      const raw = f.total - f.outNow - f.booked;
      if (raw < 0 && !over) over = { model: rc.model, day: c, n: -raw };
      const cls = (f.total===0 || raw<=0) ? 'c-full'
        : raw === f.total ? 'c-free'
        : (raw / f.total) <= 0.34 ? 'c-tight' : 'c-some';
      return { raw, total:f.total, cls };
    }) }; });

    const capCard = !models.length ? '' : `
      <div class="card">
        <div class="dmn-h"><span class="dmn-t">Free by model \u00b7 next 7 days</span>
          <span class="grow"></span><span class="dmn-sub">free / total</span></div>
        <div class="dmn-b" style="padding-top:8px;overflow-x:auto">
          <table class="dbk-cap">
            <thead><tr><th class="mdl">Model</th>
              ${cols.map(c=>`<th class="${c.wk?'wk':''}">${esc(c.top)}<br>${esc(c.bot)}</th>`).join('')}
            </tr></thead>
            <tbody>${grid.map(g=>{
              /* Mismatch = this card covers vehicles whose names are not all
                 the card's model. One name that differs is worth flagging;
                 several identical Activas are not. */
                const mixed = g.names.length > 1 && g.odd.length > 0;
                return `<tr>
              <td class="mdl"><div class="dbk-cn">${esc(g.rc.model)}</div>
                <div class="dbk-cs${mixed?' mix':''}">${g.cells[0].total} ${noun(g.cells[0].total!==1)}${
                  mixed ? ' \u2014 ' + esc(g.names.join(', ')) : ''}</div>
                ${mixed?`<div class="dbk-mixw">Same rate card, different ${noun(1)} \u2014 they share
                  one price and one pool.
                  ${g.odd.map(v=>`<button class="dbk-fix" onclick="R.splitRate('${v.id}')"
                    >Give ${esc(vLabel(v))} its own rate</button>`).join('')}</div>`:''}</td>
              ${g.cells.map(c=>`<td><div class="dbk-cell ${c.cls}">${c.raw}/${c.total}</div></td>`).join('')}
            </tr>`;}).join('')}</tbody>
          </table>
          <div class="dbk-leg">
            <span class="dbk-lg"><i class="c-free"></i>All free</span>
            <span class="dbk-lg"><i class="c-some"></i>Some booked</span>
            <span class="dbk-lg"><i class="c-tight"></i>Nearly full</span>
            <span class="dbk-lg"><i class="c-full"></i>Full / overbooked</span>
            <span style="margin-left:auto">Counts ${noun(1)} still out on rent, not just bookings.</span>
          </div>
        </div>
      </div>`;

    const tokens = held.reduce((a,b)=>a+(Number(b.token)||0),0);
    const quoted = list.reduce((a,b)=>a+(Number(b.quotedRent)||0),0);
    const withTok = held.filter(b=>Number(b.token)>0).length;
    const wk = held.filter(b=>Number(b.fromAt) <= startOfDay(7)).length;
    const nModels = new Set(held.map(b=>b.rateId)).size;

    const kpi = `<div class="dfl-kpi">
      <div class="dfl-k svc"><div class="dfl-k-l">Pickups today</div>
        <div class="dfl-k-v">${todays.length}</div>
        <div class="dfl-k-s">${todays.length?'keep these back':'nothing due'}</div></div>
      <div class="dfl-k out"><div class="dfl-k-l">Next 7 days</div>
        <div class="dfl-k-v">${wk}</div>
        <div class="dfl-k-s">across ${nModels} model${nModels===1?'':'s'}</div></div>
      <div class="dfl-k ok"><div class="dfl-k-l">Tokens held</div>
        <div class="dfl-k-v">${money(tokens)}</div>
        <div class="dfl-k-s">${withTok} of ${held.length} paid a token</div></div>
      <div class="dfl-k od${over?'':' zero'}"><div class="dfl-k-l">Overbooked</div>
        <div class="dfl-k-v">${over?over.n:0}</div>
        <div class="dfl-k-s">${over?esc(over.model)+', '+esc(over.day.top)+' '+esc(over.day.bot):'none'}</div></div>
    </div>`;

    const alert = !over ? '' : `<div class="dout-alert">
      <div class="dout-alert-i">\u26A0\uFE0F</div>
      <div><b>${esc(over.model)} is overbooked on ${esc(over.day.top)} ${esc(over.day.bot)}</b>
        <div class="s">${over.n} more booking${over.n===1?'':'s'} than ${noun(1)} available.
          Move one to another model, or tell the customer before they arrive.</div></div>
    </div>`;

    const chip = (k,label,cnt)=>`<button class="dfl-chip${filt===k?' on':''}"
      onclick="R.bookFilter('${k}')">${label} ${cnt}</button>`;
    const tools = `<div class="dfl-tools">
      ${chip('up','Upcoming',held.length)}${chip('today','Today',todays.length)}
      ${chip('past','Past',past.length)}
      <span class="grow"></span>
      <button class="dfl-chip dbk-new" onclick="R.newBooking()">+ New booking</button>
    </div>`;

    let lastDay = '', body = '';
    if (!list.length){
      body = `<tr><td colspan="8" class="muted" style="padding:22px;text-align:center">
        ${filt==='past'?'No past bookings yet.':'No bookings here.'}</td></tr>`;
    } else list.forEach(b => {
      const k = dayKey(b.fromAt);
      if (k !== lastDay){
        lastDay = k;
        const d = new Date(Number(b.fromAt));
        const lbl = k===today ? 'Today' : d.toLocaleDateString('en-IN',
          { weekday:'short', day:'numeric', month:'short' });
        body += `<tr><td colspan="8" class="dbk-day">${esc(lbl)}</td></tr>`;
      }
      const isToday = k === today;
      const isPast = filt === 'past';
      const f = this.bookFree(b.rateId, Number(b.fromAt), Number(b.toAt), b.id);
      const clash = !isPast && (f.total - f.outNow - f.booked) < 0;
      const mins = (Number(b.fromAt) - now) / 60000;
      const when = isPast ? '' : (mins < 0 ? 'started' :
        mins < 60 ? 'in ' + Math.round(mins) + ' min' : 'in ' + fmtDur(mins/60));
      const pv = b.preferredVehicleId
        ? (DB.d.vehicles||[]).find(v=>v.id===b.preferredVehicleId) : null;
      const rail = isPast ? 'r-later' : (isToday ? 'r-now' : (mins < 4320 ? 'r-soon' : 'r-later'));
      body += `<tr class="${rail}${isToday&&!isPast?' bknow':''}">
        <td class="rail"></td>
        <td><div class="dmn-nm">${esc(fmtDT(b.fromAt).split(', ').slice(1).join(', ')||fmtDT(b.fromAt))}</div>
          ${when?`<div class="dfl-sub">${esc(when)}</div>`:''}</td>
        <td><div class="dmn-nm">${esc(b.model||'\u2014')}</div>
          <div class="dfl-sub${clash?' clash':''}">${clash ? 'more bookings than '+noun(1)
            : (pv ? 'prefers '+esc(vSub(pv)||vLabel(pv)) : 'any '+noun())}</div></td>
        <td><div class="dout-cust">${esc(b.customerName||'\u2014')}</div>
          ${b.customerPhone?`<div class="dout-ph">${esc(b.customerPhone)}</div>`:''}</td>
        <td><span class="pill ${isPast?'':(clash?'late':(isToday?'warn':'bk'))}">${
          isPast ? esc(String(b.status||'').toUpperCase()) : esc(tierOf(b.tier).label)}</span></td>
        <td class="num" style="font-weight:800">${money(b.quotedRent)}</td>
        <td>${Number(b.token)>0
          ? `<span class="pill ok">${money(b.token)} taken</span>`
          : `<span class="pill dbk-notok">No token</span>`}</td>
        <td class="num"><div class="dout-act">
          ${isPast ? '<span class="muted">\u2014</span>' : `
            ${b.customerPhone?`<a class="dout-ab call" href="tel:${esc(b.customerPhone)}"
              title="Call ${esc(b.customerName||'customer')}">\u{1F4DE}</a>`:''}
            ${isToday
              ? `<button class="dout-ab" onclick="R.bookNoShow('${b.id}')">No-show</button>
                 <button class="dout-ab dbk-go" onclick="R.startBooking('${b.id}')">Start rental \u203A</button>`
              : `<button class="dout-ab" onclick="R.bookCancel('${b.id}')">Cancel</button>`}`}
        </div></td>
      </tr>`;
    });

    return kpi + alert + capCard + tools + `<div class="dt-tbl"><table>
      <thead><tr><th class="railcol"></th><th>Pickup</th><th>Model</th><th>Customer</th>
        <th>${filt==='past'?'Outcome':'Plan'}</th><th class="num">Quoted</th><th>Token</th>
        <th class="num">Action</th></tr></thead>
      <tbody>${body}</tbody></table>
      <div class="dfl-foot"><span>${list.length} booking${list.length===1?'':'s'}</span>
        <span>${filt!=='past'?`Tokens held <b style="color:var(--success-d)">${money(tokens)}</b> \u00b7 `:''}quoted value <b>${money(quoted)}</b></span></div>
    </div>`;
  },

  /* The second door. Same sheet, date pre-set to tomorrow — nobody discovers a
     feature by scrolling to a date field. */
  newBooking(){
    this._prefillOut = Date.now() + 24*HOUR;
    this.checkoutStart();
  },

  /* Booking becomes a rental. The bike is chosen NOW, from what is actually
     standing in the yard — the preference is offered first, not forced. */
  startBooking(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    const bikes = (DB.d.vehicles||[]).filter(v =>
      !v.deletedAt && v.rateId === b.rateId && v.status === 'available');
    if (!bikes.length) return toast('No ' + b.model + ' is free right now — check one in first');
    bikes.sort((a,c)=> (a.id===b.preferredVehicleId?-1:0) - (c.id===b.preferredVehicleId?-1:0));
    this._fromBooking = b.id;
    this._prefillOut = Date.now();
    this._prefillVeh = bikes[0].id;
    this._prefillTier = b.tier;
    closeSheet();
    this.checkoutStart();
  },

  bookNoShow(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    if (!confirm('Mark ' + b.customerName + ' as a no-show?\n\nThe ' + noun() + ' is freed for anyone else. ' +
      (b.token ? 'The ' + money(b.token) + ' token stays with you unless you refund it yourself.'
               : 'No token was taken.'))) return;
    this._bookSet(id, { status:'noshow', closedAt: Date.now() });
    toast('Marked no-show — the ' + b.model + ' is free');
  },

  bookCancel(id){
    const b = (DB.d.bookings||[]).find(x=>x.id===id); if (!b) return;
    if (!confirm('Cancel this booking?\n\n' + (b.token
      ? 'Refunding the ' + money(b.token) + ' token is your call — the app only records the cancellation.'
      : 'No token was taken.'))) return;
    this._bookSet(id, { status:'cancelled', closedAt: Date.now() });
    toast('Booking cancelled');
  },

  _bookSet(id, patch){
    const i = (DB.d.bookings||[]).findIndex(x=>x.id===id);
    if (i<0) return;
    Object.assign(DB.d.bookings[i], patch);
    if (window.Cloud && Cloud.ready) Cloud.put('bookings', id, patch);
    DB.save(); this.render();
  },

  obDismiss(){ this._obDismissed = true; try{ localStorage.setItem('rn_ob_done','1'); }catch(e){} this.render(); },

  renderOut(){
    const open = DB.d.rentals.filter(r => r.status === 'open');
    const now = Date.now();
    const late = open.filter(r => now > r.dueAt);
    const depHeld = open.reduce((s,r)=> s + (Number(r.depositHeld)||0), 0);

    /* From today's rollup, not from the open-rentals array — which by
       definition never contains a settled rental. */
    const dk = new Date(); const dayKey = dk.getFullYear() + '-' +
      String(dk.getMonth()+1).padStart(2,'0') + '-' + String(dk.getDate()).padStart(2,'0');
    const today = (DB.d.daily||[]).find(d => d.id === dayKey);
    const todayRev = today ? (Number(today.revenue)||0) : 0;

    document.getElementById('k-out').textContent  = open.length;
    document.getElementById('k-late').textContent = late.length;
    document.getElementById('k-rev').textContent  = money(todayRev);
    document.getElementById('k-dep').textContent  = money(depHeld);
    document.getElementById('k-dep-sub').textContent =
      open.length + ' open rental' + (open.length===1?'':'s') + ' · refundable';

    const box = document.getElementById('out-list');
    /* Onboarding first: while a shop has no bikes, no prices and no rentals,
       nothing else on this screen matters. ratesBanner() would otherwise fire
       at the same time and say the same thing twice, so it stands down until
       setup is done. */
    /* ── a shop with no bikes gets ONE thing on screen ──────────────
       Not a KPI strip of zeros, not a trial banner, not an empty state
       offering to "create 0 bikes from my rate card" — which is what this
       branch used to do, having been written when rate cards shipped
       pre-seeded. One welcome, three steps, one button. */
    const noBikes = !(DB.d.vehicles||[]).filter(v=>!v.deletedAt).length;
    const kp = document.getElementById('out-kpis');
    /* Hidden on desktop as well as on an empty shop: outTable() renders its
       own KPI row with sublines, and this static strip sat above it saying
       the same four numbers a second time — including the deposits card,
       which the table already carries in its footer. */
    if (kp) kp.style.display = (noBikes || this.isWide()) ? 'none' : '';
    if (noBikes && this.isManager()){
      /* The question first, then the welcome. Both are full-screen and both
         belong to a shop that owns nothing; showing them together would be two
         primary actions on one screen, which is the thing the welcome rework
         set out to remove. */
      box.innerHTML = this.needsKind() ? this.askKind() : this.welcome();
      return;
    }

    const ob = this.obCard();
    const held = this.bookings().sort((a,b)=> Number(a.fromAt)-Number(b.fromAt));
    const seg = held.length || this._bookTab ? `
      <div class="seg">
        <div class="${this._bookTab?'':'on'}" onclick="R.outTab(0)">Out now${
          open.length?` <span class="sb">${open.length}</span>`:''}</div>
        <div class="${this._bookTab?'on':''}" onclick="R.outTab(1)">Booked${
          held.length?` <span class="sb">${held.length}</span>`:''}</div>
      </div>` : '';

    if (this._bookTab){
      const kp2 = document.getElementById('out-kpis');
      if (kp2) kp2.style.display = 'none';
      box.innerHTML = seg + this.bookedList(held);
      return;
    }

    /* Pickups due today, at the top, because it is the only thing that changes
       what a shop does this morning: how many bikes not to give a walk-in. */
    const dayEnd = new Date(); dayEnd.setHours(23,59,59,999);
    const todays = held.filter(b => Number(b.fromAt) <= dayEnd.getTime());
    const pick = todays.length ? `
      <div class="card" style="background:var(--y-tint);border-color:var(--y-bd)">
        <div class="row"><b class="grow" style="font-size:13px">${todays.length} pickup${
          todays.length===1?'':'s'} today</b>
          <button class="btn ghost sm" onclick="R.outTab(1)">See</button></div>
        <div class="muted" style="margin-top:3px">Keep ${todays.map(b=>esc(b.model)).join(', ')} back.</div>
      </div>` : '';

    const banner = ob + seg + pick + (this.obDone() ? this.ratesBanner() : '') + this.trialBanner();
    if (!open.length){
      box.innerHTML = banner + `<div class="empty"><div class="e">${kindEmoji()}</div>
          <b>Nothing is out right now</b>
          <span>Every ${noun()} is in the yard.</span>
          <div style="margin-top:18px"><button class="btn y" onclick="R.checkoutStart()">
            Rent out a ${noun()}</button></div></div>`;
      return;
    }
    open.sort((a,b)=> a.dueAt - b.dueAt);
    if (this.isWide()) return this.outTable(banner, open, now, depHeld, todayRev, today);
    box.innerHTML = banner + open.map(r => {
      const v = DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
      const isLate = now > r.dueAt;
      const overH = isLate ? hoursBetween(r.dueAt, now) : 0;
      return `<div class="card tap" onclick="R.checkinStart('${r.id}')">
        <div class="row">
          <div class="grow">
            <div class="row" style="gap:7px">
              <b class="ell" style="font-size:15.5px">${esc(vLabel(v))}</b>
              <span class="pill ${isLate?'late':'out'}">${isLate?'OVERDUE '+fmtDur(overH):'OUT'}</span>
            </div>
            <div class="muted ell" style="margin-top:2px">
              ${[esc(v.regNo||''), esc(r.customerName||'—'), esc(r.customerPhone||'')].filter(Boolean).join(' · ')}
            </div>
            <div class="muted" style="margin-top:4px">
              Due ${fmtDT(r.dueAt)} · ${tierLabel(r)} · deposit ${money(r.depositHeld)}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:800;color:var(--t3)">CHECK IN</div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  /* ── OUT NOW, desktop ────────────────────────────────────────────────
     Unlike Fleet, this is an operational screen: its job is telling a shop
     who to chase and what to charge when a bike walks back in. So it is
     ordered by urgency and carries two things the phone cannot afford —
     the customer's phone number, and what the bill comes to right now. */
  outEstimate(r){
    /* The same call the check-in sheet makes, so the number previewed here
       and the number charged at the counter come from one place and cannot
       drift apart. Rentals written before rateSnapshot existed have none,
       and get no estimate rather than a wrong one. */
    if (!r.rateSnapshot) return null;
    try {
      const hrs = Math.max(0, hoursBetween(r.outAt, Date.now()));
      const q = quote(r.rateSnapshot, r.tier, hrs);
      return { total: (q.rent||0) + (q.overtime||0), overtime: q.overtime||0 };
    } catch(e){ return null; }
  },
  outFilter(k){ this._ofilter = k; this.render(); },
  outSearch(q){ this._oq = q; this.render(); },

  outTable(banner, open, now, depHeld, todayRev, today){
    const box = document.getElementById('out-list');
    const dayEnd = new Date(); dayEnd.setHours(23,59,59,999);
    const isLate = r => now > r.dueAt;
    const dueToday = r => !isLate(r) && r.dueAt <= dayEnd.getTime();
    const late = open.filter(isLate);

    const q = (this._oq||'').trim().toLowerCase();
    const vOf = r => DB.d.vehicles.find(x=>x.id===r.vehicleId) || {};
    const matchQ = r => { if (!q) return true; const v = vOf(r);
      return [vLabel(v), v.regNo, r.customerName, r.customerPhone]
        .some(s => String(s||'').toLowerCase().includes(q)); };
    const filt = this._ofilter || 'all';
    const matchF = r => filt==='all' || (filt==='late' && isLate(r))
      || (filt==='today' && dueToday(r));
    const list = open.filter(r => matchQ(r) && matchF(r));

    /* Overtime already running across every late rental — the cost of not
       ringing them, which is the reason this screen exists. */
    const lateExtra = late.reduce((a,r)=>{ const e = this.outEstimate(r); return a + (e?e.overtime:0); }, 0);
    const estTotal = list.reduce((a,r)=>{ const e = this.outEstimate(r); return a + (e?e.total:0); }, 0);
    const fleetN = (DB.d.vehicles||[]).filter(v=>!v.deletedAt).length;
    const settled = today ? (Number(today.rentals)||0) : 0;

    const kpi = `<div class="dfl-kpi">
      <div class="dfl-k out"><div class="dfl-k-l">Out now</div>
        <div class="dfl-k-v">${open.length}</div>
        <div class="dfl-k-s">of ${fleetN} ${noun(1)}</div></div>
      <div class="dfl-k od${late.length?'':' zero'}"><div class="dfl-k-l">Overdue</div>
        <div class="dfl-k-v">${late.length}</div>
        <div class="dfl-k-s">${lateExtra?money(lateExtra)+' extra running':'none late'}</div></div>
      <div class="dfl-k ok"><div class="dfl-k-l">Earned today</div>
        <div class="dfl-k-v">${money(todayRev)}</div>
        <div class="dfl-k-s">${settled} rental${settled===1?'':'s'} settled</div></div>
      <div class="dfl-k svc"><div class="dfl-k-l">Deposits held</div>
        <div class="dfl-k-v">${money(depHeld)}</div>
        <div class="dfl-k-s">${open.length} open \u00b7 refundable</div></div>
    </div>`;

    /* Only shown when something is actually late — a permanent "0 overdue"
       banner is furniture, and furniture stops being read. */
    const alert = late.length ? `<div class="dout-alert">
      <div class="dout-alert-i">\u23F0</div>
      <div><b>${late.length} ${noun(late.length!==1)} ${late.length===1?'is':'are'} overdue</b>
        <div class="s">${late.slice(0,3).map(r=>{
          const v = vOf(r);
          return esc(vLabel(v)) + ' \u00b7 ' + fmtDur(hoursBetween(r.dueAt, now)) + ' past due'
            + (r.customerName ? ' with ' + esc(r.customerName) : '');
        }).join(' \u2022 ')}${late.length>3?' \u2022 and '+(late.length-3)+' more':''}.
        Overtime is already counted in the estimate.</div></div>
    </div>` : '';

    const chip = (k,label,cnt,dg)=>`<button class="dfl-chip${dg?' dg':''}${filt===k?' on':''}"
      onclick="R.outFilter('${k}')">${label} ${cnt}</button>`;
    const tools = `<div class="dfl-tools">
      <div class="dfl-search"><span style="opacity:.5">\u{1F50D}</span>
        <input id="dout-q" placeholder="Search ${noun()}, customer or number"
          value="${esc(this._oq||'')}" oninput="R.outSearch(this.value)"></div>
      ${chip('all','All',open.length)}${chip('late','Overdue',late.length,true)}
      ${chip('today','Due today',open.filter(dueToday).length)}
    </div>`;

    box.innerHTML = banner + kpi + alert + tools + `<div class="dt-tbl"><table>
      <thead><tr>
        <th class="railcol"></th>
        <th>${Noun()}</th><th>Customer</th><th>Out since</th><th>Due</th>
        <th>Plan</th><th class="num">Deposit</th><th class="num">Est. now</th>
        <th class="num">Action</th>
      </tr></thead><tbody>
      ${!list.length ? `<tr><td colspan="9" class="muted" style="padding:22px;text-align:center">
          Nothing matches this filter.</td></tr>` : list.map(r=>{
        const v = vOf(r);
        const lateR = isLate(r);
        const soon = !lateR && (r.dueAt - now) <= HOUR;
        const est = this.outEstimate(r);
        const rail = lateR ? 's-od' : (soon ? 's-soon' : 's-ok');
        const overH = lateR ? hoursBetween(r.dueAt, now) : 0;
        const untilH = !lateR ? hoursBetween(now, r.dueAt) : 0;
        return `<tr class="${rail}${lateR?' od':''}" onclick="R.checkinStart('${r.id}')">
          <td class="rail"></td>
          <td><div class="nm">${esc(vLabel(v))}</div>${
            v.regNo?`<div class="dfl-sub">${esc(v.regNo)}</div>`:''}</td>
          <td><div class="dout-cust">${esc(r.customerName||'\u2014')}</div>${
            r.customerPhone?`<div class="dout-ph">${esc(r.customerPhone)}</div>`:''}</td>
          <td><div class="dout-due">${esc(fmtDT(r.outAt))}</div>
            <div class="dout-run">${fmtDur(hoursBetween(r.outAt, now))} on rent</div></td>
          <td><div class="dout-due${lateR?' warn':(soon?' soon':'')}">${
            lateR ? fmtDur(overH)+' overdue' : 'in '+fmtDur(untilH)}</div>
            <div class="dout-run">${esc(fmtDT(r.dueAt))}</div></td>
          <td><span class="pill ${lateR?'late':(soon?'warn':'out')}">${esc(tierLabel(r))}</span></td>
          <td class="num">${money(r.depositHeld)}</td>
          <td class="num">${est ? `<div class="dout-est">${money(est.total)}</div>${
            est.overtime?`<div class="dout-est-x">+${money(est.overtime)} overtime</div>`:''}`
            : '<span class="muted">\u2014</span>'}</td>
          <td class="num"><div class="dout-act" onclick="event.stopPropagation()">
            ${r.customerPhone?`<a class="dout-ab call" href="tel:${esc(r.customerPhone)}"
              title="Call ${esc(r.customerName||'customer')}">\u{1F4DE}</a>`:''}
            <button class="dout-ab" onclick="R.extend('${r.id}')">Extend</button>
            <button class="dout-ab pri" onclick="R.checkinStart('${r.id}')">Settle \u203A</button>
          </div></td>
        </tr>`;
      }).join('')}
      </tbody></table>
      <div class="dfl-foot"><span>Showing ${list.length} of ${open.length} out</span>
        <span>Estimated on return <b style="color:var(--success-d)">${money(estTotal)}</b></span></div>
      </div>`;
    if (q){
      const el = document.getElementById('dout-q');
      if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  },
  /* ── FLEET ──────────────────────────────────────────────────────── */
  /* Earned by this bike within a period, from the closed-rentals cache the
     Money page already loads. vehicleStats.earned is a LIFETIME figure and
     cannot answer "today" — but the cache is capped at 400 recent
     settlements, so this is right for today/this week and would undercount
     a very long window. Only ever called for short periods here. */
  earnedToday(v){
    const rows = this._closed || [];
    const start = new Date(); start.setHours(0,0,0,0);
    const s = start.getTime();
    return rows.filter(x => x.vehicleId===v.id && !x.voidedAt && x.status!=='cancelled'
        && (x.outAt||0) >= s)
      .reduce((a,x)=> a + (Number(x.revenue)||0), 0);
  },

  fleetSearch(q){ this._fq = q; this.renderFleet(); },
  fleetSort(){
    const opts = ['status','earning','idle','name'];
    const cur = opts.indexOf(this._fsort||'status');
    this._fsort = opts[(cur+1) % opts.length];
    toast({ status:'Sorted by status', earning:'Sorted by earned today',
            idle:'Sorted by longest idle', name:'Sorted by name' }[this._fsort]);
    this.renderFleet();
  },

  renderFleet(){
    const box = document.getElementById('fleet-list');
    const missing = DB.d.rates.filter(rc => !DB.d.vehicles.some(v => v.rateId===rc.id)).length;
    /* Top of the list, not the bottom. It was at the end and a shop with more
       bikes than fit on screen never saw it — which is the whole point of the
       button, since the FAB was already there for anyone who had found it. */
    /* One count at the top beats discovering it bike by bike. ratesPending()
       already exists for exactly this and is what the Rates tab badges. */
    const pending = this.ratesPending();
    const junk = this.starterJunk().length;
    const hdr = (pending ? `<div class="card" style="background:var(--y-tint);border-color:var(--y-bd);margin-bottom:11px">
        <b style="font-size:13.5px">${pending} rate card${pending===1?'':'s'} still at \u20B90</b>
        <div class="muted" style="margin-top:3px">A ${noun()} cannot be rented out until its rate is
        set. Photograph your printed price list and the app can read them in.</div>
        <button class="btn sm" style="margin-top:10px;width:100%" onclick="R.nav('rates')">Open Rates</button>
        ${junk && this.isOwner() ? `<button class="btn ghost sm" style="margin-top:8px;width:100%"
          onclick="R.clearStarters()">Remove ${junk} unpriced ${noun(junk!==1)} I never added</button>` : ''}
      </div>` : '') +
      `<button class="btn" style="margin-bottom:12px" onclick="R.editVehicle()">
        + Add a ${noun()}</button>` +
      /* Only offered when there genuinely are priced rate cards with no bike
         against them. With no seeding that is a real, useful state — a shop that
         photographed its price list and now wants a bike per model. */
      (missing ? `<button class="btn ghost" style="margin-bottom:12px" onclick="R.fillFromRates()">
          + Add ${missing} missing ${missing===1?noun():noun(1)} from your rate card</button>` : '');
    if (!DB.d.vehicles.length){
      /* One action. This used to read "Your rate card lists 0 models" and offer
         "+ Create 0 bikes from my rate card" — copy written when rate cards
         shipped pre-seeded, which now offers to create nothing. */
      box.innerHTML = `<div class="empty"><div class="e">${kindEmoji()}</div>
        <b>No ${noun(1)} yet</b>
        <span>Add the ${noun(1)} you actually own. Each one gets its own row, and you can
          give it a number plate.</span>
        <div style="margin-top:18px"><button class="btn y" onclick="R.firstBike()">
          Add your first ${noun()}</button></div>
        ${this.isOwner() ? `<div style="margin-top:9px"><button class="btn ghost"
          onclick="R.scanRates()">\u{1F4F7} Photograph my printed rate card</button></div>` : ''}
      </div>`;
      return;
    }
    /* Desktop gets a table: twelve bikes readable at once, plus the two
       columns a phone cannot afford — Idle days and Earned — which are what an
       owner sitting down actually wants. Same data, different question. */
    if (this.isWide()) return this.fleetTable(hdr);

    /* The closed-rentals cache backs "Earned today". Money loads it too and
       both share this field, so opening one page warms the other. Re-render
       through render() rather than renderFleet() directly: if the user has
       switched to Money while this was in flight, Money rendered against the
       empty placeholder below and needs the same wake-up. */
    if (!this._closed && window.Cloud && Cloud.ready){
      this._closed = [];
      Cloud.recentClosed(400).then(rows => { this._closed = rows; this.render(); });
    }

    const live = DB.d.vehicles.filter(v => !v.deletedAt);
    const openOf = v => DB.d.rentals.find(x=>x.vehicleId===v.id && x.status==='open');
    /* "Cannot rent out" is the honest grouping: it is what a blocked bike
       means to the person at the counter, and it covers three different
       causes — expired papers, no rate set, and manual maintenance — that
       all produce the same refusal at checkout. */
    const blocked = v => v.status==='maintenance' || v.status==='retired'
      || !!this.docBlocked(v)
      || (()=>{ const rc = DB.d.rates.find(r=>r.id===v.rateId); return !rc || !this.rateReady(rc); })();
    const bucketOf = v => v.status==='rented' ? 0 : (blocked(v) ? 2 : 1);

    const q = (this._fq||'').trim().toLowerCase();
    const match = v => !q || String(vLabel(v)).toLowerCase().includes(q)
      || String(v.regNo||'').toLowerCase().includes(q)
      || String(v.model||'').toLowerCase().includes(q);
    const shown = live.filter(match);

    const sortKey = this._fsort || 'status';
    const sorters = {
      status:  (a,b)=> (bucketOf(a)-bucketOf(b)) || String(vLabel(a)).localeCompare(String(vLabel(b))),
      earning: (a,b)=> this.earnedToday(b) - this.earnedToday(a),
      idle:    (a,b)=> (this.idleDays(b)||0) - (this.idleDays(a)||0),
      name:    (a,b)=> String(vLabel(a)).localeCompare(String(vLabel(b))),
    };
    const vs = shown.slice().sort(sorters[sortKey]);

    const nOut = live.filter(v=>v.status==='rented').length;
    const nBlocked = live.filter(v=>bucketOf(v)===2).length;
    const nReady = live.length - nOut - nBlocked;

    const kpi = `
      <div class="fl-kpi">
        <div class="fl-k all"><div class="fl-k-l">Total</div><div class="fl-k-v">${live.length}</div></div>
        <div class="fl-k out"><div class="fl-k-l">Out now</div><div class="fl-k-v">${nOut}</div></div>
        <div class="fl-k ok"><div class="fl-k-l">Ready</div><div class="fl-k-v">${nReady}</div></div>
        <div class="fl-k svc${nBlocked?'':' zero'}"><div class="fl-k-l">Blocked</div>
          <div class="fl-k-v">${nBlocked}</div></div>
      </div>`;

    const tools = `
      <div class="fl-tools">
        <div class="fl-search"><span style="opacity:.5">\u{1F50D}</span>
          <input id="fl-q" placeholder="Search by name or number" value="${esc(this._fq||'')}"
            oninput="R.fleetSearch(this.value)"></div>
        <button class="fl-sort" onclick="R.fleetSort()">\u2195 ${
          { status:'Status', earning:'Earned', idle:'Idle', name:'Name' }[sortKey]}</button>
      </div>`;

    const card = v => {
      const rc = DB.d.rates.find(r=>r.id===v.rateId);
      const r = openOf(v);
      const docs = this.docWarn(v);
      const noRate = !rc || !this.rateReady(rc);
      const b = bucketOf(v);
      const tone = b===0 ? 'rented' : (b===2 ? 'svc' : 'avail');
      const et = this.earnedToday(v);
      const plate = (v.regNo||'').split(' ').slice(-2).join(' ') || (v.regNo||'');
      const overdue = r && r.dueAt && Date.now() > r.dueAt;

      /* One line under the name saying what this bike is doing right now. The
         status pill says the category; this says the specific. */
      let who = '', whoCls = 'idle';
      if (r){ who = 'With ' + esc(r.customerName || 'a customer'); whoCls = 'rented'; }
      else if (docs){ who = esc(docs); whoCls = 'svc'; }
      else if (noRate){ who = 'Rate not set'; whoCls = 'svc'; }
      else if (v.status==='maintenance'){ who = 'In maintenance'; whoCls = 'svc'; }
      else if (v.status==='retired'){ who = 'Retired'; whoCls = 'svc'; }
      else { const d = this.idleDays(v); who = d===null ? '' : (d<=0 ? 'Back today' : 'Idle '+d+' day'+(d===1?'':'s')); }

      /* Left footer cell answers the question this bike's state actually
         raises: when is it back / why can't it go / what does it cost. */
      let f1;
      if (r) f1 = `<div class="fl-f${overdue?' warn':''}"><span class="fl-fi">\u{1F551}</span>${
        overdue ? '<b>Overdue</b> \u00b7 due '+esc(fmtDT(r.dueAt)) : 'Due <b>'+esc(fmtDT(r.dueAt))+'</b>'}</div>`;
      else if (b===2) f1 = `<div class="fl-f warn"><span class="fl-fi">\u{1F6AB}</span><b>${
        noRate ? 'No rate \u2014 cannot go out' : 'Blocked at checkout'}</b></div>`;
      else f1 = `<div class="fl-f"><span class="fl-fi">\u{1F4B0}</span><b>${
        rc && rc.tiers && rc.tiers.h24 ? money(rc.tiers.h24) : '\u2014'}</b>/day</div>`;

      return `<div class="fl-v" onclick="R.editVehicle('${v.id}')">
        <div class="fl-main">
          <div class="fl-th t-${tone}">
            <div class="fl-th-i">${kindEmoji()}</div>
            ${plate?`<div class="fl-th-p">${esc(plate)}</div>`:''}
          </div>
          <div class="fl-mid">
            <div class="fl-hd"><span class="fl-n ell">${esc(vLabel(v))}</span>
              <span class="fl-pill p-${tone}">${
                b===0?'Out':(b===2?(noRate?'No rate':'Blocked'):'Ready')}</span></div>
            <div class="fl-meta ell">${esc(vSub(v))||esc(v.model||'')}</div>
            ${who?`<div class="fl-who w-${whoCls} ell">${who}</div>`:''}
          </div>
          <div class="fl-money">
            <div class="fl-m-v${et?'':' nil'}">${et?money(et):'\u2014'}</div>
            <div class="fl-m-l">Earned today</div>
          </div>
        </div>
        <div class="fl-foot">
          ${f1}
          <div class="fl-f"><span class="fl-fi">\u{1F6E1}\uFE0F</span>Deposit <b>${
            rc && rc.deposit ? money(rc.deposit) : '\u2014'}</b></div>
        </div>
      </div>`;
    };

    const group = (label, n, list) => !list.length ? '' :
      `<div class="fl-sec">${label} \u00b7 ${n}</div>` + list.map(card).join('');

    let body;
    if (!vs.length){
      body = `<div class="card"><div class="muted">No ${noun(1)} match \u201C${esc(this._fq||'')}\u201D.</div></div>`;
    } else if (sortKey === 'status'){
      body = group('Out on rent', vs.filter(v=>bucketOf(v)===0).length, vs.filter(v=>bucketOf(v)===0))
           + group('Ready to rent', vs.filter(v=>bucketOf(v)===1).length, vs.filter(v=>bucketOf(v)===1))
           + group('Cannot rent out', vs.filter(v=>bucketOf(v)===2).length, vs.filter(v=>bucketOf(v)===2));
    } else {
      body = vs.map(card).join('');
    }

    box.innerHTML = kpi + hdr + tools + body;
    /* innerHTML replaced the input, so focus and caret are gone. Restore them
       or typing a second character in the search box moves focus to nowhere. */
    if (q){
      const el = document.getElementById('fl-q');
      if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  },

  /* Days since this bike last went out. The number that says the Maestro has
     sat for 41 days having earned ₹2,100 all year.
     Reads /vehicleStats, not DB.d.rentals — that listener only ever holds
     OPEN rentals, so a bike sitting available (the common case) had no
     matching row there and this fell back to "days since added," which is
     wrong for any bike with rental history that isn't mid-rental today. */
  idleDays(v){
    const stat = (DB.d.vehicleStats||[]).find(s => s.id === v.id);
    const last = stat && stat.lastOutAt ? Number(stat.lastOutAt) : 0;
    if (!last) return v.createdAt ? Math.floor((Date.now()-v.createdAt)/(24*HOUR)) : null;
    return Math.floor((Date.now()-last)/(24*HOUR));
  },
  /* Same fix: this used to filter DB.d.rentals for status==='closed', which
     that listener can never contain, so this always returned ₹0. */
  earnedBy(v){
    const stat = (DB.d.vehicleStats||[]).find(s => s.id === v.id);
    return stat ? (Number(stat.earned)||0) : 0;
  },

  /* Same fix again: this used to count DB.d.rentals (open-only listener),
     so it could only ever read 0 or 1 — whether this bike happened to be
     out right now — never the true lifetime trip count. */
  tripsBy(v){
    const stat = (DB.d.vehicleStats||[]).find(s => s.id === v.id);
    const closedTrips = stat ? (Number(stat.closedTrips)||0) : 0;
    const isOut = (DB.d.rentals||[]).some(r => r.vehicleId === v.id && r.status === 'open');
    return closedTrips + (isOut ? 1 : 0);
  },

  fleetTable(hdr){
    const box = document.getElementById('fleet-list');
    const live = (DB.d.vehicles||[]).filter(v=>!v.deletedAt);

    /* Same closed-rentals cache Money and the phone Fleet use, for the
       "Earned today" column. Loading it here means whichever screen the
       owner opens first warms it for the others. */
    if (!this._closed && window.Cloud && Cloud.ready){
      this._closed = [];
      Cloud.recentClosed(400).then(rows => { this._closed = rows; this.render(); });
    }

    /* Identical bucketing to the phone list, so the two screens never
       disagree about what "blocked" means: expired papers, no rate set, or
       manual maintenance all produce the same refusal at checkout. */
    const openOf = v => (DB.d.rentals||[]).find(x=>x.vehicleId===v.id && x.status==='open');
    const rateOf = v => (DB.d.rates||[]).find(r=>r.id===v.rateId);
    const noRateOf = v => { const rc = rateOf(v); return !rc || !this.rateReady(rc); };
    const blocked = v => v.status==='maintenance' || v.status==='retired'
      || !!this.docBlocked(v) || noRateOf(v);
    const bucketOf = v => v.status==='rented' ? 0 : (blocked(v) ? 2 : 1);

    const q = (this._fq||'').trim().toLowerCase();
    const matchQ = v => !q || String(vLabel(v)).toLowerCase().includes(q)
      || String(v.regNo||'').toLowerCase().includes(q)
      || String(v.model||'').toLowerCase().includes(q);
    const filt = this._ffilter || 'all';
    const matchF = v => filt==='all' || (filt==='out' && bucketOf(v)===0)
      || (filt==='ready' && bucketOf(v)===1) || (filt==='blocked' && bucketOf(v)===2);

    const sortKey = this._fsort || 'status';
    const sorters = {
      status:  (a,b)=> (bucketOf(a)-bucketOf(b)) || String(vLabel(a)).localeCompare(String(vLabel(b))),
      earning: (a,b)=> this.earnedToday(b) - this.earnedToday(a),
      idle:    (a,b)=> (this.idleDays(b)||0) - (this.idleDays(a)||0),
      name:    (a,b)=> String(vLabel(a)).localeCompare(String(vLabel(b))),
    };
    const list = live.filter(v=>matchQ(v)&&matchF(v)).slice().sort(sorters[sortKey]);
    const ids = list.map(v=>v.id);
    const n = this.selCount();

    const nOut = live.filter(v=>bucketOf(v)===0).length;
    const nBlocked = live.filter(v=>bucketOf(v)===2).length;
    const nReady = live.length - nOut - nBlocked;
    const nOverdue = live.filter(v=>{ const r=openOf(v); return r && r.dueAt && Date.now()>r.dueAt; }).length;
    const invested = live.reduce((a,v)=>a+(Number(v.cost)||0),0);
    const util = live.length ? Math.round(nOut/live.length*100) : 0;
    const todayTotal = live.reduce((a,v)=>a+this.earnedToday(v),0);
    const lifeTotal = live.reduce((a,v)=>a+this.earnedBy(v),0);

    const kpi = `<div class="dfl-kpi">
      <div class="dfl-k all"><div class="dfl-k-l">Total ${noun(1)}</div>
        <div class="dfl-k-v">${live.length}</div>
        <div class="dfl-k-s">${invested?money(invested)+' invested':'&nbsp;'}</div></div>
      <div class="dfl-k out"><div class="dfl-k-l">Out now</div>
        <div class="dfl-k-v">${nOut}</div>
        <div class="dfl-k-s">${nOverdue?nOverdue+' overdue':'none overdue'}</div></div>
      <div class="dfl-k ok"><div class="dfl-k-l">Ready to rent</div>
        <div class="dfl-k-v">${nReady}</div>
        <div class="dfl-k-s">${util}% out today</div></div>
      <div class="dfl-k svc${nBlocked?'':' zero'}"><div class="dfl-k-l">Cannot rent out</div>
        <div class="dfl-k-v">${nBlocked}</div>
        <div class="dfl-k-s">${nBlocked?'fix to rent these':'all clear'}</div></div>
    </div>`;

    const chip = (k,label,cnt)=>`<button class="dfl-chip${filt===k?' on':''}"
      onclick="R.fleetFilter('${k}')">${label} ${cnt}</button>`;
    const tools = `<div class="dfl-tools">
      <div class="dfl-search"><span style="opacity:.5">\u{1F50D}</span>
        <input id="dfl-q" placeholder="Search by name or number" value="${esc(this._fq||'')}"
          oninput="R.fleetSearch(this.value)"></div>
      ${chip('all','All',live.length)}${chip('out','Out',nOut)}
      ${chip('ready','Ready',nReady)}${chip('blocked','Blocked',nBlocked)}
      <span class="grow"></span>
      <button class="dfl-chip" onclick="R.fleetSort()">\u2195 ${
        { status:'Status', earning:'Earned today', idle:'Idle', name:'Name' }[sortKey]}</button>
    </div>`;

    box.innerHTML = hdr + kpi + tools + (n ? this.bulkBar(n + ' ' + noun(n!==1) + ' selected', [
        ['R.bulkStatus(\'maintenance\')', 'Mark unavailable'],
        ['R.bulkStatus(\'available\')',   'Mark available'],
        ['R.bulkRetire()',                'Retire', 'dg'],
      ]) : '') +
      `<div class="dt-tbl"><table>
        <thead><tr>
          <th class="railcol"></th>
          <th class="selcol" onclick="R.selAll(${JSON.stringify(ids).replace(/"/g,'&quot;')})">
            ${this.cbox(ids.length && ids.every(i=>this.selHas(i)))}</th>
          <th>${Noun()}</th><th>Number</th><th>Status</th><th>Right now</th>
          <th class="num">Deposit</th><th class="num">Rentals</th>
          <th class="num">Earned today</th><th class="num">Lifetime</th>
          <th class="num">Idle</th><th class="num">Payback</th>
        </tr></thead><tbody>
        ${!list.length ? `<tr><td colspan="12" class="muted" style="padding:22px;text-align:center">
            No ${noun(1)} match this filter.</td></tr>` : list.map(v=>{
          const rc = rateOf(v);
          const r = openOf(v);
          const docs = this.docWarn(v);
          const noRate = noRateOf(v);
          const b = bucketOf(v);
          const idle = this.idleDays(v);
          const et = this.earnedToday(v);
          const life = this.earnedBy(v);
          const sel = this.selHas(v.id);
          const overdue = r && r.dueAt && Date.now() > r.dueAt;
          const railCls = b===0?'s-out':(b===2?'s-svc':'s-ok');

          /* "Right now": two lines answering what this bike is doing and the
             one fact that follows from it. Replaces the old Papers column,
             which could only ever say "ok" — the interesting cases all live
             here now, together, instead of split across three columns. */
          let l1, l2, warn = false;
          if (r){
            l1 = overdue ? 'Overdue' : 'With ' + esc(r.customerName || 'a customer');
            l2 = overdue ? 'With ' + esc(r.customerName||'a customer') + ' \u00b7 due ' + esc(fmtDT(r.dueAt))
                         : 'Due ' + esc(fmtDT(r.dueAt));
            warn = !!overdue;
          } else if (noRate){
            l1 = 'Rate not set \u2014 cannot go out'; l2 = 'Set a price to rent this out'; warn = true;
          } else if (docs){
            l1 = esc(docs); l2 = 'Blocked at checkout'; warn = true;
          } else if (v.status==='maintenance'){ l1 = 'In maintenance'; l2 = 'Marked unavailable'; warn = true;
          } else if (v.status==='retired'){ l1 = 'Retired'; l2 = 'Not in service'; warn = true;
          } else {
            l1 = idle===null ? 'Ready' : (idle<=0 ? 'Back today' : 'Idle '+idle+' day'+(idle===1?'':'s'));
            l2 = rc && rc.tiers && rc.tiers.h24 ? money(rc.tiers.h24)+'/day' : 'Ready to rent';
          }

          /* Payback as a bar: 4% against 134% is a shape before it is a
             number, which is the comparison an owner is actually making. */
          const pb = v.cost ? Math.min(999, Math.round(life/v.cost*100)) : null;
          const pbCol = pb===null ? '' : (pb>=100 ? 'var(--success)' : (pb<25 ? 'var(--danger)' : 'var(--p-mid)'));

          return `<tr class="${railCls}${sel?' sel':''}" onclick="R.editVehicle('${v.id}')">
            <td class="rail"></td>
            <td class="selcol" onclick="event.stopPropagation();R.selToggle('${v.id}')">${this.cbox(sel)}</td>
            <td><div class="nm">${esc(vLabel(v))}</div>${
              v.model?`<div class="dfl-sub">${esc(v.model)}</div>`:''}</td>
            <td class="dfl-plate">${esc(v.regNo)||'\u2014'}</td>
            <td><span class="pill ${b===0?'out':(b===2?(noRate?'late':'maint'):'ok')}">${
              b===0?'OUT':(b===2?(noRate?'NO RATE':'BLOCKED'):'READY')}</span></td>
            <td><div class="dfl-who${warn?' warn':''}">${l1}</div>
              <div class="dfl-sub">${l2}</div></td>
            <td class="num">${rc && this.rateReady(rc) ? money(rc.deposit) : '\u2014'}</td>
            <td class="num">${this.tripsBy(v)}</td>
            <td class="num"><span class="dfl-earn${et?'':' nil'}">${et?money(et):'\u2014'}</span></td>
            <td class="num">${money(life)}</td>
            <td class="num" ${idle!=null && idle>30 ? 'style="color:var(--danger);font-weight:850"':''}>${
              idle==null?'\u2014':idle}</td>
            <td class="num">${pb===null ? '<span class="muted">\u2014</span>' :
              `<div class="dfl-pb"><div class="dfl-pb-t"><div style="width:${
                Math.min(100,pb)}%;background:${pbCol}"></div></div>
                <span class="dfl-pb-n" style="color:${pb>=100?'var(--success-d)':(pb<25?'var(--danger)':'var(--t2)')}">${pb}%</span></div>`}</td>
          </tr>`;
        }).join('')}
