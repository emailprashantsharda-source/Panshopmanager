const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const Cloud = {
  uid:null, shopId:null, role:null, shopName:'', ready:false,
  pending:0, online:navigator.onLine, _unsub:[], _conf:null,

  /* ── boot ─────────────────────────────────────────────────────── */
  boot(){
    /* Something honest on screen while Firebase initialises, instead of a
       blank blue wall that reads as a hang. */
    try {
      const g = $('gate');
      if (g && g.style.display !== 'none') {
        this.showGate('<div class="gate-load"><div class="gate-spin"></div>'
          + '<div>Opening your shop\u2026</div></div>');
        g.style.display = 'flex';
      }
    } catch(e){}
    window.addEventListener('online',  ()=>{ this.online=true;  this.chip(); });
    window.addEventListener('offline', ()=>{ this.online=false; this.chip(); });
    onSnapshotsInSync(db, ()=>{ this.pending=0; this.chip(); });
    onAuthStateChanged(auth, async u => {
      if (!u) { this.uid=null; this.showGate(); return; }
      this.uid = u.uid;
      await this.afterLogin();
    });
  },

  /* ── auth ─────────────────────────────────────────────────────── */
  showGate(html){
    $('gate').style.display='flex';
    $('gate-body').innerHTML = html || `
      <div class="fld"><label class="lbl">Mobile number</label>
        <input class="in" id="g-phone" type="tel" inputmode="numeric" maxlength="10"
          placeholder="10 digits"></div>
      <button class="btn y" id="g-send" onclick="Cloud.sendOtp()">Send OTP</button>
      <div id="g-err" class="gate-err"></div>
      <div id="recap"></div>
      <p style="opacity:.65;font-size:11.5px;margin:14px 0 0;line-height:1.5">
        We send a one-time code by SMS. No password to remember.</p>`;
    /* The landing page collects the number and passes it as ?ph=. Without this
       the shop types it, taps Continue, and is asked for it again on the very
       next screen — which reads as the first tap having failed.
       
       Prefilled, not auto-sent: firing an OTP because someone opened a link
       spends the shop's SMS quota on a visit that may be an accident, and
       Firebase phone auth is billed per message. One tap is a fair price for
       not being surprised. */
    try {
      const ph = (new URLSearchParams(location.search).get('ph')||'')
                   .replace(/[^0-9]/g,'').slice(-10);
      if (ph.length === 10){
        const el = $('g-phone');
        if (el){
          el.value = ph;
          const b = $('g-send');
          if (b) b.textContent = 'Send OTP to ' + ph;
          /* Clear it from the address bar so a shared or bookmarked link does
             not carry someone else's number. */
          history.replaceState(null, '', location.pathname);
        }
      }
    } catch(e){}
  },
  hideGate(){ $('gate').style.display='none'; },
  /* The gate covers the whole screen at z-index 900, so anything reported
     only through a toast is invisible here. Errors go inline. */
  gateErr(msg){
    const el = $('g-err'); if (!el) { window.toast(msg); return; }
    if (!msg){ el.classList.remove('on'); el.innerHTML=''; return; }
    el.innerHTML = esc(msg); el.classList.add('on');
  },
  gateBusy(on, label){
    const b = $('g-send'); if (!b) return;
    b.disabled = !!on; b.textContent = on ? (label||'Please wait…') : 'Send OTP';
  },

  hap(kind){ try { if (window.Haptic) window.Haptic[kind||'primary'](); } catch(e){} },

  async sendOtp(){
    this.hap('primary');
    const ph = ($('g-phone').value||'').replace(/\D/g,'').slice(-10);
    if (ph.length!==10) return this.gateErr('Enter a 10-digit mobile number');
    this.gateErr('');
    this.gateBusy(true, 'Sending OTP…');
    try {
      if (!this._verifier)
        this._verifier = new RecaptchaVerifier(auth, 'recap', { size:'invisible' });
      this._conf = await signInWithPhoneNumber(auth, '+91'+ph, this._verifier);
      this.gateBusy(false);
      this.showGate(`
        <p style="opacity:.8;font-size:14px;margin:0 0 16px">OTP sent to +91 ${esc(ph)}</p>
        <div class="fld"><input class="in" id="g-otp" type="tel" inputmode="numeric" maxlength="6"
          placeholder="6-digit OTP"></div>
        <button class="btn y" onclick="Cloud.verifyOtp()">Verify &amp; continue</button>
        <button class="btn ghost" style="margin-top:9px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)"
          onclick="Cloud.showGate()">Change number</button>`);
    } catch(e){
      console.error('sendOtp', e);
      this.gateBusy(false);
      const code = (e && e.code) || '';
      const map = {
        'auth/invalid-app-credential':
          'Phone sign-in is blocked for this site. In Firebase Console → Authentication → Settings → Authorised domains, make sure this exact domain is listed.',
        'auth/too-many-requests':
          'Too many attempts from this device. Wait a few minutes and try again.',
        'auth/invalid-phone-number': 'That number is not valid.',
        'auth/quota-exceeded': 'Daily SMS limit reached on this project.',
        'auth/operation-not-allowed':
          'Phone sign-in is switched off. Firebase Console → Authentication → Sign-in method → enable Phone.',
        'auth/network-request-failed': 'No internet connection.'
      };
      this.hap('error');
      this.gateErr((map[code] || 'Could not send OTP.') + (code ? ' [' + code + ']' : ''));
      /* Rebuild the verifier: a burned reCAPTCHA cannot be reused. */
      try { if (this._verifier) { this._verifier.clear(); this._verifier=null; } } catch(_){}
      const c = $('recap'); if (c) c.innerHTML='';
    }
  },

  async verifyOtp(){
    this.hap('primary');
    const code = ($('g-otp').value||'').replace(/\D/g,'');
    if (code.length<6) return window.toast('Enter the 6-digit OTP');
    try { this.gateBusy(true,'Checking…'); await this._conf.confirm(code); }
    catch(e){
      console.error('verifyOtp', e);
      this.gateBusy(false);
      this.gateErr((e && e.code === 'auth/invalid-verification-code')
        ? 'That OTP is wrong. Check the SMS and try again.'
        : 'Could not verify — ' + ((e && e.code) || 'try again'));
    }
  },

  /* Boot used to be six sequential round trips before a single pixel of the
     app appeared: read rn_members, run the invite query, read rn_members
     again, read the shop, write lastShopId, then render. On a shop's
     connection that is the ten seconds.

     Firestore already keeps a local mirror, so if we know which shop to open
     we can attach the listeners immediately and they answer from IndexedDB
     while the network catches up. The shop id is remembered on this device
     for exactly that reason. Everything that is not needed to draw the first
     screen — claiming staff invites, repairing membership — happens after. */
  async afterLogin(){
    let last = null;
    try { last = localStorage.getItem('rn_last_shop_' + this.uid); } catch(e){}
    if (last) {
      let role = null;
      try { role = localStorage.getItem('rn_last_role_' + this.uid); } catch(e){}
      this.role = role || 'owner';
      this.open(last);                       /* not awaited — draws from cache */
      this.afterLoginSlow();                 /* verify + invites in the background */
      return;
    }
    const mref = doc(db, 'rn_members', this.uid);
    let m = null;
    try { const snap = await getDoc(mref); m = snap.exists() ? snap.data() : null; } catch(e){}
    let shops = (m && m.shops) ? Object.keys(m.shops) : [];
    if (!shops.length) {
      /* Only pay for the invite query when there is nothing else to open. */
      await this.claimInvites();
      try { const s2 = await getDoc(mref); m = s2.exists() ? s2.data() : m; } catch(e){}
      shops = (m && m.shops) ? Object.keys(m.shops) : [];
    }
    if (!shops.length) return this.askShop();
    const pick = (m.lastShopId && shops.includes(m.lastShopId)) ? m.lastShopId : shops[0];
    this.role = m.shops[pick];
    await this.open(pick);
  },

  /* Runs after the app is on screen. Nothing here blocks the first paint. */
  async afterLoginSlow(){
    try {
      await this.claimInvites();
      const snap = await getDoc(doc(db, 'rn_members', this.uid));
      const m = snap.exists() ? snap.data() : null;
      const shops = (m && m.shops) ? Object.keys(m.shops) : [];
      /* Used to require shops.length here too — "the remembered shop is
         gone, but only clean it up if you have somewhere else to go."
         That left a real gap: an account with NO valid memberships at all
         (test data wiped, staff access removed, anything that zeroes out
         `shops`) never satisfied the old shops.length check, so the stale
         shopId in localStorage was never cleared. afterLogin()'s fast path
         re-opens it optimistically on every single login regardless, every
         listener denies against a shop this account can't access, and no
         amount of retrying — however patient — fixes that, because it
         isn't a timing problem. This is what the "vehicleStats/bookings
         permission-denied, unrecovering across logins" reports were. */
      if (this.shopId && !shops.includes(this.shopId)) {
        try { localStorage.removeItem('rn_last_shop_' + this.uid); } catch(e){}
        if (shops.length) {
          /* Another valid shop exists — reload picks it up via afterLogin()'s
             members-doc path now that the stale cache is gone. */
          location.reload();
        } else {
          /* Nowhere else to go. Tear down the listeners aimed at the
             inaccessible shop and send them to create one, instead of
             reloading into the exact same dead end. */
          this._unsub.forEach(f=>{ try{f();}catch(e){} }); this._unsub=[];
          this.shopId = null; this.role = null; this.shop = null;
          this.askShop();
        }
      } else if (m && m.shops && m.shops[this.shopId]) {
        this.role = m.shops[this.shopId];
        try { localStorage.setItem('rn_last_role_' + this.uid, this.role); } catch(e){}
      }
    } catch(e){ console.warn('afterLoginSlow', e); }
  },

  askShop(){
    this.showGate(`
      <p style="opacity:.8;font-size:14px;margin:0 0 18px">Set up your rental business.</p>
      <div class="fld"><label class="lbl">Business name</label>
        <input class="in" id="g-shop" placeholder="Rapid Rent Services"></div>
      <div class="fld"><label class="lbl">City</label>
        <input class="in" id="g-city" placeholder="Bhopal"></div>
      <button class="btn y" onclick="Cloud.createShop()">Create business</button>`);
  },

  async createShop(){
    this.hap('primary');
    const name = ($('g-shop').value||'').trim();
    if (!name) return window.toast('Business name is required');
    const shopId = 'rs_' + this.uid.slice(0,6) + '_' + Date.now().toString(36);
    try {
      /* TWO commits, deliberately.

         Rules evaluate a batch against the state BEFORE it runs, so any write
         guarded by rnIsOwner() fails if the membership doc granting ownership
         is created in that same batch — the rule reads a member document that
         does not exist yet. Seeding rates and vehicles alongside the shop
         therefore failed the whole batch with permission-denied.

         So: establish identity first, then write everything that depends on
         it. */
      const b1 = writeBatch(db);
      b1.set(doc(db,'rn_shops',shopId), {
        name, city: ($('g-city').value||'').trim(), ownerUid: this.uid,
        orgId: null, createdAt: serverTimestamp(),
        /* openRentals and depositsHeld used to be written here as 0 and never
           touched again — two fields that looked like live counters and were
           always zero. The admin panel computes both server-side from the
           rentals themselves, which cannot drift and cannot be edited by the
           shop whose liability it measures. */
      });
      b1.set(doc(db,'rn_shops',shopId,'members',this.uid), {
        role:'owner', phone: (auth.currentUser.phoneNumber||''), addedAt: serverTimestamp()
      });
      b1.set(doc(db,'rn_members',this.uid), {
        shops: { [shopId]: 'owner' }, lastShopId: shopId,
        phone: (auth.currentUser.phoneNumber||'')
      }, { merge:true });
      await b1.commit();
      this.role='owner';

      /* No catalogue is written here any more.
         
         This used to commit ten rate cards and ten vehicles, so the first
         screen a brand-new shop saw was ten bikes it did not own, priced at
         zero, none of which could be rented out. A shopkeeper cannot tell
         that from a real fleet, and the only honest reading of it is that the
         app has already got his business wrong.
         
         A shop now starts empty and R.obCard() walks him through it: either
         photograph the printed rate card he already has, or add bikes one at a
         time. seedCatalogue() still exists as a manual button for anyone who
         actually wants the full model list. */

      await this.open(shopId);
    } catch(e){
      console.error(e);
      /* INTERNAL ASSERTION FAILED is a Firestore SDK bug in its local
         persistence layer, not anything this app's code can catch or
         retry around — by the time it surfaces, the write may or may not
         have gone through, and the SDK's IndexedDB state for this origin
         is in an inconsistent place. The one reliable recovery, since it's
         a storage problem rather than a network or permissions one, is a
         clean storage context: an Incognito/Private window sidesteps
         whatever's wrong in the normal profile entirely. Telling someone
         to "close other tabs" for a raw SDK internal-assertion string
         would send them down the wrong troubleshooting path. */
      const msg = (e && e.message) || '';
      if (msg.indexOf('INTERNAL ASSERTION FAILED') !== -1){
        window.toast('Something is wrong with this browser\'s local storage for this site. Try again in a Private/Incognito window, or a different browser.');
      } else {
        window.toast('Could not create business — '+(e.code||e.message));
      }
    }
  },

  /* ── open a shop: scoped listeners ────────────────────────────── */
  async open(shopId){
    this.shopId = shopId;
    this._unsub.forEach(f=>{ try{f();}catch(e){} }); this._unsub=[];
    const S = p => collection(db,'rn_shops',shopId,p);

    /* One retry, specifically on permission-denied, for every listener here —
       not just the two silenced ones below. The stack trace that led to this
       comment showed /bookings failing alongside /vehicleStats on a brand-new
       shop's first open, both gated by the exact same rnIsMember(shopId) — a
       rule this change never touched. That rules out a rules-authoring
       mistake specific to one collection; what's left is a timing race:
       a listener can attach a beat before the membership doc that grants
       rnIsMember() is visible to a fresh Listen request, worse on a shaky
       connection (the session that surfaced this was full of QUIC/DNS
       errors). The retry is scoped to permission-denied on purpose — other
       error codes (offline, resource-exhausted) aren't a timing problem and
       a delayed retry wouldn't fix them, only hide them longer.

       `silent`: for listeners the app can run without (daily rollups,
       vehicle stats) — a hiccup here, if the retry doesn't clear it,
       shouldn't put a scary "Sync error" toast in front of someone whose
       very first screen this might be, for a collection that's legitimately
       empty and blocks nothing they can actually do. Still logged to
       console either way; this only suppresses the toast, never the retry.

       Each attach — including the retry — pushes its own unsub into
       _unsub directly, rather than bind() returning one unsub to push.
       The retry creates a brand-new onSnapshot registration; if that
       return value isn't tracked too, switching shops before the retry
       fires would leave the retried listener running against the old
       shop forever. */
    /* Backoff schedule for the permission-denied retry: 1.5s, then 3.5s.
       One shot at a fixed 1.5s was enough for a clean network but not for
       the session that surfaced this — full of QUIC/DNS errors — where the
       membership doc plausibly took longer than 1.5s to become visible to
       a fresh Listen request. Two tries, backing off, costs nothing on a
       healthy connection (the first one just succeeds) and gives a slow one
       real room before the toast gives up on it. */
    const RETRY_DELAYS_MS = [1500, 3500];
    const bind = (q, key, after, silent) => {
      let tries = 0;
      const attach = () => {
        this._unsub.push(onSnapshot(q, snap => {
          if (!window.DB || !window.DB.d) { console.error('DB not exposed to module'); return; }
          window.DB.d[key] = snap.docs.map(d => Object.assign({ id:d.id }, d.data()))
                                  .filter(x => !x.deletedAt);
          this.pending = snap.metadata.hasPendingWrites ? this.pending : 0;
          this.chip();
          if (after) after();
          if (this.ready && window.R) window.R.render();
        }, err => {
          console.error(key, err.code||err, 'try', tries);
          if (err.code === 'permission-denied' && tries < RETRY_DELAYS_MS.length){
            setTimeout(attach, RETRY_DELAYS_MS[tries]); tries++; return;
          }
          if (!silent) window.toast('Sync error on '+key);
        }));
      };
      attach();
    };

    bind(S('vehicles'), 'vehicles');
    bind(S('rates'), 'rates');
    /* Bookings are small, few and needed on every screen, so a live listener
       is right. Cancelled and converted ones are filtered client-side rather
       than queried, because a shop wants to see last week's no-shows. */
    bind(S('bookings'), 'bookings');
    /* HOT SET ONLY: open rentals. Closed history is paged on demand so
       this listener never grows with the age of the business. */
    bind(query(S('rentals'), where('status','==','open')), 'rentals');
    /* Settled rentals are deliberately NOT in a live listener — at 70k a year
       that grows without bound. But revenue still has to be visible, so the
       daily rollups written at settle carry it: one small document per day,
       which is all the dashboard and the Money tab actually need. */
    /* orderBy(documentId()) descending, NOT unordered. A limit() with no
       ordering is not "the cheapest 800" — Firestore returns documents in
       document-id order, and these ids are date keys (2026-08-12), so an
       unordered limit silently returned the 800 OLDEST days and dropped
       the newest. A shop past 800 days of history, or one whose repair run
       created a long historical range, settled a rental and watched Money
       still read zero: the write had landed, the listener just never asked
       for that day. Descending puts today first, which is the one day that
       must never fall outside the window.
       (An earlier note here said orderBy was unnecessary; that was true
       only while the collection was smaller than the limit.) */
    bind(query(S('daily'), orderBy(documentId(), 'desc'), limit(800)), 'daily', null, true);
    /* One doc per vehicle — bounded by fleet size, not rental history, same
       reasoning as /daily. This is what Fleet's Earned/Idle days read. */
    bind(S('vehicleStats'), 'vehicleStats', null, true);



    /* Same permission-denied retry as bind() below, hand-rolled here since
       this listener's job (this.shop/this.shopName/this.role) doesn't fit
       bind()'s generic DB.d[key] shape. Previously had no error callback at
       all, so if this hit the exact race that surfaced on /bookings and
       /vehicleStats — a listener attaching a beat before the membership doc
       is visible — it would fail completely silently: no console line, no
       toast, just this.shop staying null forever with nothing to explain
       why. healMembership() below is a self-heal for a genuinely missing
       membership doc, but does nothing for a listener that simply needs
       to be asked again a moment later. */
    let shopTries = 0;
    const attachShop = () => {
      this._unsub.push(onSnapshot(doc(db,'rn_shops',shopId), sd => {
        this.shop = sd.exists() ? sd.data() : null;
        this.shopName = this.shop ? (this.shop.name||'') : '';
        /* The shop document is the authority on who owns the business, so a
           missing membership record can no longer strip the owner of their
           own account. */
        if (this.shop && this.shop.ownerUid === this.uid) this.role = 'owner';
        if (this.ready && window.R) window.R.render();
      }, err => {
        console.error('shop', err.code||err, 'try', shopTries);
        if (err.code === 'permission-denied' && shopTries < RETRY_DELAYS_MS.length){
          setTimeout(attachShop, RETRY_DELAYS_MS[shopTries]); shopTries++;
        }
      }));
    };
    attachShop();

    /* Self-heal. If the membership record never landed — a dropped batch, a
       first-signup race — write it now rather than leaving the account in a
       state only a support call could explain. Rules permit a user to create
       their own membership doc, so this needs nothing from the shopkeeper. */
    setTimeout(() => { this.healMembership(shopId).catch(e => console.warn('heal', e)); }, 1200);
    bind(collection(db,'rn_shops',shopId,'members'), 'members');
    /* Remembered so the next launch can attach listeners before any network
       round trip completes. */
    try {
      localStorage.setItem('rn_last_shop_' + this.uid, shopId);
      if (this.role) localStorage.setItem('rn_last_role_' + this.uid, this.role);
    } catch(e){}
    /* Not awaited: nothing on screen depends on it. */
    setDoc(doc(db,'rn_members',this.uid), { lastShopId: shopId }, { merge:true }).catch(()=>{});

    this.ready = true;
    this.hap('success');
    this.hideGate();
    /* There used to be a silent seedCatalogue() here, firing 2.5s after any
       shop with no rate cards finished opening. It was the second of two
       seeders — removing the one in createShop() did nothing, because this one
       refilled the shop on the next open. Ten bikes kept coming back and it
       looked like the fix had not deployed.
       
       Both are gone now. An empty shop stays empty and R.obCard() walks the
       owner through setting it up, which is the honest version of "a business
       with no models cannot rent anything out". */
    this.chip();
    await this.maybeMigrate();
    if (window.R) window.R.render();
  },

  async healMembership(shopId){
    try {
      const mref = doc(db,'rn_shops',shopId,'members',this.uid);
      const m = await getDoc(mref);
      if (m.exists()) { this.role = m.data().role || this.role; return; }
      const sd = await getDoc(doc(db,'rn_shops',shopId));
      if (!sd.exists()) return;
      const isOwner = sd.data().ownerUid === this.uid;
      await setDoc(mref, {
        role: isOwner ? 'owner' : 'counter',
        phone: (auth.currentUser && auth.currentUser.phoneNumber) || '',
        addedAt: serverTimestamp(), healed: true
      }, { merge:true });
      await setDoc(doc(db,'rn_members',this.uid),
        { shops: { [shopId]: isOwner ? 'owner' : 'counter' } }, { merge:true });
      this.role = isOwner ? 'owner' : 'counter';
      console.info('membership repaired', shopId, this.role);
    } catch(e){ console.warn('healMembership', e); }
  },

  /* ── local -> cloud migration, once, never destructive ─────────── */
  async maybeMigrate(){
    let blob = null;
    try { blob = localStorage.getItem('rn_data_v1'); } catch(e){}
    if (!blob) return;
    let d; try { d = JSON.parse(blob); } catch(e){ return; }
    /* Only offer to upload REAL work. Seeded catalogue rows are not the
       user's data, and asking about them once was noise; asking every load
       was a bug. Rentals are the signal that this device did real business
       before the account existed. */
    const n = (d.rentals||[]).length;
    if (!n) { this.stashLocal(); return; }
    if (!confirm('This device has '+n+' rental'+(n===1?'':'s')+' saved offline.\n\nUpload to your account?\n\n(Your local copy is kept either way.)')) {
      this.stashLocal(); return;
    }
    try {
      const b = writeBatch(db);
      const map = {};
      (d.rates||[]).forEach(r=>{ const id='mg_'+r.id; map[r.id]=id;
        b.set(doc(db,'rn_shops',this.shopId,'rates',id), { model:r.model, deposit:r.deposit, tiers:r.tiers, ot:r.ot }); });
      (d.vehicles||[]).forEach(v=>{ const id='mg_'+v.id; map[v.id]=id;
        b.set(doc(db,'rn_shops',this.shopId,'vehicles',id), {
          name:v.name||v.regNo||'', regNo:v.regNo||'', rateId:map[v.rateId]||v.rateId||'',
          model:v.model||'', status:v.status||'available', cost:v.cost||0,
          insExpiry:v.insExpiry||'', pucExpiry:v.pucExpiry||'', odo:v.odo||0 }); });
      (d.rentals||[]).forEach(r=>{ const id='mg_'+r.id;
        b.set(doc(db,'rn_shops',this.shopId,'rentals',id), Object.assign({}, r, {
          vehicleId: map[r.vehicleId]||r.vehicleId,
          dayKey: localDayKey(r.outAt),
          migrated:true })); });
      await b.commit();
      this.stashLocal();
      window.toast('Uploaded '+n+' records to your account');
    } catch(e){
      console.error('migrate', e);
      window.toast('Upload failed — your local copy is safe');
    } finally {
      /* Stash regardless. Leaving the blob in place after a failure meant the
         prompt returned on every load with no way to dismiss it. */
      this.stashLocal();
    }
  },
  /* Rename rather than delete: an unrecoverable migration is far more
     expensive than a few KB of stale storage. */
  stashLocal(){
    try {
      const v = localStorage.getItem('rn_data_v1');
      if (v){ localStorage.setItem('rn_data_v1_migrated_'+Date.now(), v);
              localStorage.removeItem('rn_data_v1'); }
    } catch(e){}
  },

  /* ── writes ───────────────────────────────────────────────────── */
  p(coll, id){ return doc(db,'rn_shops',this.shopId,coll,id); },

  /* The shop document itself. Nothing wrote to it after creation until now —
     the app set it once and never touched it again, which is why the rules
     whitelist for updates is so small. merge:true so a patch cannot wipe
     fields the webhook owns, and the same {ok,code} shape as put() so callers
     handle a refusal identically.

     A permission-denied here almost certainly means the field is not in
     rnShopEditableFields(). Worth knowing, because the failure is otherwise
     invisible: the local copy updates, the screen looks right, and the change
     is gone on the next reload. */
  async putShop(patch){
    if (!this.shopId) return { ok:false, code:'no-shop' };
    this.pending++; this.chip();
    try {
      await setDoc(doc(db,'rn_shops',this.shopId), patch, { merge:true });
      this.shop = Object.assign({}, this.shop||{}, patch);
      return { ok:true };
    } catch(e){
      console.error('putShop', e);
      return { ok:false, code:(e&&e.code)||'unknown', msg:(e&&e.message)||'' };
    } finally { this.pending = Math.max(0,this.pending-1); this.chip(); }
  },
  nid(pre){ return pre+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); },

  /* ── trial / entitlement ──────────────────────────────────────
     Trial is derived from the shop's createdAt rather than a separate
     writable field: one less thing a client could reset, and it cannot
     drift out of step with the shop record. subscriptionExpiry stays
     Cloud-Function-only, so a shop can never grant itself a licence. */
  TRIAL_DAYS: 14,
  /* Renewal notice is deliberately wider than the trial's 5 days: a yearly
     invoice is a bigger decision, often needs someone else's money, and a
     seasonal shop wants to renew before the season, not after it.

     It has to scale with the term. A flat 30 days on a 30-day plan means a
     monthly customer opens the app to an amber "renew now" warning every
     single day he is a customer — which is not a reminder, it is a nag, and
     it teaches him to ignore the one banner that will eventually matter.

     When the cycle is unknown we use the monthly window. Under-warning a
     yearly customer by three weeks is recoverable; permanently crying wolf
     at a monthly one is not. */
  RENEW_WARN_DAYS: 30,
  RENEW_WARN_DAYS_MONTHLY: 7,
  /* Term length, for the progress bar and the warning window. */
  cycleDays(cycle){ return /ann|year/.test(String(cycle||'')) ? 365 : 30; },

  /* ── entitlement discovery ──────────────────────────────────────
     The webhook is the only writer of these fields and this app does not
     get to see its source. So rather than hard-coding a list of field
     names and hoping, the app reads the shop document and works out for
     itself which field carries the expiry, which carries the tier and
     which carries the billing cycle.

     The bias is deliberate and one-directional: where the evidence is
     ambiguous, resolve in favour of the shop being PAID. Getting that
     wrong the generous way costs a few free days. Getting it wrong the
     mean way means a shopkeeper who just sent ₹12,990 opens the app,
     reads "trial ended", and asks for his money back. Those two errors
     are not the same size, so they do not get the same treatment. */

  /* Date fields that exist on a shop document but are not entitlements.
     trial* is on this list on purpose — the trial is already derived from
     createdAt, and reading a trialEndsAt field as a subscription would
     hand a free paid plan to every shop that ever signed up. */
  _DATE_DENY: ['createdat','updatedat','modifiedat','changedat','lastseen','lastactive',
    'lastsync','lastbill','lastlogin','deletedat','openedat','closedat','dob','doj',
    'insexpiry','pucexpiry','fitnessexpiry','permitexpiry',
    'trialend','trialends','trialendsat','trialexpiry','trialexpiresat','trialtill',
    'trialuntil','trialstart','trialstarted'],

  _norm(k){ return String(k||'').toLowerCase().replace(/[^a-z0-9]/g,''); },

  /* Does this field name read like "when the paid thing stops working"?
     Returns a confidence, 0 for no. Two words have to agree — a subject
     (subscription, plan, licence, premium) and an edge (expiry, until,
     valid till) — before we trust it, which is what keeps `lastBillDate`
     and a vehicle's `insExpiry` out. */
  _expiryScore(k){
    const n = this._norm(k);
    if (this._DATE_DENY.indexOf(n) >= 0) return 0;
    const subject = /(subscription|subscri|^sub|plan|licen|billing|premium|paid|member|entitle|pro)/.test(n);
    const edge    = /(expiry|expires|expire|expiring|end|ends|till|until|upto|uptil|valid|renew|good|active)/.test(n);
    if (subject && edge) return 3;                 /* subscriptionExpiry, planValidTill */
    if (subject && /(at|date|on|ms|time|stamp)$/.test(n)) return 2;  /* subscribedUntilDate */
    if (edge && /(valid|paid|premium|active)/.test(n)) return 2;     /* validTill, paidUntil */
    if (edge) return 1;                            /* bare expiresAt — weak but read it */
    return 0;
  },

  /* Not before this product existed, and not so far out that it can only be
     a bug. The upper bound is a century rather than a few years on purpose:
     a support agent granting someone a lifetime licence types 2099, and that
     must read as paid, not as garbage. */
  _MIN_ENT_MS: Date.UTC(2024, 0, 1),
  _MAX_ENT_MS: Date.UTC(2125, 0, 1),
  _plausibleDate(ms){
    return ms >= this._MIN_ENT_MS && ms <= this._MAX_ENT_MS;
  },

  /* Walks the shop document, top level and one level of nesting, so a
     webhook that writes { subscription: { expiry, tier, cycle } } is read
     exactly as well as one that writes flat fields. */
  _scanEntitlement(){
    const out = { expMs:0, expKey:null, tier:null, tierKey:null,
                  cycle:null, cycleKey:null, scanned:0, candidates:[] };
    const sh = this.shop;
    if (!sh || typeof sh !== 'object') return out;
    const self = this;
    const plans = (window.R && window.R.PLANS) ? window.R.PLANS : [];
    const found = [];

    const isStamp = v => v && typeof v === 'object' &&
      (typeof v.toMillis === 'function' || v.seconds !== undefined);

    function visit(obj, parentKey, depth){
      Object.keys(obj).forEach(function(k){
        const v = obj[k];
        const path = parentKey ? parentKey + '.' + k : k;
        /* Nested keys are tested joined to their parent, so { subscription:
           { expiry } } scores the same as subscriptionExpiry. */
        const nameForTest = parentKey ? parentKey + k : k;
        out.scanned++;

        const score = self._expiryScore(nameForTest);
        if (score){
          const ms = self._ms(v);
          if (ms && self._plausibleDate(ms)) found.push({ path, ms, score });
        }

        if (typeof v === 'string' || typeof v === 'number'){
          const nk = self._norm(nameForTest);
          const val = String(v).toLowerCase();
          /* Tier is only read from tier-ish keys, never from any string in
             the document — otherwise a shop named "Pro Bikes" buys itself a
             Pro plan. Matched on a word boundary so "growth" in
             "rentalnow_growth_annual" is found and "progress" is not. */
          if (!out.tier && /(tier|plan|package|product|sku|subscription|subscri|sub|level|slab)/.test(nk)){
            for (let i=0;i<plans.length;i++){
              if (new RegExp('(^|[^a-z])' + plans[i].id + '([^a-z]|$)').test(val)){
                out.tier = plans[i].id; out.tierKey = path; break;
              }
            }
          }
          if (!out.cycle && /(cycle|billing|interval|period|term|duration|plan|product|sku|subscription|subscri|sub)/.test(nk)){
            if (/(annual|annually|yearly|year|12m|1y)/.test(val)){ out.cycle='annual'; out.cycleKey=path; }
            else if (/(monthly|month|30d|1m)/.test(val)){ out.cycle='monthly'; out.cycleKey=path; }
          }
        }

        if (depth < 1 && v && typeof v === 'object' && !Array.isArray(v) && !isStamp(v)){
          visit(v, k, depth + 1);
        }
      });
    }
    try { visit(sh, '', 0); } catch(e){ console.warn('entitlement scan', e); }

    /* Anything still in the future wins over anything already past, whatever
       the field is called. That is the generous direction, and it is the one
       that never locks a paying shop out over a naming disagreement. */
    const now = Date.now();
    found.sort(function(a,b){
      const fa = a.ms > now ? 1 : 0, fb = b.ms > now ? 1 : 0;
      return (fb - fa) || (b.score - a.score) || (b.ms - a.ms);
    });
    if (found.length){ out.expMs = found[0].ms; out.expKey = found[0].path; }
    out.candidates = found;
    return out;
  },

  /* onSnapshot hands over a fresh object each time, so identity is a valid
     cache key and the scan runs once per shop-document change rather than
     three or four times per render. */
  _entCache: null,
  entitlement(){
    if (this._entCache && this._entCache.doc === this.shop) return this._entCache.val;
    const val = this._scanEntitlement();
    this._entCache = { doc: this.shop, val };
    return val;
  },
  /* Firestore Timestamp, {seconds}, epoch millis, epoch seconds, a numeric
     string, or an ISO string. All six are things a payment webhook writes in
     the wild, and all six say the same true thing about when a plan ends.

     The unit repair at the bottom matters more than it looks. A function
     that stored seconds instead of milliseconds has not lied about the
     date — it has been off by a factor of 1000. Refusing to read it would
     lock a paying shop out over an arithmetic slip, which is the one
     outcome this whole module exists to prevent. */
  _ms(v){
    if (v === undefined || v === null || v === '') return 0;
    if (typeof v === 'boolean') return 0;
    if (typeof v.toMillis === 'function') { try { return v.toMillis(); } catch(e){ return 0; } }
    if (typeof v === 'object' && v.seconds != null) return Number(v.seconds) * 1000;
    let n = NaN;
    if (typeof v === 'number') n = v;
    else if (typeof v === 'string'){
      const str = v.trim();
      if (/^\d{9,19}$/.test(str)) n = Number(str);
      else { const t = Date.parse(str); return isNaN(t) ? 0 : t; }
    }
    if (!isFinite(n) || n <= 0) return 0;
    /* Scale into milliseconds. Bounded loops, so a duration like 365 still
       lands somewhere implausible and gets rejected downstream rather than
       being multiplied into a valid-looking date. */
    let guard = 0;
    while (n < 1e11 && guard++ < 6) n *= 1000;   /* seconds → millis */
    guard = 0;
    while (n > 1e14 && guard++ < 6) n /= 1000;   /* micro/nanos → millis */
    return Math.round(n);
  },
  trialInfo(){
    const c = this.shop && this.shop.createdAt;
    const created = c && c.toMillis ? c.toMillis() : (c || Date.now());
    const ends = created + this.TRIAL_DAYS * 86400000;
    const ent   = this.entitlement();
    const subMs = ent.expMs;
    const paid  = subMs > Date.now();
    const tier  = ent.tier;
    const cycle = ent.cycle;
    /* trialDaysLeft stays separate from subDaysLeft on purpose. One number
       serving both meant a paying shop's "days left" was silently the count
       since its trial died — a large negative number one render away from
       being shown to a customer who had just paid. */
    const trialDaysLeft = Math.ceil((ends - Date.now())/86400000);
    const subDaysLeft   = subMs ? Math.ceil((subMs - Date.now())/86400000) : 0;
    return { paid, ends, subEnds: subMs || 0, tier, cycle,
             /* daysLeft keeps its old trial meaning so existing callers,
                all of which are inside !paid branches, are unaffected. */
             daysLeft: trialDaysLeft, trialDaysLeft, subDaysLeft,
             renewSoon: paid && subDaysLeft <= (/ann|year/.test(cycle||'')
               ? this.RENEW_WARN_DAYS : this.RENEW_WARN_DAYS_MONTHLY),
             /* Carried so the diagnostic sheet can show a support caller
                exactly which field this shop's billing was read from. */
             src: ent,
             expired: !paid && Date.now() >= ends,
             active: paid || Date.now() < ends };
  },

  /* ── audit: append-only, created on every mutation ─────────────
     The one record that stays trustworthy after a bad build or a bad
     actor, because the rules deny update and delete on it. */
  audit(action, target, before, after){
    try {
      const id = this.nid('a');
      setDoc(this.p('audit', id), {
        action, target: target||'', actor: this.uid, role: this.role||'',
        before: before||null, after: after||null, at: Date.now()
      });
    } catch(e){ /* never block a user action on logging */ }
  },

  /* ── daily rollup: keeps reports O(days) not O(rentals) ────────── */
  /* Revenue and cash are different questions and a shopkeeper needs both:
     what he EARNED this week, and what actually came into the drawer. A
     deposit swallowed by an unpaid rent is earned but never refunded, and
     showing only one of those numbers makes the till look wrong. */
  rollup(dayKey, o){
    if (!dayKey){ console.error('rollup called with no dayKey', o); return; }
    try {
      setDoc(this.p('daily', dayKey), {
        rentals:     increment(o.rentals != null ? o.rentals : (o.revenue != null ? 1 : 0)),
        revenue:     increment(Number(o.revenue)||0),
        collected:   increment(Number(o.collected)||0),
        depositsIn:  increment(Number(o.depositsIn)||0),
        depositsOut: increment(Number(o.depositsOut)||0),
        outstanding: increment(Number(o.outstanding)||0),
        cashIn:      increment(Number(o.cashIn)||0),
        upiIn:       increment(Number(o.upiIn)||0),
        cashOut:     increment(Number(o.cashOut)||0),
        upiOut:      increment(Number(o.upiOut)||0),
        updatedAt: Date.now()
      }, { merge:true })
      /* setDoc is deliberately not awaited — a settle must not block on the
         network. But un-awaited also means a rejection surfaces nowhere, and
         `catch(e){}` below only ever caught the synchronous throw. A rollup
         that fails is a day of revenue that vanishes from Money while the
         rental itself looks settled, which is the hardest kind of bug to
         report and the hardest to find. rollupDelta already logs; this now
         matches it. */
        .catch(e => {
          console.error('rollup ' + dayKey, (e && e.code) || e);
          if (window.toast) toast('Earnings for ' + dayKey + ' did not save — tell your developer');
        });
    } catch(e){ console.error('rollup ' + dayKey, e); }
  },

  /* Repair for shops created before seeding moved server-side: their
     catalogue only ever existed on one device. Safe to run any time — it
     writes only what is missing. */
  async seedCatalogue(quiet){
    if (!this.shopId) { if (!quiet) window.toast('Sign in first'); return; }
    try {
      const D = window.DB && window.DB.d;
      if (!D) { window.toast('App not ready — reload and try again'); return; }
      /* seed() fills DB.d.rates with the catalogue template. The live lists
         are whatever the listeners have already delivered from Firestore. */
      const liveRates = (D.rates || []).slice();
      const liveVeh   = (D.vehicles || []).slice();
      window.seed();
      const tpl = (D.rates || []).slice();
      D.rates = liveRates;                    /* put the live view back */
      const b = writeBatch(db);
      let made = 0;
      tpl.forEach(rc => {
        const rid = 'rc_' + rc.model.toLowerCase().replace(/[^a-z0-9]+/g,'_');
        if (!liveRates.some(x => x.id === rid)) {
          b.set(this.p('rates', rid), { model: rc.model, deposit: rc.deposit, tiers: rc.tiers, ot: rc.ot });
          made++;
        }
        if (!liveVeh.some(x => x.id === 'v_'+rid)) {
          b.set(this.p('vehicles', 'v_'+rid), {
            name: rc.model, regNo: '', rateId: rid, model: rc.model,
            status: 'available', cost: 0, insExpiry: '', pucExpiry: '', odo: 0 });
        }
      });
      await b.commit();
      if (!quiet) window.toast(made ? ('Added ' + made + ' models') : 'Catalogue already complete');
    } catch(e){
      console.error('seedCatalogue', e);
      if (!quiet) window.toast('Could not add models — '+(e.code||e.message));
    }
  },

  /* Photo -> rows. Returns data only; nothing is saved until the user
     confirms every figure on screen. */
  async readRateCard(b64, mime){
    try {
      const fn = httpsCallable(fns, 'parseRateCard');
      const res = await fn({ imageB64: b64, mime });
      return (res && res.data) || { ok:false };
    } catch(e){
      console.error('readRateCard', e);
      return { ok:false, msg: (e && (e.message || e.code)) || 'failed' };
    }
  },

  /* Editing or voiding a settled bill has to unwind the totals it already
     fed into. increment() takes negatives, so a correction is just a delta —
     no recompute of the whole day, and no window where the figures are wrong. */
  async rollupDelta(dayKey, d){
    try {
      await setDoc(this.p('daily', dayKey), {
        rentals:     increment(Number(d.rentals)||0),
        revenue:     increment(Number(d.revenue)||0),
        collected:   increment(Number(d.collected)||0),
        depositsIn:  increment(Number(d.depositsIn)||0),
        depositsOut: increment(Number(d.depositsOut)||0),
        outstanding: increment(Number(d.outstanding)||0),
        cashIn:      increment(Number(d.cashIn)||0),
        upiIn:       increment(Number(d.upiIn)||0),
        cashOut:     increment(Number(d.cashOut)||0),
        upiOut:      increment(Number(d.upiOut)||0),
        updatedAt: Date.now()
      }, { merge:true });
      return { ok:true };
    } catch(e){ console.error('rollupDelta', e); return { ok:false, code:(e&&e.code)||'unknown' }; }
  },

  /* ── per-vehicle stats: what Fleet's Earned/Idle days columns read ──
     The rentals listener only ever holds OPEN rentals (see the note by it
     in open()) — closed history is deliberately kept out of it so the app
     doesn't listen to a collection that grows without bound. Fleet's old
     "Earned" and "Idle days" columns read straight off that listener, so
     they were reading a list that could never contain a closed rental:
     Earned was always ₹0, and Idle days fell back to "since this bike was
     added" for anything not mid-rental right now. This is the same fix as
     /daily — one small live-listened doc per vehicle, updated at the
     handful of places a vehicle's earnings or last-out time actually
     change, instead of scanning full rental history on every render. */
  bumpVehicleStat(vehicleId, patch){
    if (!vehicleId) return;
    try {
      const data = { updatedAt: Date.now() };
      if (patch.earned != null)      data.earned = increment(Number(patch.earned)||0);
      if (patch.closedTrips != null) data.closedTrips = increment(Number(patch.closedTrips)||0);
      /* Last-out time is a fact, not a delta — always the newest value, so
         it is set directly rather than incremented. Checkouts happen in
         chronological order, so "most recent write wins" is correct. */
      if (patch.lastOutAt != null)   data.lastOutAt = Number(patch.lastOutAt)||Date.now();
      /* Logged, not silent — same reasoning as rollup() above. A rejection
         here is why Fleet's Earned column reads zero, and swallowing it
         meant the only evidence was the wrong number itself. No toast: this
         is a secondary stat, and rollup() will already have complained if
         the whole write path is broken. */
      setDoc(this.p('vehicleStats', vehicleId), data, { merge:true })
        .catch(e => console.error('bumpVehicleStat ' + vehicleId, (e && e.code) || e));
    } catch(e){ console.error('bumpVehicleStat ' + vehicleId, e); }
  },

  /* ── one-time repair: rebuild /daily and /vehicleStats from the rentals
     themselves ──────────────────────────────────────────────────────
     Two bugs this fixes in one pass, since both read the exact same
     rental history:

     1) Every rollup site used to key its day-document by UTC date
        (toISOString) instead of the shop's local date, so any
        checkout/settle/cancel between 12:00am-5:29am IST posted to the
        wrong calendar day in /daily — the numbers behind the "Earned"
        hero and the Cash-vs-UPI cards on the Money page.

     2) Fleet's "Earned" and "Idle days" columns read the open-rentals
        listener, which can never contain a closed rental — Earned was
        always ₹0, and Idle days fell back to "since this bike was added"
        for anything not mid-rental right now.

     Both write paths are fixed now (see localDayKey and bumpVehicleStat),
     but the documents already written before the fix are still sitting
     there wrong. This does not patch them with deltas — deltas on top of
     an unknown-wrong number stay wrong. It ignores every existing /daily
     and /vehicleStats doc, replays every rental's known outcome
     (open / closed / cancelled; voided nets to zero) using the corrected
     logic, and overwrites both collections with the recomputed truth.
     Safe to run more than once — it is not additive. */
  async repairDailyRollups(){
    if (!this.shopId) return { ok:false, msg:'Sign in first' };
    if (this.role !== 'owner') return { ok:false, msg:'Only the shop owner can run this' };
    try {
      const rentals = [];
      let cursor = null;
      while (true){
        const base = collection(db,'rn_shops',this.shopId,'rentals');
        const q = cursor
          ? query(base, orderBy(documentId()), startAfter(cursor), limit(500))
          : query(base, orderBy(documentId()), limit(500));
        const snap = await getDocs(q);
        if (snap.empty) break;
        snap.docs.forEach(d => rentals.push(Object.assign({ id:d.id }, d.data())));
        cursor = snap.docs[snap.docs.length-1];
        if (snap.docs.length < 500) break;
      }

      const totals = {};
      const bump = (day, field, val) => {
        val = Number(val)||0;
        if (!day || !val) return;
        if (!totals[day]) totals[day] = { rentals:0, revenue:0, collected:0,
          depositsIn:0, depositsOut:0, outstanding:0, cashIn:0, upiIn:0, cashOut:0, upiOut:0 };
        totals[day][field] += val;
      };

      const vstats = {};   /* vehicleId -> { earned, closedTrips, lastOutAt } */
      const vbump = (vid, field, val) => {
        if (!vid) return;
        if (!vstats[vid]) vstats[vid] = { earned:0, closedTrips:0, lastOutAt:0 };
        if (field === 'lastOutAt') vstats[vid].lastOutAt = Math.max(vstats[vid].lastOutAt, Number(val)||0);
        else vstats[vid][field] += (Number(val)||0);
      };

      rentals.forEach(r => {
        /* Last-out time is a plain fact about the vehicle, true even for a
           rental that was later cancelled or voided — the bike genuinely
           left. Tracked before the void/skip check below. */
        vbump(r.vehicleId, 'lastOutAt', r.outAt);

        if (r.voidedAt || r.status === 'void') return;   /* voiding nets to zero everywhere else */

        /* Every rental that ever went out booked its deposit/advance on
           check-out day — this happens regardless of what became of it. */
        const pickupDay = r.dayKey || localDayKey(r.outAt);
        const dep = Number(r.depositHeld)||0, adv = Number(r.advancePaid)||0, outCash = Number(r.outCash)||0;
        bump(pickupDay, 'depositsIn', dep);
        bump(pickupDay, 'collected', adv);
        bump(pickupDay, 'cashIn', outCash);
        bump(pickupDay, 'upiIn', Math.max(0, (dep+adv) - outCash));

        if (r.status === 'closed'){
          bump(pickupDay, 'revenue', r.revenue);
          bump(pickupDay, 'rentals', 1);
          vbump(r.vehicleId, 'earned', r.revenue);
          vbump(r.vehicleId, 'closedTrips', 1);
          const settleDay = localDayKey(r.settledAt);
          const coll = Number(r.balanceCollected)||0, inCash = Number(r.inCash)||0;
          bump(settleDay, 'collected', coll);
          bump(settleDay, 'depositsOut', r.depositRefunded);
          bump(settleDay, 'outstanding', r.unpaid);
          bump(settleDay, 'cashIn', inCash);
          bump(settleDay, 'upiIn', Math.max(0, coll - inCash));
          const refundWasCash = (r.refundMode || 'cash') !== 'upi';
          bump(settleDay, 'cashOut', refundWasCash ? r.depositRefunded : 0);
          bump(settleDay, 'upiOut', refundWasCash ? 0 : r.depositRefunded);
        } else if (r.status === 'cancelled'){
          const cancelDay = localDayKey(r.cancelledAt || r.settledAt || r.outAt);
          bump(cancelDay, 'depositsOut', dep);
          bump(cancelDay, 'collected', -adv);
          /* Matches the fixed cancelGo: whatever came in (dep+adv) goes back
             out split exactly the way outCash recorded it, not guessed from
             the payment-mode label. */
          const inTotal = dep + adv;
          bump(cancelDay, 'cashOut', Math.min(inTotal, outCash));
          bump(cancelDay, 'upiOut', Math.max(0, inTotal - outCash));
        }
        /* status === 'open': the pickup-day booking above is the whole story. */
      });

      /* Every day that currently has a /daily doc must be included even if
         it recomputes to nothing — otherwise a day that should now read
         zero would keep showing its old, wrong number. Same reasoning for
         every vehicle that currently has a /vehicleStats doc. */
      const existing = await getDocs(collection(db,'rn_shops',this.shopId,'daily'));
      existing.docs.forEach(d => { if (!totals[d.id]) totals[d.id] = { rentals:0, revenue:0,
        collected:0, depositsIn:0, depositsOut:0, outstanding:0, cashIn:0, upiIn:0, cashOut:0, upiOut:0 }; });

      const days = Object.keys(totals);
      for (let i = 0; i < days.length; i += 400){
        const b = writeBatch(db);
        days.slice(i, i+400).forEach(day => {
          b.set(this.p('daily', day), Object.assign({}, totals[day], { updatedAt: Date.now(), repairedAt: Date.now() }));
        });
        await b.commit();
      }

      /* vehicleStats is a brand-new collection — a shop whose Firestore
         security rules haven't been redeployed to cover it yet will get
         "Missing or insufficient permissions" here specifically, not on
         /daily above. That must not take down the /daily repair that just
         succeeded: isolated in its own try, reported separately, so the
         Money-page numbers still get fixed even if Fleet's have to wait
         on a rules deploy.

         One retry on permission-denied specifically, same reasoning as the
         live listeners in open(): a button pressed moments after the rules
         actually finished propagating, or right after a fresh sign-in on a
         shaky connection, can hit the exact same timing race that showed up
         on /bookings and /vehicleStats in the console log that led to that
         fix — and this one-shot call had no retry of its own before now, so
         it reported the transient failure as final on the very first hit. */
      let vehicleErr = null, vids = [];
      const runVehicleStats = async () => {
        const existingV = await getDocs(collection(db,'rn_shops',this.shopId,'vehicleStats'));
        existingV.docs.forEach(d => { if (!vstats[d.id]) vstats[d.id] = { earned:0, closedTrips:0, lastOutAt:0 }; });
        vids = Object.keys(vstats);
        for (let i = 0; i < vids.length; i += 400){
          const b = writeBatch(db);
          vids.slice(i, i+400).forEach(vid => {
            const s = vstats[vid];
            b.set(this.p('vehicleStats', vid), {
              earned: s.earned, closedTrips: s.closedTrips,
              lastOutAt: s.lastOutAt || null,
              updatedAt: Date.now(), repairedAt: Date.now() });
          });
          await b.commit();
        }
      };
      try {
        await runVehicleStats();
      } catch(e){
        if ((e && e.code) === 'permission-denied'){
          await new Promise(res => setTimeout(res, 1500));
          try {
            await runVehicleStats();
          } catch(e2){
            console.error('repairDailyRollups(vehicleStats)', e2);
            vehicleErr = (e2 && e2.code) || 'unknown';
            vids = [];
          }
        } else {
          console.error('repairDailyRollups(vehicleStats)', e);
          vehicleErr = (e && e.code) || 'unknown';
          vids = [];
        }
      }

      return { ok:true, days: days.length, vehicles: vids.length, rentals: rentals.length, vehicleErr };
    } catch(e){
      console.error('repairDailyRollups', e);
      return { ok:false, code:(e&&e.code)||'unknown', msg:(e&&e.message)||'failed' };
    }
  },

  /* PayU hosted checkout. The client never sends an amount — it sends the
     plan, and the server prices it. That is the whole point: a price in the
     browser is a price a customer can edit. */
  async startCheckout(tier, cycle, promoCode){
    if (!this.shopId) return { ok:false, msg:'Sign in first' };
    try {
      const fn = httpsCallable(fns, 'payuCreateOrder');
      /* The code travels as a string and nothing else. The server re-evaluates
         it and decides the amount; the price shown on the review sheet is a
         preview, never an instruction. */
      const res = await fn({ product:'rentalnow', tier, cycle, shopId:this.shopId,
                             promoCode: promoCode || undefined });
      const d = (res && res.data) || {};
      if (!d.paymentUrl || !d.params) return { ok:false, msg:'Could not start payment' };

      /* Refuse to submit an order that is not unmistakably for this product.
         The two apps share one PayU module, and HisaabNow's plan table has a
         'pro' tier too — so an older deployed function that ignores `product`
         would happily price a RentalNow "Pro" order as HisaabNow Pro Annual
         and take real money for the wrong thing. The server names the plan in
         productinfo; if that name is not ours, nothing gets posted. */
      const info = String(d.params.productinfo || '');
      if (!/rentalnow/i.test(info)) {
        console.error('checkout product mismatch', info);
        return { ok:false, wrongProduct:true,
                 msg:'Payments are not set up for RentalNow yet. Nothing has been charged.' };
      }

      /* PayU's hosted page expects a form POST, not a redirect. */
      const form = document.createElement('form');
      form.method = 'POST'; form.action = d.paymentUrl; form.style.display = 'none';
      Object.keys(d.params).forEach(k => {
        const i = document.createElement('input');
        i.type = 'hidden'; i.name = k; i.value = d.params[k] == null ? '' : String(d.params[k]);
        form.appendChild(i);
      });
      document.body.appendChild(form);
      form.submit();
      return { ok:true };
    } catch(e){
      console.error('startCheckout', e);
      return { ok:false, msg: (e && (e.message || e.code)) || 'Payment could not start' };
    }
  },

  /* Preview a promo code. The product argument is not optional in practice:
     omit it and promo.js defaults to HisaabNow, whose Pro annual is ₹1,990
     against RentalNow's ₹24,990 — the discount would be computed off the
     wrong base and the shop would see a number PayU never honours. */
  async checkPromo(tier, cycle, code){
    try {
      const fn = httpsCallable(fns, 'validatePromo');
      const res = await fn({ product:'rentalnow', tier, cycle, code });
      return (res && res.data) || { valid:false, reason:'Could not check that code' };
    } catch(e){
      console.warn('checkPromo', e);
      return { valid:false, reason:'Could not check that code \u2014 try again' };
    }
  },

  /* Receipts are written by the webhook and are read-only here. Fetched on
     demand rather than kept on a listener: a shop looks at this screen once
     a year, and a permanent subscription would cost more than it returns.

     An empty result and a permission failure are different things and are
     reported differently — telling a shop "no payments found" when the read
     was actually denied sends them hunting for a payment that is right
     there in the database. */
  async fetchReceipts(){
    if (!this.shopId) return { ok:false, code:'nosignin', rows:[] };
    try {
      const snap = await getDocs(query(collection(db,'rn_shops',this.shopId,'receipts'),
        orderBy('at','desc'), limit(50)));
      return { ok:true, rows: snap.docs.map(d => Object.assign({ id:d.id }, d.data())) };
    } catch(e){
      /* An orderBy on a collection with no documents does not throw, so
         anything landing here is a rules or index problem, not emptiness. */
      console.warn('fetchReceipts', e);
      return { ok:false, code:(e && e.code) || 'unknown', rows:[] };
    }
  },

  /* ── staff ─────────────────────────────────────────────────────── */
  async addStaff(phone, role){
    const ph = String(phone||'').replace(/\D/g,'').slice(-10);
    if (ph.length!==10) return { ok:false, msg:'Enter a 10-digit number' };
    /* We cannot resolve a phone to a uid from the client, so the invite is
       keyed on the number and claimed when that person signs in. */
    try {
      await setDoc(this.p('invites', 'ph_'+ph), { phone: ph, role, invitedBy: this.uid, at: Date.now() });
      this.audit('staff.invite', ph, null, { role });
      return { ok:true };
    } catch(e){ return { ok:false, msg: e.code||e.message }; }
  },
  async claimInvites(){
    const ph = (auth.currentUser && auth.currentUser.phoneNumber || '').replace(/\D/g,'').slice(-10);
    if (!ph) return;
    try {
      const snap = await getDocs(query(collectionGroup(db,'invites'), where('phone','==',ph)));
      for (const d of snap.docs){
        const shopId = d.ref.parent.parent.id;
        const role = d.data().role || 'counter';
        await setDoc(doc(db,'rn_shops',shopId,'members',this.uid),
          { role, phone: ph, addedAt: serverTimestamp() });
        await setDoc(doc(db,'rn_members',this.uid),
          { shops: { [shopId]: role } }, { merge:true });
      }
    } catch(e){ console.warn('claimInvites', e); }
  },

  /* Returns a result instead of swallowing the failure. A bare "Save failed"
     tells the shop nothing and tells me nothing — the Firestore code is the
     whole diagnosis: permission-denied, unavailable and invalid-argument are
     three different problems with three different fixes. */
  async put(coll, id, data){
    this.pending++; this.chip();
    try {
      await setDoc(this.p(coll, id), data, { merge:true });
      return { ok:true };
    } catch(e){
      console.error('put ' + coll + '/' + id, e);
      return { ok:false, code: (e && e.code) || 'unknown', msg: (e && e.message) || '' };
    }
  },
  explainWrite(code){
    return ({
      'permission-denied':
        'Not allowed to change this. If you just created the business, sign out and back in.',
      'unavailable': 'No connection — it will save when you are back online.',
      'invalid-argument': 'A value was rejected.',
      'not-found': 'That record no longer exists.',
      'resource-exhausted': 'Too many writes at once — try again in a moment.'
    })[code] || ('Save failed [' + code + ']');
  },
  async softDelete(coll, id){
    await this.put(coll, id, { deletedAt: Date.now(), deletedBy: this.uid });
  },

  /* CHECK-OUT — transactional, and waits for signal rather than refusing */
  async checkout(rental, vehicleId){
    const attempt = async () => runTransaction(db, async tx => {
      const vRef = this.p('vehicles', vehicleId);
      const v = await tx.get(vRef);
      if (!v.exists()) throw new Error('missing');
      if (v.data().status !== 'available') throw new Error('taken');
      tx.update(vRef, { status:'rented', currentRentalId: rental.id });
      tx.set(this.p('rentals', rental.id), rental);
    });
    try { await attempt(); return { ok:true }; }
    catch(e){
      if (e && e.message === 'taken')   return { ok:false, reason:'taken' };
      if (e && e.message === 'missing') return { ok:false, reason:'missing' };
      /* Almost certainly no connection. Hold it and finish automatically. */
      return await this.waitAndRetry(attempt);
    }
  },

  waitAndRetry(attempt){
    return new Promise(resolve => {
      let done = false;
      const box = document.createElement('div');
      box.style.cssText='position:fixed;inset:0;z-index:800;background:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;padding:24px';
      box.innerHTML = `<div style="background:#fff;border-radius:16px;padding:22px;max-width:330px;text-align:center">
        <div style="font-size:30px">📡</div>
        <b style="display:block;font-size:16px;margin:8px 0 4px">Waiting for signal…</b>
        <div style="font-size:13px;color:#6B6B6B;line-height:1.5">
          Renting out needs a moment of internet so two staff can never hand out the same bike.
          This will finish on its own the second you are back online.</div>
        <button id="wr-cancel" style="margin-top:16px;width:100%;padding:12px;border:1.5px solid #E4E0D8;background:#fff;border-radius:11px;font-weight:700;cursor:pointer">Cancel</button>
      </div>`;
      document.body.appendChild(box);
      const finish = (res) => { if (done) return; done=true;
        try{ document.body.removeChild(box); }catch(e){}
        clearInterval(t); resolve(res); };
      box.querySelector('#wr-cancel').onclick = ()=>finish({ ok:false, reason:'cancelled' });
      const t = setInterval(async ()=>{
        if (!navigator.onLine) return;
        try { await attempt(); finish({ ok:true }); }
        catch(e){
          if (e && e.message==='taken')   finish({ ok:false, reason:'taken' });
          if (e && e.message==='missing') finish({ ok:false, reason:'missing' });
        }
      }, 2000);
    });
  },

  /* CHECK-IN — safe offline: the bike is physically back */
  async checkin(rentalId, vehicleId, patch, vpatch){
    this.pending++; this.chip();
    try {
      if (navigator.onLine) {
        await runTransaction(db, async tx => {
          const rRef = this.p('rentals', rentalId);
          const r = await tx.get(rRef);
          if (r.exists() && r.data().status !== 'open') throw new Error('settled');
          tx.update(rRef, patch);
          tx.update(this.p('vehicles', vehicleId), vpatch);
        });
      } else {
        const b = writeBatch(db);
        b.set(this.p('rentals', rentalId), patch, { merge:true });
        b.set(this.p('vehicles', vehicleId), vpatch, { merge:true });
        await b.commit();
      }
      return { ok:true };
    } catch(e){
      if (e && e.message==='settled') return { ok:false, reason:'settled' };
      console.error(e); return { ok:false, reason:'error' };
    }
  },

  /* ── history: paged, never a listener ─────────────────────────── */
  async history(cursor, n){
    /* orderBy('settledAt') alone: Firestore excludes documents that lack the
       field, and only a settled rental has settledAt — so this returns exactly
       the closed ones WITHOUT needing a composite index. One less thing that
       has to be deployed before the screen works. */
    const parts = [ collection(db,'rn_shops',this.shopId,'rentals'),
                    orderBy('settledAt','desc'), limit(n||25) ];
    if (cursor) parts.splice(3, 0, startAfter(cursor));
    const snap = await getDocs(query.apply(null, parts));
    return { rows: snap.docs.map(d=>Object.assign({id:d.id}, d.data())),
             cursor: snap.docs.length ? snap.docs[snap.docs.length-1] : null };
  },

  /* Recent settled rentals, for the "which bikes earn" panel. Bounded and
     fetched on demand rather than listened to, for the same reason as above. */
  async recentClosed(n){
    try {
      const snap = await getDocs(query(
        collection(db,'rn_shops',this.shopId,'rentals'),
        orderBy('settledAt','desc'), limit(n||400)));
      return snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    } catch(e){ console.warn('recentClosed', e); return []; }
  },

  /* ── sync status ──────────────────────────────────────────────── */
  chip(){
    const el = $('syncchip'); if (!el) return;
    const show = (txt, bg, fg) => {
      el.textContent = txt; el.style.background = bg; el.style.color = fg || '#fff';
      el.classList.add('show');
    };
    if (!this.online){
      clearTimeout(this._chipT);
      return show('⚠ Offline — saved on this phone', 'rgba(225,25,0,.9)');
    }
    if (this.pending > 0){
      clearTimeout(this._chipT);
      this._wasPending = true;
      return show('↑ Saving…', 'rgba(245,166,35,.95)', '#1A1207');
    }
    /* Confirm once, briefly, then get out of the way. */
    if (this._wasPending){
      this._wasPending = false;
      show('✓ Saved', 'rgba(6,193,103,.9)');
      clearTimeout(this._chipT);
      this._chipT = setTimeout(()=>{ try { el.classList.remove('show'); } catch(e){} }, 1800);
      return;
    }
    el.classList.remove('show');
  },
  explain(){
    window.alert(!this.online
      ? 'You are offline.\n\nReturns and edits are saved on this device and upload automatically.\nRenting out waits for signal, so the same ' + noun() + ' is never given to two customers.'
      : (this.pending>0 ? 'Saving your changes…' : 'Everything is saved to your account.'));
  },

  /* Hard delete, server-side. The rules deny client deletes on purpose, so
     this is the only route — and the function re-checks ownership itself
     rather than trusting whatever the phone claims. */
  async deleteShop(confirmName){
    try {
      const fn = httpsCallable(fns, 'deleteRentalShop');
      await fn({ shopId: this.shopId, confirmName });
      return { ok:true };
    } catch(e){
      console.error('deleteShop', e);
      return { ok:false, msg: (e && (e.message || e.code)) || 'failed' };
    }
  },

  /* Sign-out without the confirmation prompt, for flows that have already
     confirmed something more serious. */
  async hardSignOut(){
    try {
      localStorage.removeItem('rn_last_shop_' + this.uid);
      localStorage.removeItem('rn_last_role_' + this.uid);
    } catch(e){}
    this._unsub.forEach(f=>{try{f();}catch(e){}}); this._unsub=[];
    this.ready=false; this.shopId=null; this.role=null;
    try { await signOut(auth); } catch(e){}
  },

  async logout(){
    if (!confirm('Sign out of RentalNow?')) return;
    try {
      localStorage.removeItem('rn_last_shop_' + this.uid);
      localStorage.removeItem('rn_last_role_' + this.uid);
    } catch(e){}
    this._unsub.forEach(f=>{try{f();}catch(e){}}); this._unsub=[];
    this.ready=false; await signOut(auth); location.reload();
  }
};

window.Cloud = Cloud;
/* Sidebar state is restored before the first render so the layout does not
   flash open and then collapse. */
R.sideRestore();
R._wasWide = R.isWide();
window.addEventListener('resize', () => R.onResize());

Cloud.boot();
</script>
</body>
